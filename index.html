severity, and credibility. Triage is the “is this real and how bad is it?” step, typically performed immediately after alert generation or escalation. Pulling EDR logs, SIEM network patterns, and email gateway data is classic triage activity: it helps confirm maliciousness, identify the likely entry vector (phishing attachment vs. drive-by vs. lateral movement), and determine whether containment is needed. Evidence gathering and forensic analysis usually implies a deeper, formalized investigation once an incident is confirmed, including preservation actions, comprehensive artifact collection, and detailed root cause work. Notification is about informing stakeholders after classification and initial scoping. Incident recording and assignment is the ticketing/logging step (creating the case, assigning ownership), which the scenario does not emphasize. Because her stated objective is specifically to determine whether the alert represents a legitimate security incident and she is rapidly checking multiple telemetry sources for confirmation, the best fit is Incident Triage.","zq":"SOC 分析師 Jennifer 收到 Marcus 工作站可能有未授權活動的告警。她調閱端點 EDR 日誌、分析 SIEM 中的網路流量模式、並檢查郵件閘道日誌是否有惡意附件，目的是判斷此告警是否為真正的資安事件。她目前處於事件應變的哪個階段？","zo":["事件分級（Triage）","證據蒐集與鑑識分析","通報","事件記錄與指派"],"ze":"分級的核心問題是「這是真的嗎？有多嚴重？」快速交叉比對多種遙測以確認真偽、判斷入侵向量與是否需要圍堵，就是 Triage。證據蒐集與鑑識是確認事件後更深入、正式的調查。"},{"n":39,"c":"net","q":"Which of the following security technology is used to attract and trap people who attempt unauthorized or illicit utilization of the host system?","o":["De-Militarized Zone (DMZ)","Firewall","Honeypot","Intrusion Detection System"],"a":2,"e":"A honeypot is a security mechanism that serves as a decoy to attract and trap individuals attemptingunauthorized or illicit activities. It is designed to mimic a real system that appears vulnerable and valuable to attackers. The primary purpose of a honeypot is to distract attackers from legitimate targets, gather intelligence on attack strategies and behavior, and ultimately improve the overall security posture by learning from the attacks it captures.\nAttraction: The honeypot presents itself as an attractive target to potential attackers by simulating vulnerabilities.\nEngagement: Once theattackers engage with the honeypot, their activities are monitored and logged without their knowledge.\nAnalysis: The data collected from these interactions is then analyzed to understand attack patterns, techniques, and goals.\nImprovement: This intelligence is used to enhance security measures, such as updating firewall rules or improving intrusion detection systems.","zq":"下列哪一項安全技術用來吸引並誘捕試圖未授權或非法使用主機系統的人？","zo":["非軍事區（DMZ）","防火牆","誘捕系統（Honeypot）","入侵偵測系統"],"ze":"Honeypot 模擬看似有弱點、有價值的系統，引誘攻擊者互動並記錄其手法，以蒐集情資並轉移對真實資產的攻擊。"},{"n":40,"c":"ops","q":"NationalHealth, a government agency responsible for managing sensitive patient health records, is subject to strict data sovereignty regulations requiring all data to be stored and processed within the country’s borders. Leadership is concerned about outsourcing security operations and needs complete control over patient data handling. The agency faces increasing cyber threats and requires 24/7 security monitoring. They have a large budget and can hire many security professionals. Which SOC model is most suitable?","o":["Outsourced SOC model","Hybrid SOC model (expertise of an MSSP)","In-house/internal SOC model","A combination of multiple MSSPs"],"a":2,"e":"An in-house/internal SOC model best fits when data sovereignty, strict control of sensitive data, and operational independence are the top priorities—and when the organization has the budget and staffing capacity to operate 24/7. For a government agency handling health records, limiting third-party access reduces legal, compliance, and privacy risk. An internal SOC can ensure that telemetry, incident artifacts, and investigative outputs remain within national borders and under direct governance, supporting sovereignty mandates and chain-of-custody requirements. Outsourced or multi-MSSP models increase external data exposure and often require sharing logs, incident details, or access into systems—conflicting with the requirement for complete control. A hybrid model can be effective when internal capability is limited and external expertise is needed, but the prompt explicitly states the agency can hire many professionals and wants full control. From a SOC operations perspective, an in-house SOC also allows customization of playbooks, escalation paths, and compliance reporting aligned to government standards, and it reduces dependency on vendor timelines during high-severity incidents. Therefore, the most suitable model is in-house\n/internal SOC.","zq":"NationalHealth 是管理敏感病歷的政府機關，受嚴格的資料主權法規約束，所有資料須在國內儲存與處理。領導層擔心外包資安作業，需要完全掌控病患資料。機關面臨增加中的攻擊，需要 24/7 監控，且預算充足、可聘用大量資安人員。最適合哪一種 SOC 模式？","zo":["外包 SOC 模式","混合 SOC 模式（借助 MSSP 專業）","內部自建 SOC 模式","多家 MSSP 組合"],"ze":"資料主權、完全掌控、預算與人力皆充足，最適合內部自建 SOC，避免第三方接觸敏感資料。外包、多 MSSP 或混合模式都會增加資料外部暴露；混合模式適合內部能力不足時。"},{"n":41,"c":"log","q":"Which of the following directory will contain logs related to printer access?","o":["/var/log/cups/Printer_log file","/var/log/cups/access_log file","/var/log/cups/accesslog file","/var/log/cups/Printeraccess_log file"],"a":1,"e":"CUPS (Common UNIX Printing System) stores printer access records in /var/log/cups/access_log (alongside error_log and page_log).","zq":"下列哪一個檔案包含與印表機存取相關的日誌？","zo":["/var/log/cups/Printer_log 檔","/var/log/cups/access_log 檔","/var/log/cups/accesslog 檔","/var/log/cups/Printeraccess_log 檔"],"ze":"Linux 列印系統 CUPS 的存取紀錄位於 /var/log/cups/access_log，另有 error_log 與 page_log。（原 PDF 此題解析誤植為鑑識實驗室內容，已略去）"},{"n":42,"c":"siem","q":"A health corporation is implementing a SIEM solution to improve detection and response and comply with HIPAA requirements. They need the SIEM to efficiently collect, analyze, and correlate security events from network devices, servers, and security applications, and generate timely alerts for potential HIPAA violations. Which capability is needed to meet these needs?","o":["Threat hunting and intelligence","Centralized SIEM implementation","Log management and security analytics","Log collection through agents"],"a":2,"e":"To meet the stated needs—collecting, analyzing, correlating, and alerting—log management and security analytics is the core SIEM capability set. Log management covers ingestion, parsing, normalization, storage, retention, and search. Security analytics covers detection rules, correlations, behavioral analytics, alerting, and dashboards that turn raw events into actionable incidents. These functions are essential for identifying potential HIPAA violations (unauthorized access, anomalous data access, improper privilege use) and producing timely alerts and audit evidence. “Centralized SIEM implementation” is an architectural statement rather than a capability; centralization helps but doesn’t describe the functions needed. “Log collection through agents” is one ingestion method and is important for coverage, but by itself it doesn’t provide analysis and correlation. Threat hunting and intelligence are valuable enhancements, but the requirement described is the baseline SIEM function: manage logs and apply analytics to detect and alert. From a SOC standpoint, this also supports compliance because strong log management with tuned analytics enables both real-time incident response and retrospective investigations with reliable retention and audit trails.","zq":"某醫療機構導入 SIEM 以改善偵測與回應並符合 HIPAA。需要 SIEM 有效收集、分析並關聯網路設備、伺服器與資安應用的事件，並即時對可能違反 HIPAA 的情況發出告警。需要哪一項能力？","zo":["威脅獵捕與情報","集中式 SIEM 實作","日誌管理與安全分析","透過代理程式收集日誌"],"ze":"收集、剖析、儲存、保存屬於日誌管理；偵測規則、關聯、行為分析、告警屬於安全分析。兩者合起來正是題目需求。集中化只是架構描述；代理收集只是一種收集方式；獵捕與情報是進階加值。"},{"n":43,"c":"siem","q":"Robin, a SOC engineer in a multinational company, is planning to implement a SIEM. He realized that his organization is capable of performing onlyCorrelation, Analytics, Reporting, Retention, Alerting, and Visualization required for the SIEM implementation and has to take collection and aggregation services from a Managed Security Services Provider (MSSP).\nWhat kind of SIEM is Robin planning to implement?","o":["Self-hosted, Self-Managed","Self-hosted, MSSP Managed","Hybrid Model, Jointly Managed","Cloud, Self-Managed"],"a":2,"e":"In the scenario described, Robin's organization is capable of handling several critical SIEM functions internally, such as Correlation, Analytics, Reporting, Retention, Alerting, and Visualization. However, they need to outsource the collection and aggregation services to a Managed Security Services Provider (MSSP). This setup indicates a Hybrid Model of SIEM implementation, where both the organization and the MSSP share responsibilities for managing different aspects of the SIEM. The term \"Jointly Managed\"further clarifies that both parties - the organization and the MSSP - will have active roles in the SIEM's operation, albeit in different capacities. This approach combines the advantages of in-house management with the expertise and resources of an MSSP, offering a balanced solution tailored to the organization's specific capabilities and needs.","zq":"跨國公司的 SOC 工程師 Robin 計畫導入 SIEM。他發現組織只能自行負責關聯、分析、報表、保存、告警與視覺化，必須向 MSSP 取得收集與彙整服務。Robin 要導入哪種 SIEM？","zo":["自建，自行管理","自建，MSSP 管理","混合模式，共同管理","雲端，自行管理"],"ze":"組織負責部分功能、MSSP 負責另一部分（收集與彙整），雙方分工即為「混合模式、共同管理（Hybrid, Jointly Managed）」。"},{"n":44,"c":"siem","q":"In which log collection mechanism, the system or application sends log records either on the local disk or over the network.","o":["rule-based","pull-based","push-based","signature-based"],"a":2,"e":"In a push-based log collection mechanism, the system or application actively sends (or “pushes”) log records to a designatedstorage location, which can be either on the local disk or over a network to a remote server. This is in contrast to a pull-based mechanism, where the log records are retrieved (or “pulled”) by the management server from the devices.\nThe push-based mechanism is often used for real-time monitoring and alerting because it allows for immediate transfer of log data as events occur. This method ensures that log records are consistently and reliably sent to a central repository without the need for a third-party service to request or retrieve them.","zq":"在哪一種日誌收集機制中，系統或應用程式會主動把日誌寫到本機磁碟或透過網路送出？","zo":["規則式（rule-based）","拉取式（pull-based）","推送式（push-based）","特徵碼式（signature-based）"],"ze":"Push-based：由裝置或應用程式主動送出日誌（例如 syslog 送到收集器），適合即時監控。Pull-based：由收集伺服器主動向裝置取回日誌（例如 WMI、API 輪詢）。"},{"n":45,"c":"cti","q":"A newly hired SOC analyst at a fast-growing multinational organization must quickly assess the company’s external exposure and identify potential security risks. Techniques considered include analyzing publicly available information, scanning exposed services, reviewing DNS records, and gathering external intelligence. Due to the scale across subsidiaries, cloud environments, and third-party integrations, some methods may not scale well and may lead to delays or incomplete insights. Which technique is less practical for handling large or diverse data sets in this scenario?","o":["DNS lookup","Web enumeration","OSINT","Stack counting"],"a":3,"e":"Stack counting is less practical for large, diverse infrastructures because it is often a manual, piecemeal method of identifying and categorizing technology stacks across many assets. In complex multinationals, external exposure spans multiple domains, cloud tenants, third parties, and business units; a “stack counting” approach can become slow, incomplete, and quickly outdated without automation and authoritative asset inventories. DNS lookups can be automated at scale to map domains, subdomains, and records, making them practical for large environments. Web enumeration can also be scaled using automated scanners and discovery tooling (with appropriate authorization), though it may require careful rate limits and scoping. OSINT can scale through specialized tooling and feeds, though validation is necessary. Compared to these, stack counting is typically the least scalable approach because it relies heavily on manual inference and continuous revalidation. From a SOC standpoint, scalable exposure assessment depends on automated asset discovery, DNS and certificate transparency analysis, cloud inventory, and controlled scanning—methods that can cover breadth without relying on manual “counting stacks” across thousands of assets.","zq":"新進 SOC 分析師需快速評估一家快速成長跨國公司的外部暴露面，考慮的技術包括分析公開資訊、掃描暴露服務、檢視 DNS 紀錄、蒐集外部情資。由於橫跨子公司、雲端與第三方整合，有些方法擴充性不佳。哪一項技術最不適合處理大量或多樣的資料？","zo":["DNS 查詢","Web 列舉","OSINT（開源情報）","堆疊計數（Stack counting）"],"ze":"堆疊計數多為人工、零散地歸類技術堆疊，在數千項資產的大型環境中既慢又容易過時。DNS 查詢、Web 列舉與 OSINT 都能透過自動化工具大規模執行。"},{"n":46,"c":"log","q":"Which of the following data source will a SOC Analyst use to monitor connections to the insecure ports?","o":["Netstat Data","DNS Data","IIS Data","DHCP Data"],"a":0,"e":"A SOC Analyst would use Netstat Data tomonitor connections to insecure ports. Netstat, which stands for network statistics, is a command-line tool that displays incoming and outgoing network connections (both TCP and UDP), routing tables, and a number of network interface and network protocol statistics. It is available on various operating systems, including Windows, Linux, and Unix, and is used for finding problems in the network and to determine the amount of traffic on the network as a performance measurement.","zq":"SOC 分析師會使用哪一種資料來源來監控連往不安全埠號的連線？","zo":["Netstat 資料","DNS 資料","IIS 資料","DHCP 資料"],"ze":"netstat 會列出目前 TCP/UDP 連線、監聽埠與對應位址，可直接看出是否有連往不安全埠（如 23、21、445）的連線。"},{"n":47,"c":"ir","q":"Sarah Chen is a Level 1 SOC analyst at Centex Healthcare. The SOC detected a potential data breach involving unauthorized access to patient records. Multiple departments need constant updates: Legal needs HIPAA compliance implications, HR needs to coordinate staff training responses, and the MSSP requires technical details to assist containment. Which role serves as the central point of communication between these stakeholders?","o":["Incident coordinator","Public relations manager","Incident manager","Information security officer"],"a":0,"e":"An incident coordinator is the role most directly responsible for orchestrating communications among stakeholders during an incident. In SOC operations, complex incidents require structured updates to ensure legal, HR, leadership, IT, and external partners (such as an MSSP) receive timely, accurate, and role-appropriate information without overloading technical responders. The coordinator manages the communication cadence (status calls, written updates), ensures action items are tracked, and keeps information consistent across teams. The incident manager typically owns overall incident command and decision-making, but the coordinator role is specifically focused on coordination and communication flow—\nacting as the central hub. A public relations manager handles external communications and media, which is not the primary need described. An information security officer is a leadership/governance role and may be involved in oversight, but they do not usually run day-to-day incident comms coordination. In healthcare, where HIPAA implications can introduce strict notification and documentation requirements, having a dedicated incident coordinator helps maintain disciplined communication, reduces confusion, supports compliance evidence, and allows technical responders to focus on containment and investigation.","zq":"Centex Healthcare 的 L1 SOC 分析師 Sarah Chen 所在 SOC 偵測到病歷可能遭未授權存取。多個部門需要持續更新：法務要知道 HIPAA 影響、人資要協調員工訓練、MSSP 需要技術細節協助圍堵。哪個角色是這些利害關係人之間的溝通中樞？","zo":["事件協調者（Incident coordinator）","公關經理","事件經理（Incident manager）","資訊安全官"],"ze":"事件協調者負責整合跨部門溝通、更新頻率與待辦追蹤，確保資訊一致，讓技術人員專注處理。事件經理偏重指揮與決策；公關處理對外媒體；資安官屬治理監督角色。"},{"n":48,"c":"ir","q":"One week after a ransomware attack disrupted operations, Sarah, a SOC analyst, leads a review meeting with the IT team, security engineers, and business unit representatives. The group reviews the incident timeline, calculates a business impact of $157,000 due to downtime and data loss, and identifies seven critical improvements to enhance detection and response processes. Which of the following Incident Response phase is this?","o":["Recovery","Post-Incident Activities","Eradication","Containment"],"a":1,"e":"This is the “Post-Incident Activities” phase, commonly known as lessons learned or post-incident review. The defining elements are present: the incident is already over (one week later), stakeholders are reviewing the timeline, calculating business impact, and identifying improvements to processes and controls. In SOC practice, this phase focuses on improving readiness and reducing recurrence by documenting what happened, what worked, what failed, and what should change. Typical outputs include updated playbooks/runbooks, improved detection logic, better alert triage workflows, logging and telemetry enhancements, refined escalation paths, improved backup/restore procedures, and training actions. Recovery is about restoring services and operations (rebuild systems, restore data, validate return-to-service), which is not the primary activity described. Eradication is removing the threat from the environment (remove malware, close persistence, patch exploited vulnerabilities). Containment is stopping spread and limiting damage during the incident. Since the group is assessing impact and creating improvement actions after operations have resumed, the correct classification is Post-Incident Activities.","zq":"勒索軟體攻擊癱瘓營運一週後，SOC 分析師 Sarah 帶領 IT、資安工程與業務單位開檢討會，回顧事件時間軸，估算停機與資料遺失造成 15.7 萬美元損失，並提出七項改善偵測與回應的措施。這是事件應變的哪個階段？","zo":["復原","事後活動","根除","圍堵"],"ze":"事件結束後回顧時間軸、計算業務衝擊、提出改進措施，就是事後活動（Lessons Learned）。產出通常包括更新劇本、偵測規則、備份還原程序與教育訓練。"},{"n":49,"c":"siem","q":"A security team is configuring a newly deployed SIEM system. With limited resources, they must prioritize monitoring scenarios that provide the greatest security benefit. The team understands an effective SIEM relies on well-defined use cases tailored to the organization’s environment. Which factor should guide their selection of use cases?","o":["Select use cases based on the availability and quality of data from existing data sources","Prioritize use cases that address zero-day attacks","Implement as many use cases as the SIEM supports to cover all threats","Focus on use cases required to meet industry compliance standards"],"a":0,"e":"Use cases should be selected based on the availability and quality of data because detections cannot work without reliable telemetry. In SOC engineering, the first constraint is data: what sources exist, how complete they are, how quickly they arrive, and whether fields are parsable and consistent. Choosing use cases that your environment can actually support produces faster time-to-value, fewer false positives, and fewer blind spots. Prioritizing “zero-day” use cases is too vague and often unrealistic, because zero-days vary widely and require strong behavioral telemetry and baselines. Implementing as many use cases as possible spreads resources thin and increases noise, creating alert fatigue. Compliance-driven use cases are important, but if the underlying data is missing or poor quality, compliance rules will still fail operationally and can create a false sense of security. A mature approach is: start with high-value, high-feasibility detections that match available data (identity compromise, suspicious admin actions, endpoint malware, critical network anomalies), then expand as data coverage improves. Therefore, data availability and quality should guide initial use case selection.","zq":"資安團隊正在設定新部署的 SIEM，資源有限，必須優先挑選最有安全效益的監控情境。應以哪個因素作為選擇使用案例的依據？","zo":["依現有資料來源的可用性與品質選擇使用案例","優先處理針對零時差攻擊的使用案例","盡可能實作 SIEM 支援的所有使用案例","只專注於產業法規要求的使用案例"],"ze":"偵測規則沒有可靠資料就無法運作，所以應先挑選現有資料能支撐的高價值使用案例，再隨資料涵蓋率擴充。「零時差」過於模糊；全部實作會造成告警疲勞；只做合規案例若資料不足仍會失效。"},{"n":50,"c":"ir","q":"Sarah, a financial analyst at a multinational corporation, is suspected of leaking sensitive financial data to an unauthorized external party. The SOC team observed anomalous data transfer patterns originating from her account, flagged by the SIEM, indicating potential data exfiltration. The incident response team must contain the incident swiftly to minimize data loss and protect critical assets. As a SOC analyst, which should be prioritized as the initial containment measure?","o":["Access control","Change passwords regularly","Isolate the storage","Data-Centric Audit and Protection (DCAP)"],"a":0,"e":"Initial containment for suspected data exfiltration by a specific user account should prioritize immediately restricting that account’s ability to access and transfer data. “Access control” is the broad containment category that includes disabling the account, suspending sessions, revoking tokens, removing access to sensitive shares, and applying conditional access blocks. This is the fastest way to stop ongoing data loss while preserving evidence for investigation. “Change passwords regularly” is a general security hygiene practice, not an initial incident containment action, and it may not stop exfiltration quickly if active sessions or tokens remain valid. “Isolate the storage” can be appropriate if a particular repository is being actively exfiltrated, but it can be disruptive to business operations and may not address the actor’s continued access paths across other systems. DCAP is a programmatic capability for monitoring and controlling data access over time; it is valuable, but it is not the immediate first step when the SOC must rapidly stop suspected exfiltration. From a SOC playbook view, the initial action is to reduce attacker/insider access immediately (account restriction), then scope what data was accessed, preserve logs, and coordinate with HR/legal for insider procedures.","zq":"財務分析師 Sarah 疑似將敏感財務資料洩漏給外部未授權對象，SIEM 標記其帳號有異常資料傳輸。事件應變團隊必須迅速圍堵以減少損失。身為 SOC 分析師，應優先採取哪一項初步圍堵措施？","zo":["存取控制","定期變更密碼","隔離儲存設備","以資料為中心的稽核與保護（DCAP）"],"ze":"針對特定帳號的外洩，最快的止血方式是立即限制該帳號存取：停用帳號、終止工作階段、撤銷權杖、移除敏感資料權限。定期換密碼是日常衛生；隔離儲存會影響業務；DCAP 是長期能力而非立即措施。"},{"n":51,"c":"cti","q":"Which of the following threat intelligence is used by a SIEM for supplying the analysts with context and \"situational awareness\" by using threat actor TTPs, malwarecampaigns, tools used by threat actors.\n1.Strategic threat intelligence\n2.Tactical threat intelligence\n3.Operational threat intelligence\n4.Technical threat intelligence","o":["2 and 3","1 and 3","3 and 4","1 and 2"],"a":0,"e":"Tactical threat intelligence (adversary TTPs, tools) and operational threat intelligence (specific campaigns, attacker capabilities and intent) provide SOC analysts with context and situational awareness in the SIEM.","zq":"下列哪些威脅情報會被 SIEM 用來提供分析師情境與「態勢感知」，內容包含攻擊者 TTP、惡意程式行動與攻擊者使用的工具？\n1. 策略型威脅情報\n2. 戰術型威脅情報\n3. 營運型威脅情報\n4. 技術型威脅情報","zo":["2 和 3","1 和 3","3 和 4","1 和 2"],"ze":"戰術型情報描述攻擊者 TTP 與工具；營運型情報描述特定攻擊行動、攻擊者能力與意圖，兩者都能給 SIEM 分析師情境與態勢感知。策略型面向高層決策；技術型著重 IoC（IP、雜湊）供自動化封鎖。"},{"n":52,"c":"log","q":"Which of the following command is used to enable logging in iptables?","o":["$ iptables -B INPUT -j LOG","$ iptables -A OUTPUT -j LOG","$ iptables -A INPUT -j LOG","$ iptables -B OUTPUT -j LOG"],"a":2,"e":"The command to enable logging in iptables for incoming packets is $iptables -A INPUT -j LOG. This command appends a rule to the INPUT chain that logs the packet information. The -A flag is used to append the rule to the end of the specified chain, which in this case is INPUT, indicating that the rule applies to incoming packets. The -j LOG part of the command specifies the target of the rule, which is LOG, meaning that the packet will be logged.","zq":"下列哪一個指令可在 iptables 中啟用日誌記錄？","zo":["$ iptables -B INPUT -j LOG","$ iptables -A OUTPUT -j LOG","$ iptables -A INPUT -j LOG","$ iptables -B OUTPUT -j LOG"],"ze":"-A 表示把規則附加（Append）到鏈的尾端，INPUT 鏈處理進入的封包，-j LOG 目標會把封包資訊寫入核心日誌。iptables 沒有 -B 參數。"},{"n":53,"c":"hunt","q":"As a SOC Administrator at a mid-sized financial institution, you noticed intermittent network slowdowns and unexplained high memory usage across multiple critical systems. Your initial analysis found no traces of malware, but a forensic investigation revealed unauthorized scheduled tasks that executed during off-peak hours. These tasks ran obfuscated scripts that connected to an external command-and-control (C2) server. Further investigations showed that the adversary had gained access months ago through a compromised VPN account, leveraging stolen credentials from a phishing campaign. Which phase of the Advanced Persistent Threat (APT) lifecycle does this scenario align with?","o":["Cleanup","Initial Intrusion","Search and Exfiltration","Persistence"],"a":3,"e":"This scenario best aligns with Persistence because the attacker established mechanisms to maintain access over time after the initial compromise. The defining evidence is “unauthorized scheduled tasks executed during off-peak hours” running obfuscated scripts and connecting to a C2 server. Scheduled tasks and startup mechanisms are classic persistence techniques that allow an adversary to survive reboots, re-establish footholds, and perform recurring actions (beaconing, payload retrieval, credential harvesting) without continuous interactive access. The scenario explicitly states the adversary gained access months ago via compromised VPN credentials (initial intrusion), but what you are observing now is the long-lived foothold and automated re-entry capability. Cleanup would involve covering tracks and removing evidence; while obfuscation and potential log manipulation can be related, the core described behavior is recurring execution and ongoing C2 communication. Search and exfiltration would focus on data discovery and transfer; while network slowdowns could be related to exfiltration, the most direct indicators here are persistence mechanisms enabling continued control. For SOC response, this phase emphasizes removing persistence artifacts, rotating credentials, and validating no alternate footholds remain.","zq":"你是某中型金融機構的 SOC 管理員，發現多台關鍵系統間歇性變慢、記憶體使用率異常。初步未發現惡意程式，但鑑識發現未授權的排程工作在離峰時段執行混淆腳本並連線外部 C2。進一步調查顯示攻擊者數月前透過網釣竊得的 VPN 帳號入侵。此情境對應 APT 生命週期的哪個階段？","zo":["清除痕跡（Cleanup）","初始入侵","搜尋與外洩","持續潛伏（Persistence）"],"ze":"排程工作重複執行混淆腳本並回連 C2，是典型的持久化機制，讓攻擊者在重開機後仍保有立足點。VPN 帳號入侵是早已發生的初始入侵；目前觀察到的是長期潛伏階段。"},{"n":54,"c":"cti","q":"During a threat intelligence briefing, a SOC analyst comes across a classified report detailing a sophisticated cybercrime syndicate targeting executives of high-profile financial institutions. These adversaries rarely leave digital footprints and seem to anticipate security measures. Several breaches began with seemingly innocent conversations: a foreign journalist requesting an interview with a CEO and a “security consultant” offering free risk assessments. Further investigation reveals attackers socially engineered employees, manipulated trust, and extracted critical security details long before launching technical attacks. The analyst decides to focus on intelligence involving deception detection and psychological profiling to uncover true intent and methods. Which type of intelligence is the analyst leveraging?","o":["Human Intelligence","Threat Intelligence Feeds","Open-Source Intelligence (OSINT)","Technical Threat Intelligence"],"a":0,"e":"Human Intelligence (HUMINT) involves information gathered from people, relationships, and human behavior rather than purely technical artifacts. The scenario describes adversaries using social engineering and pretexting—building trust through conversations and manipulating employees to reveal sensitive information. The analyst is focusing on deception detection and psychological profiling, which are rooted in understanding human intent, influence tactics, and interpersonal manipulation patterns. That aligns with HUMINT, where insights may come from interviews, insider reporting, investigative findings, or controlled engagements that reveal motivations and methods that logs will not show. Threat intelligence feeds and technical threat intelligence primarily provide machine-consumable indicators, malware signatures, infrastructure data, and observed TTPs; they are valuable but not the main lens here because these attackers “rarely leave digital footprints.” OSINT is derived from publicly available sources, which can help identify personas or prior campaigns, but the core described intelligence method is interpreting human behavior and social manipulation. From a SOC standpoint, HUMINT-driven insights inform security awareness training, executive protection protocols, identity verification procedures, and “out-of-band” validation processes that reduce success of pretexting and business email compromise.","zq":"某份機密報告描述一個專門鎖定金融機構高層的犯罪集團，幾乎不留數位足跡，還能預判資安措施。多起入侵都始於看似無害的對話：外國記者邀訪 CEO、「資安顧問」提供免費風險評估。攻擊者社交工程員工、操弄信任，在技術攻擊前就套出關鍵資訊。分析師決定專注於識破欺騙與心理側寫。他運用的是哪種情報？","zo":["人員情報（HUMINT）","威脅情資訂閱源","開源情報（OSINT）","技術型威脅情報"],"ze":"HUMINT 來自人、人際關係與人類行為，著重意圖、影響手法與社交操弄。此攻擊者幾乎不留數位痕跡，因此情資訂閱、技術情報與 OSINT 都不是核心。HUMINT 可用於強化高層防護與「帶外驗證」程序。"},{"n":55,"c":"risk","q":"Which of the following is a set of standard guidelines for ongoing development, enhancement, storage, dissemination and implementation of security standards for account data protection?","o":["FISMA","HIPAA","PCI-DSS","DARPA"],"a":2,"e":"PCI-DSS stands for Payment Card Industry Data Security Standard. It is a set of security standards designed to ensure that all companies that accept, process, store, or transmit credit card information maintain a secure environment. The PCI-DSS is a widely recognized set of guidelines that includes requirements for security management, policies, procedures, network architecture, software design, and other critical protective measures. This comprehensive standard is intended to help organizations proactivelyprotect customer account data.","zq":"下列何者是一套針對帳戶（持卡人）資料保護，持續發展、強化、儲存、傳播與實施安全標準的準則？","zo":["FISMA","HIPAA","PCI-DSS","DARPA"],"ze":"PCI-DSS（支付卡產業資料安全標準）要求所有接受、處理、儲存或傳輸信用卡資料的組織維持安全環境。FISMA 為美國聯邦資訊安全法；HIPAA 為醫療資料法規；DARPA 是美國國防研究機構。"},{"n":56,"c":"web","q":"A SOC team at a major financial institution detects unauthorized access attempts on its web application. Logs indicate the web application is compromised. To determine the exact attack technique and implement mitigation, forensic investigators assess cookie attributes (such as HttpOnly, Secure, and SameSite) for security weaknesses and track anomalous request patterns that deviate from normal user behavior. Which attack vector is the forensic team investigating?","o":["Session poisoning","Man-in-the-middle (MITM) attack","Cross-site scripting (XSS)","SQL injection"],"a":0,"e":"The focus on cookie attributes (HttpOnly, Secure, SameSite) strongly aligns with session security and session integrity. These attributes are designed to protect session cookies from being stolen or misused: HttpOnly limits JavaScript access to cookies, Secure restricts cookies to HTTPS, and SameSite reduces cross-site request risks. When investigators assess these settings, they are often evaluating whether session tokens could be manipulated, injected, fixed, or abused—behaviors consistent with session poisoning and related session attacks. While XSS can be used to steal cookies, the investigation described is not centered on injected script payloads in application responses; it is centered on cookie security posture and abnormal request patterns tied to sessions. SQL injection is primarily about manipulating database queries and would be investigated through query-related payloads and database error patterns rather than cookie attribute review. MITM attacks can intercept session cookies if transport security is weak, but the question emphasizes cookie attribute weaknesses and anomalous session request patterns—more directly associated with session poisoning/session hijacking analysis. In SOC response, confirming session attack vectors typically leads to rotating session secrets, invalidating active sessions, tightening cookie flags, enforcing TLS, and adding anomaly detection for session token reuse and impossible travel.","zq":"某大型金融機構 SOC 偵測到 Web 應用遭未授權存取，日誌顯示已遭入侵。鑑識人員檢查 Cookie 屬性（HttpOnly、Secure、SameSite）是否有弱點，並追蹤偏離正常使用者行為的異常請求模式。鑑識團隊調查的是哪一種攻擊向量？","zo":["工作階段下毒（Session poisoning）","中間人攻擊（MITM）","跨站腳本（XSS）","SQL 注入"],"ze":"檢查 Cookie 安全屬性與異常的工作階段請求，聚焦於工作階段完整性，對應 Session poisoning／劫持。XSS 雖可竊 Cookie，但調查重點會是注入的腳本；SQL 注入看查詢語法；MITM 看傳輸層。"},{"n":57,"c":"net","q":"What is the process of monitoring and capturing all data packets passing through a given network using different tools?","o":["Network Scanning","DNS Footprinting","Network Sniffing","Port Scanning"],"a":2,"e":"Networksniffing is the process of monitoring and capturing all data packets passing through a given network. This is typically done using specialized software or hardware tools designed for this purpose. Here’s a detailed explanation of the process:\nMonitoring Traffic: Network sniffing involves using a tool to monitor the data flowing over the network. This can include all types of data packets, regardless of where they come from or where they are going.\nCapturing Packets: The tool captures each packet that passes through the network. This includes the packet’s header, which contains information about the packet’s source, destination, and other metadata, as well as the payload, which is the actual data being transmitted.\nAnalysis: Once captured, the packets can be analyzed for various purposes, such as troubleshooting network issues, monitoring network performance, or detecting security threats.\nTools Used: There are many tools available for network sniffing, with Wireshark being one of the most popular and widely used due to its powerful features and flexibility1.","zq":"使用各種工具監控並擷取通過某網路的所有資料封包，這個過程稱為？","zo":["網路掃描","DNS 足跡探查","網路嗅探（Sniffing）","埠掃描"],"ze":"網路嗅探是擷取並分析經過網路的封包（標頭與酬載），代表工具為 Wireshark、tcpdump。掃描類則是主動探測主機或埠。"},{"n":58,"c":"cloud","q":"SecureTech Inc. operates critical infrastructure and applications in AWS. The SOC detects suspicious activities such as unexpected API calls, unusual outbound traffic from instances, and DNS requests to potentially malicious domains. They need a fully managed AWS security service that continuously monitors for malicious activity, analyzes CloudTrail logs, VPC Flow Logs, and DNS query logs, leverages machine learning and threat intelligence, and provides actionable findings. Which AWS service best fits?","o":["Amazon Macie","AWS Config","AWS Security Hub","Amazon GuardDuty"],"a":3,"e":"Amazon GuardDuty is the fully managed AWS threat detection service designed to analyze CloudTrail events, VPC Flow Logs, and DNS logs to identify suspicious and malicious activity. It uses threat intelligence and behavioral models to detect patterns such as unusual API calls, anomalous network connections (including known malicious destinations), and suspicious DNS activity—directly matching the scenario requirements. Macie is focused on discovering and protecting sensitive data (especially in S3) through classification and data exposure detection, not broad threat detection across API/network/DNS. AWS Config is a configuration compliance and drift monitoring service; it tracks resource configurations and policy compliance but does not provide threat detection based on network and activity logs. Security Hub aggregates and normalizes findings from multiple AWS security services and partners; it is a central view and compliance\n/finding management layer, but it relies on services like GuardDuty to generate threat findings. From a SOC perspective, GuardDuty provides the near-real-time detection signals the team needs, and those findings can be forwarded to SIEM/SOAR workflows for triage and response.","zq":"SecureTech 在 AWS 上運行關鍵服務，SOC 偵測到異常 API 呼叫、執行個體異常外連流量，以及對可疑網域的 DNS 查詢。他們需要一個全代管的 AWS 服務，持續監控惡意活動、分析 CloudTrail、VPC Flow Logs 與 DNS 查詢日誌，運用機器學習與威脅情資產生可行動的發現。最適合哪一個服務？","zo":["Amazon Macie","AWS Config","AWS Security Hub","Amazon GuardDuty"],"ze":"GuardDuty 是 AWS 全代管威脅偵測服務，正是分析 CloudTrail、VPC Flow Logs、DNS 日誌。Macie 專注於 S3 敏感資料探索；Config 追蹤設定合規；Security Hub 彙整各服務的發現，本身不產生威脅偵測。"},{"n":59,"c":"risk","q":"Lisa Carter, a SOC analyst at a financial services firm, is performing a risk assessment following suspicious alerts detected by the SIEM. She evaluates three key factors: the likelihood of an attack succeeding based on current threat intelligence, the impact on critical business operations if the breach occurs, and the value of the assets targeted (e.g., customer data, financial systems). Using the standard risk assessment approach, which scenario represents the highest risk to the organization?","o":["High Likelihood, High Impact, High Asset Value","Low Likelihood, High Impact, Low Asset Value","Low Likelihood, Low Impact, High Asset Value","High Likelihood, Low Impact, High Asset Value"],"a":0,"e":"The highest risk is the scenario where all contributing factors are high: likelihood, impact, and asset value. Risk is commonly treated as a function of probability and consequence; many organizations also incorporate asset value or criticality into consequence. When likelihood is high, the threat is more probable to materialize. When impact is high, the organization faces significant operational disruption, financial loss, and regulatory exposure. When asset value is high, the target represents highly sensitive or business-critical data/systems, which amplifies both the harm and urgency. Therefore, “High Likelihood, High Impact, High Asset Value” clearly produces the maximum risk rating. The other scenarios reduce at least one dimension: low likelihood reduces probability, low impact reduces consequence, and low asset value reduces business criticality and potential damage. In SOC practice, the highest-risk scenario drives immediate prioritization: faster containment, more aggressive monitoring, executive visibility, and resourcing for incident response. It also influences long-term control investments (identity hardening, segmentation, monitoring coverage, and detection engineering) because it represents the greatest potential harm combined with high probability.","zq":"金融公司 SOC 分析師 Lisa 在 SIEM 告警後進行風險評估，評估三個因素：攻擊成功的可能性、對關鍵業務的衝擊、目標資產的價值。依標準風險評估方法，哪一種情境對組織風險最高？","zo":["高可能性、高衝擊、高資產價值","低可能性、高衝擊、低資產價值","低可能性、低衝擊、高資產價值","高可能性、低衝擊、高資產價值"],"ze":"風險 = 可能性 × 衝擊 × 資產價值，三者皆高時風險最大，應立即優先處理並投入資源。其餘選項至少有一項為低，風險相對較低。"},{"n":60,"c":"siem","q":"A security team is designing SIEM use-case logic to detect privilege escalation attempts on Windows servers. They have already identified and validated the necessary event sources (e.g., Active Directory logs, Windows Security logs). What should be their next step in the use case logic development process?","o":["Define response actions for detected incidents before writing the rules","Define correlation rules and conditions that detect specific privilege escalation patterns","Implement and test the use case immediately in the production SIEM environment","Collect historical security logs to confirm the use case is necessary"],"a":1,"e":"Once the event sources are validated, the next logical step is to define the detection logic—correlation rules and conditions that represent privilege escalation patterns. In SOC engineering, validated sources mean you have the raw ingredients; now you must specify what “bad” looks like in those logs. For privilege escalation on Windows, this might include abnormal group membership changes, creation of new privileged accounts, suspicious privilege assignment events, UAC bypass indicators, or admin logons from non-admin workstations. Defining correlation rules also includes setting time windows, selecting strong pivots (account, host, SID), and incorporating context to reduce noise (approved admin accounts, maintenance windows, known tooling). Defining response actions is important, but it should follow detection logic so you don’t automate reactions to unstable or noisy detections. Testing immediately in production is risky; best practice is to test in a controlled manner or pilot mode first to avoid operational disruption and excessive false positives. Collecting historical logs can help tune baselines, but the scenario states sources are already validated; the next step is to codify the conditions that detect the targeted behavior.","zq":"資安團隊正在設計偵測 Windows 伺服器提權的 SIEM 使用案例邏輯，已確認並驗證所需事件來源（AD 日誌、Windows 安全性日誌）。下一步應該做什麼？","zo":["在撰寫規則前先定義事件的回應動作","定義能偵測特定提權模式的關聯規則與條件","立即在正式環境的 SIEM 實作並測試","收集歷史日誌以確認是否需要此使用案例"],"ze":"事件來源驗證完成後，下一步是定義偵測邏輯：例如特權群組異動、新增特權帳號、特權指派事件等，並設定時間窗、關聯欄位與白名單。回應動作應在偵測穩定後；直接上正式環境風險高。"},{"n":61,"c":"ir","q":"At 9:15 AM EST, Marcus Wong, a financial operations analyst, contacts the SOC after noticing Excel spreadsheets automatically encrypting with unusual file extensions (e.g., .locked or .crypt). The Tier 1 analyst logs the incident as ticket #INC-89271 in the SIEM and escalates it to a Tier 2 SOC analyst for investigation. Which phase of the Incident Response process is currently taking place?","o":["Containment","Incident triage","Incident recording and assignment","Notification"],"a":2,"e":"The scenario describes creating a ticket and escalating/assigning it to the appropriate analyst, which is incident recording and assignment. This phase is where the SOC formally documents the reported event, creates an incident record in the tracking system (often SIEM/SOAR or ticketing), sets initial severity/priority, and assigns ownership for investigation. While triage will follow quickly (or may begin in parallel), the explicit action described is logging the incident as a ticket and escalating it to Tier 2. Containment would involve actions to stop spread (isolate endpoint, block C2, disable accounts), which are not described yet. Notification refers to informing broader stakeholders (management, legal, IT) and is not the focus here. From a SOC workflow standpoint, accurate incident recording and assignment is crucial because it ensures accountability, preserves initial report details (time, symptoms, impacted user/device), and triggers SLA-driven response processes. Once assigned, the Tier 2 analyst will conduct triage and verification, then drive containment and eradication if ransomware is confirmed.","zq":"上午 9:15，財務分析師 Marcus 聯絡 SOC，表示 Excel 檔案自動被加密、副檔名變成 .locked 或 .crypt。Tier 1 分析師在 SIEM 中開立工單 #INC-89271，並升級給 Tier 2 分析師調查。目前處於事件應變的哪個階段？","zo":["圍堵","事件分級","事件記錄與指派","通報"],"ze":"開立工單、記錄初始資訊並指派／升級給負責人，屬於「事件記錄與指派」。接著 Tier 2 才會進行分級，確認是勒索軟體後再圍堵。"},{"n":62,"c":"log","q":"Which of the following command is used to view iptables logs on Ubuntu and Debian distributions?","o":["$ tailf /var/log/sys/kern.log","$ tailf /var/log/kern.log","# tailf /var/log/messages","# tailf/var/log/sys/messages"],"a":1,"e":"In Ubuntu and Debian distributions, the command to view iptables logs is $ tailf /var/log/kern.log. This command allows you to follow the end of the kernel log file in real-time. It is useful for monitoring the logs as they are updated. The tailf command is similar to tail -f, and it displays the last ten lines of the file by default and then outputs appended data as the file grows.","zq":"在 Ubuntu 與 Debian 上，要查看 iptables 日誌應使用哪一個指令？","zo":["$ tailf /var/log/sys/kern.log","$ tailf /var/log/kern.log","# tailf /var/log/messages","# tailf/var/log/sys/messages"],"ze":"Debian/Ubuntu 上 iptables 的 LOG 目標寫入核心日誌 /var/log/kern.log；tailf（等同 tail -f）可即時追蹤新增內容。RHEL/CentOS 則常見於 /var/log/messages。"},{"n":63,"c":"log","q":"Which of the following Windows Event Id will help you monitors file sharing across the network?","o":["7045","4625","5140","4624"],"a":2,"e":"The WindowsEvent ID 5140 is used to monitor file sharing across a network. This event is triggered every time a network share object is accessed, and it generates once per session when the first access attempt is made. It is part of the Audit File Share category and provides information about the access, including the user and device that accessed the share, the network address from which the access was made, and the name of the share that was accessed.","zq":"哪一個 Windows 事件 ID 可幫助你監控網路上的檔案分享存取？","zo":["7045","4625","5140","4624"],"ze":"5140 = 已存取網路共用物件（A network share object was accessed），包含使用者、來源位址與共用名稱。7045 是新服務安裝、4625 登入失敗、4624 登入成功。"},{"n":64,"c":"log","q":"Which of the following data source can be used to detect the traffic associated with Bad Bot User-Agents?","o":["Windows Event Log","Web Server Logs","Router Logs","Switch Logs"],"a":1,"e":"Bad bots are automated software that perform tasks over the internet, which can sometimes be malicious, like scraping data, spamming, or carrying out credential stuffing attacks. To detect the traffic associated with BadBot User-Agents, web server logs are the most effective data source. These logs record all the requests made to the web server, including the User-Agent string that identifies the type of client making the request. By analyzing these logs, SOC analysts can identify patterns and behaviors indicative of bad bots, such as high request rates, unusual access patterns, or known malicious User-Agent strings.","zq":"下列哪一種資料來源可用來偵測與惡意機器人（Bad Bot）User-Agent 相關的流量？","zo":["Windows 事件日誌","Web 伺服器日誌","路由器日誌","交換器日誌"],"ze":"Web 伺服器日誌記錄每個 HTTP 請求的 User-Agent 字串、請求頻率與路徑，可找出已知惡意 UA、異常高頻與爬取行為。網路設備日誌不含應用層 UA 資訊。"},{"n":65,"c":"log","q":"Pearl is a Level 1 SOC analyst at a global financial institution using SQL Server to store sensitive customer information. She investigates an alert showing multiple failed web app logins from the same IP, followed by a successful login as a server administrator. She then reviews SQL Server logs and finds the attacker used compromised credentials to access the SQL Server database. Which log will help identify whether the intruder performed unauthorized modifications in the database?","o":["Transaction log","Security log","Maintenance log","Audit log"],"a":0,"e":"The SQL Server transaction log records changes made to the database, including data modifications (INSERT\n/UPDATE/DELETE) and many schema-related operations, supporting reconstruction of what changed and when. For unauthorized modifications, the transaction log provides the strongest evidence trail because it is tied to the database engine’s durability mechanism and captures the sequence of committed actions. In SOC investigations, transaction log analysis helps determine whether data was altered, which tables were impacted, and the time window of changes. Security logs or SQL Server security-related events help with authentication\n/authorization and may show login activity, but they do not reliably enumerate every data modification. Maintenance logs relate to scheduled maintenance tasks (backups, index rebuilds) and are not designed to capture unauthorized content changes. Audit logs can be extremely useful if SQL Server auditing is configured to capture specific actions and statements, but the question asks which log helps identify whether modifications occurred; the transaction log is the baseline record of actual database changes. In practice, SOC teams correlate transaction log evidence with authentication logs, application logs, and potentially SQL auditing to attribute actions to accounts and sessions, then scope and remediate.","zq":"全球金融機構的 L1 分析師 Pearl 發現某 IP 多次登入 Web 應用失敗後，以伺服器管理員身分成功登入；SQL Server 日誌顯示攻擊者用遭竊憑證存取資料庫。哪一個日誌能判斷入侵者是否在資料庫中做了未授權修改？","zo":["交易日誌（Transaction log）","安全性日誌","維護日誌","稽核日誌"],"ze":"SQL Server 交易日誌記錄所有資料變更（INSERT/UPDATE/DELETE）及部分結構變更，是還原「改了什麼、何時改」的基礎紀錄。安全性日誌偏向登入驗證；稽核日誌需預先設定才會有；維護日誌記錄備份等作業。"},{"n":66,"c":"log","q":"A large web hosting service provider, Web4Everyone, hosts multiple major websites and platforms. You are a Level 1 SOC analyst responsible for investigating web server logs for potential malicious activity. Recently, your team detected multiple failed login attempts and unusual traffic patterns targeting the company’s web application. To efficiently analyze the logs and identify key details such as remote host, username, timestamp, requested resource, HTTP status code, and user-agent, you need a structured log format that ensures quick and accurate parsing. Which standardized log format will you choose for this scenario?","o":["JSON Format","Common Log Format (CLF)","Tab-Separated Format","Extended Log Format (ELF)"],"a":3,"e":"Extended Log Format (commonly used as “Combined” or “Extended” variants in web logging) is designed to include additional fields beyond the Common Log Format baseline, such as referrer and user-agent—both critical for SOC investigations of web attacks. CLF typically captures remote host, identity/user (if available), timestamp, request line, status code, and bytes sent, but it does not reliably include user-agent by default. The scenario explicitly requires user-agent and fast parsing across common web fields, which is exactly what extended formats provide: richer context in a predictable structure without needing custom parsing rules for every environment. JSON is highly flexible and can be excellent for structured logging, but it is not the classic “standardized web server log format” typically referenced when discussing remote host, request, status, and user-agent in a single line structure. Tab-separated is a delimiter style, not a standard web server format. From a SOC perspective, having user-agent and related HTTP metadata is essential for identifying automated tooling, bot patterns, scanner signatures, and suspicious client behaviors, and extended web log formats enable faster triage and correlation in SIEM and log analytics tools.","zq":"你是大型虛擬主機商的 L1 SOC 分析師，需分析 Web 伺服器日誌中的登入失敗與異常流量，並快速準確地解析遠端主機、使用者名稱、時間戳、請求資源、HTTP 狀態碼與 User-Agent。應選擇哪一種標準化日誌格式？","zo":["JSON 格式","通用日誌格式（CLF）","Tab 分隔格式","延伸日誌格式（ELF）"],"ze":"CLF 只含主機、使用者、時間、請求、狀態碼、位元組數，預設沒有 User-Agent 與 Referrer。延伸日誌格式（ELF/W3C Extended）可加入這些欄位，便於辨識自動化工具與掃描器。JSON 雖彈性但非傳統標準 Web 日誌格式。"},{"n":67,"c":"net","q":"Which attack works like a dictionary attack, but adds some numbers and symbols to the words from the dictionary and tries to crack the password?","o":["Hybrid Attack","Bruteforce Attack","Rainbow Table Attack","Birthday Attack"],"a":0,"e":"A Hybrid Attack is a type of cyber attack that combines elements of a dictionary attack with a brute force attack. It involves taking words from a dictionary (which could be a list of common passwords or related words) and augmenting them with numbers and symbols to generate potential passwords. This method increases the chances of cracking a password by including the common variations that users often add to their passwords to meet complexity requirements.","zq":"哪一種攻擊類似字典攻擊，但會在字典單字上加入數字與符號來嘗試破解密碼？","zo":["混合式攻擊（Hybrid）","暴力破解攻擊","彩虹表攻擊","生日攻擊"],"ze":"混合式攻擊 = 字典 + 變形規則（如 password → Password123!），針對使用者常見的「單字加數字符號」習慣。暴力破解嘗試所有組合；生日攻擊針對雜湊碰撞。"},{"n":68,"c":"log","q":"What type of event is recorded when an application driver loads successfully in Windows?","o":["Error","Success Audit","Warning","Information"],"a":3,"e":"In Windows, when an application driver loads successfully, it is recorded as an “Information” event in the Event Viewer. This type of event indicates the successful operation of an application or system component, which in this case is the loading of a driver. Information events are typically used to log the normal operations of software and hardware, providing a record that can be useful for troubleshooting and monitoring system activity.","zq":"在 Windows 中，應用程式驅動程式成功載入時會記錄成哪一種事件？","zo":["錯誤","稽核成功","警告","資訊（Information）"],"ze":"成功完成的正常作業（如驅動程式或服務成功載入）記錄為 Information 事件。稽核成功（Success Audit）僅用於安全性稽核事件。"},{"n":69,"c":"ir","q":"In which of the following incident handling and response stages, the root cause of the incident must be found from the forensic results?","o":["Evidence Gathering","Evidence Handling","Eradication","SystemsRecovery"],"a":2,"e":"The eradication stage is where the root cause of the incident is determined from the forensic results. This stage involves not only removing the threat from the affected systems but also identifying and fixing the vulnerabilities that were exploited. It’s crucial to understand how the incident occurred to prevent future occurrences. After the containment stage, where the immediate threat is isolated, eradication ensures that the threat is completely removed and that the root cause is addressed.","zq":"在事件處理與回應的哪個階段，必須從鑑識結果找出事件的根本原因？","zo":["證據蒐集","證據處理","根除","系統復原"],"ze":"根除階段不只移除威脅，還要依鑑識結果找出並修補被利用的弱點（根因），避免再次發生。"},{"n":70,"c":"cloud","q":"A large financial organization has experienced an increase in sophisticated cyber threats, including zero-day attacks and APTs. Traditional detection relies heavily on signatures and manual intervention, causing delays. The CISO is exploring AI-driven solutions that can automatically analyze large datasets, detect anomalies, and adapt to evolving threats in real time—identifying suspicious activity without predefined signatures and with minimal human oversight. Which key AI technology should the organization focus on?","o":["Static IP blocking","Machine learning (ML)","Natural language processing (NLP)","Heuristic-based signature detection"],"a":1,"e":"Machine learning is the key AI technology for detecting suspicious activity without predefined signatures by learning patterns from data and identifying anomalies, outliers, and high-risk behaviors. In SOC contexts, ML can model normal baselines for users, hosts, and applications, then flag deviations such as unusual authentication patterns, unexpected data transfers, or rare process behaviors—capabilities that are particularly useful against zero-days and APTs that evade signature-based tools. NLP is valuable for processing human-language text (tickets, email content, narrative logs), but it is not the primary engine for behavioral anomaly detection across telemetry. Static IP blocking is a manual control that can be bypassed and does not “learn” or adapt. Heuristic-based signatures still rely on predefined patterns, even if they are generalized, and are not the same as adaptive learning. From a SOC perspective, ML can improve detection coverage when combined with strong telemetry and tuning, but it also requires governance: monitoring model drift, validating outputs, and ensuring explainability for analysts. Because the scenario prioritizes signatureless detection and real-time adaptation, machine learning is the best fit.","zq":"某大型金融機構面臨零時差攻擊與 APT，傳統偵測依賴特徵碼與人工而造成延遲。CISO 評估 AI 方案，希望能自動分析大量資料、偵測異常、即時適應演變中的威脅——在無預先定義特徵、極少人工介入下識別可疑活動。應聚焦哪一項 AI 技術？","zo":["靜態 IP 封鎖","機器學習（ML）","自然語言處理（NLP）","啟發式特徵碼偵測"],"ze":"機器學習能從資料學習正常基準並找出離群行為，不依賴特徵碼，適合對抗零時差與 APT。NLP 處理人類語言文字；靜態封鎖無學習能力；啟發式特徵仍是預先定義的模式。"},{"n":71,"c":"web","q":"Wesley is an incident handler in a company named Maddison Tech. One day, he was learning techniques for eradicating the insecure deserialization attacks.\nWhat among the following should Wesley avoid from considering?","o":["Deserialization of trusted data must cross a trust boundary","Understand the security permissions given to serialization and deserialization","Allow serialization for security-sensitive classes","Validate untrusted input, which is to be serialized to ensure that serialized data contain only trusted classes"],"a":2,"e":"Insecure deserialization often leads to critical vulnerabilities allowing attackers to perform various attacks, such as remote code execution. To mitigate these vulnerabilities, Wesley should avoid considering the serialization of security-sensitive classes because it can expose sensitive data to untrusted sources or lead to arbitrary code execution.\nHere are the steps Wesley should follow:\nAvoid Serialization of Sensitive Data: Do not serialize sensitiveinformation. If it’s essential to serialize, then ensure it’s encrypted and the process is secure.\nImplement Integrity Checks: Use digital signatures or checksums to verify that the serialized data has not been tampered with before deserializing it.\nEnforce Strict Type Constraints: When deserializing, ensure that the data adheres to strict type constraints to prevent the instantiation of unexpected types.\nLogging and Monitoring: Keep detailed logs of serialization and deserialization processes to monitor for any suspicious activities.\nSecurity Controls Review: Regularly review and update security controls related to serialization and deserialization to ensure they are effective against emerging threats.","zq":"Maddison Tech 的事件處理人員 Wesley 在學習根除不安全反序列化攻擊的技術。下列哪一項是他應該「避免」考慮的？","zo":["可信資料的反序列化必須跨越信任邊界","了解序列化與反序列化被賦予的安全權限","允許對安全敏感的類別進行序列化","驗證要序列化的不可信輸入，確保序列化資料僅含可信類別"],"ze":"對安全敏感的類別進行序列化可能暴露敏感資料或導致任意程式碼執行，應避免。其他選項（了解權限、驗證輸入、限制可信類別）都是正確的防護措施。另應以數位簽章檢查完整性、限制反序列化型別。"},{"n":72,"c":"web","q":"Jony, a security analyst, while monitoring IIS logs, identified events shown in the figure below.\nWhat does this event log indicate?","o":["Parameter Tampering Attack","XSS Attack","Directory Traversal Attack","SQL Injection Attack"],"a":3,"e":"TheIIS log events indicate a SQL Injection Attack. This is evident from the complex SQL queries present in the log, which include functions like “UNICODE”, “SUBSTRING”, and “MAX”. These functions are being used in a manner that suggests manipulation of strings and extraction of data, which are common tactics in SQL injection attacks. The use of specific characters like CHAR(97) and CHAR(108) within the queries is a technique often employed to bypass security mechanisms during such attacks.","zq":"資安分析師 Jony 監控 IIS 日誌時發現如下圖的事件（原題附圖：請求中含 UNICODE、SUBSTRING、MAX、CHAR(97) 等 SQL 函式）。此事件日誌代表什麼？","zo":["參數竄改攻擊","XSS 攻擊","目錄穿越攻擊","SQL 注入攻擊"],"ze":"請求中出現 UNICODE()、SUBSTRING()、MAX()、CHAR() 等 SQL 函式，用於逐字元擷取資料並繞過過濾，是典型（盲注）SQL 注入特徵。（此 PDF 文字版未含原圖）"},{"n":73,"c":"ir","q":"David Reynolds, a SOC analyst at a healthcare organization, is investigating suspicious login attempts flagged by the SIEM. To mitigate brute-force risk on targeted endpoints, he collaborates with IT to implement an automatic account lockout policy that temporarily disables accounts after multiple failed login attempts. Within the SOC’s eradication strategy, which category of measures does this action align with?","o":["Physical security measures","Network security measures","Host security measures","Authentication and authorization measures"],"a":3,"e":"Account lockout is an identity control that directly strengthens authentication by limiting repeated password guessing attempts. It sits within authentication and authorization measures because it governs how accounts can authenticate and how access is granted or denied based on login outcomes. In SOC terms, brute-force attacks target the authentication surface; lockout policies reduce attacker attempts and can prevent successful compromise by forcing a pause or administrative intervention after repeated failures. While the policy may be implemented on hosts or via directory services, its purpose is to control identity access behavior, not network segmentation or physical protections. Host security measures typically refer to endpoint hardening, patching, EDR controls, and local configuration baselines. Network security measures include firewall rules, segmentation, and traffic filtering. Physical security includes facility and device access controls. Because the action is specifically about controlling login attempts and access to accounts, it is best categorized as authentication and authorization. In practice, SOC teams complement lockout policies with MFA, conditional access, password spraying detection, and monitoring for “failures followed by success” patterns to reduce both brute-force success and user disruption.","zq":"醫療機構 SOC 分析師 David 調查 SIEM 標記的可疑登入嘗試。為降低暴力破解風險，他與 IT 合作實施自動帳號鎖定政策，多次登入失敗後暫時停用帳號。在 SOC 根除策略中，此措施屬於哪一類？","zo":["實體安全措施","網路安全措施","主機安全措施","驗證與授權措施"],"ze":"帳號鎖定控制的是「如何驗證與是否授予存取」，屬於驗證與授權措施。主機安全指端點強化、修補、EDR；網路安全指防火牆與分段；實體安全指門禁。"},{"n":74,"c":"cti","q":"John, a threat analyst at GreenTech Solutions, wants to gather information about specific threats against the organization. He started collecting information from various sources, such as humans, social media, chat room, and so on, and created a report that contains malicious activity.\nWhich of the following types of threat intelligence did he use?","o":["Strategic Threat Intelligence","Technical ThreatIntelligence","Tactical Threat Intelligence","Operational Threat Intelligence"],"a":3,"e":"Operational threat intelligence involves gathering detailed information about specific threats to an organization. It is often derived from various sources, including human intelligence, social media, chat rooms, and other platforms where data about malicious activities can be collected. This type of intelligence is focused on understanding the specifics of a threat, such as the tactics, techniques, and procedures (TTPs) of threat actors, and is used to inform the organization about imminent or ongoing attacks.\nIn the scenario described, John, a threat analyst, is collecting information from diverse sources to create a report on malicious activity. This aligns with the practices of operational threat intelligence, which is concerned with the details of particular threats and activities, rather than broader strategic trends or technical indicators.","zq":"GreenTech 的威脅分析師 John 想蒐集針對組織的特定威脅資訊，他從人員、社群媒體、聊天室等多種來源蒐集資料，並製作包含惡意活動的報告。他使用的是哪一種威脅情報？","zo":["策略型威脅情報","技術型威脅情報","戰術型威脅情報","營運型威脅情報"],"ze":"營運型情報針對特定即將發生或進行中的攻擊，來源常包括人員情報、社群媒體、聊天室與地下論壇，用於了解攻擊者意圖與行動。"},{"n":75,"c":"ops","q":"A SOC team notices malware-related incidents increased over the past six months, primarily targeting endpoints through phishing campaigns. They need to present a report to security leadership to justify investing in advanced email filtering and end-user security training. Which SOC report best supports their case?","o":["Monitoring summary report","Real-time monitoring report","Incident report","Trend analysis report"],"a":3,"e":"A trend analysis report is designed to show how incident frequency, types, severity, and impact change over time, which is exactly what leadership needs for investment decisions. The scenario is about demonstrating an increase in malware incidents over six months and linking them to phishing as an entry vector. A trend report can quantify growth rates, highlight recurring patterns, identify peak periods, compare pre- and post-control effectiveness, and estimate business risk (downtime, remediation hours, affected users). This supports a clear business case for budget: if phishing-driven malware is increasing, investments in email filtering and user training directly address the root cause and should reduce future incident volume. A monitoring summary report may provide a snapshot but often lacks time-series depth. A real-time monitoring report focuses on current status and active alerts, not long-term justification. An incident report is typically focused on a single event and is useful for lessons learned but not for demonstrating systemic trends. From a SOC management perspective, trend analysis aligns technical evidence with strategic decisions, making it the most effective report type to support funding for preventive controls and awareness programs.","zq":"SOC 團隊發現過去六個月惡意程式事件增加，主要透過網釣攻擊端點。他們需要向資安主管提出報告，爭取投資進階郵件過濾與使用者資安訓練。哪一種 SOC 報告最能支持此提案？","zo":["監控摘要報告","即時監控報告","事件報告","趨勢分析報告"],"ze":"趨勢分析報告呈現事件數量、類型、嚴重度隨時間的變化，能量化成長率與重複模式，最適合用來支持預算決策。事件報告只針對單一事件；即時報告反映當下狀態。"},{"n":76,"c":"siem","q":"You are part of a team of SOC analysts in a multinational organization that processes large volumes of security logs from various sources, including firewalls, IDS, and authentication servers. Your team is having difficulty detecting incidents because logs from different systems are analyzed in isolation, making it harder to link related events. What approach should you implement for future investigations to automatically match related log events based on predefined rules?","o":["Log normalization","Log collection","Log correlation","Log transformation"],"a":2,"e":"Log correlation is the capability that links related events from different sources into a coherent narrative based on predefined rules, logic, and time windows. In SOC operations, incidents rarely appear as a single log line; they are sequences—failed logons followed by a successful logon, then privilege changes, then suspicious process execution, then outbound connections. Correlation rules connect these across data sources (firewall, IDS, authentication, endpoint) using strong keys such as user, host, IP address, session identifiers, and tightly bounded timestamps. This reduces analyst workload, increases detection fidelity, and shortens investigation time by presenting connected evidence rather than isolated alerts. Log collection simply gathers logs; it does not relate them. Log normalization ensures consistent fields and formats, which improves correlation effectiveness, but it is not the linking step itself. Log transformation is a broader term that can include parsing and enrichment, but it does not inherently perform the rule-driven linking of related events. Because the question explicitly asks for “automatically match related log events based on predefined rules,” log correlation is the correct approach.","zq":"你所在的 SOC 處理來自防火牆、IDS、驗證伺服器等大量日誌，但各系統日誌被獨立分析，難以串連相關事件。未來調查應採用哪一種方法，依預先定義的規則自動比對相關的日誌事件？","zo":["日誌正規化","日誌收集","日誌關聯（Correlation）","日誌轉換"],"ze":"日誌關聯依規則、時間窗與關鍵欄位（使用者、主機、IP）將不同來源的事件串成一條攻擊敘事，例如「多次登入失敗 → 成功登入 → 提權 → 外連」。收集只是取得日誌；正規化統一欄位格式，是關聯的前置作業。"},{"n":77,"c":"log","q":"Peter, a SOC analyst with Spade Systems, is monitoring and analyzing the router logs of the company and wanted to check the logs that are generated by access control list numbered 210.\nWhat filter should Peter add to the 'show logging' command to get the required output?","o":["show logging | access 210","show logging | forward 210","show logging | include 210","show logging | route 210"],"a":2,"e":"To filter the output of the‘show logging’ command to include entries related to a specific access control list, Peter should use the ‘include’ keyword followed by the access list number. The correct command would be ‘show logging | include 210’. This command will display all log entries that contain the string ‘210’, which is the number of the access control list he wants to monitor.","zq":"Spade Systems 的 SOC 分析師 Peter 正在分析公司路由器日誌，想查看編號 210 的存取控制清單（ACL）所產生的日誌。應在 show logging 指令加上哪個過濾條件？","zo":["show logging | access 210","show logging | forward 210","show logging | include 210","show logging | route 210"],"ze":"Cisco IOS 的輸出過濾語法為「| include 字串」，只顯示包含該字串的行。另有 exclude、begin、section 等，沒有 access、forward、route 這類過濾關鍵字。"},{"n":78,"c":"web","q":"Which encoding replaces unusual ASCII characters with \"%\" followed by the character’s two-digit ASCII code expressed in hexadecimal?","o":["Unicode Encoding","UTF Encoding","Base64 Encoding","URL Encoding"],"a":3,"e":"URL encoding, also known as percent-encoding, is a mechanism for encoding information in a Uniform Resource Identifier (URI) under certain circumstances. When characters are not allowed in a URI, they are replaced with a percent sign (%) followed by two hexadecimal digits that represent the ASCII code of the character. For example, a space character is not allowed in a URI and is replaced with %20.","zq":"哪一種編碼方式會把特殊 ASCII 字元替換成「%」加上該字元 ASCII 碼的兩位十六進位值？","zo":["Unicode 編碼","UTF 編碼","Base64 編碼","URL 編碼"],"ze":"URL 編碼（百分比編碼）例如空白 → %20、< → %3C、' → %27。攻擊者常用 URL 編碼或雙重編碼（%252E）繞過過濾，分析日誌時需解碼判讀。"},{"n":79,"c":"ops","q":"What is the correct sequence of SOC Workflow?","o":["Collect, Ingest, Validate, Document, Report, Respond","Collect, Ingest, Document, Validate, Report, Respond","Collect, Respond, Validate, Ingest, Report,Document","Collect, Ingest, Validate, Report, Respond, Document"],"a":3,"e":"Collect: The first step involves collecting data from various sources. This data could be logs, alerts, or other relevant information.\nIngest: The collected data is then ingested into the SOC’s systems for processing. This typically involves parsing and normalizing the data to make it usable for analysis.\nValidate: Once ingested, the data must be validated to ensure its integrity and relevance. This step helps in filtering out false positives and focusing on genuine security events.\nReport: After validation, the relevant findings are compiled into reports. These reports may be used internally within the SOC or shared with other stakeholders.\nRespond: Based on the reports, the SOC team responds to the identified incidents. This response could involve mitigating threats, patching vulnerabilities, or other remediation actions.\nDocument: Finally, all actions and findings are thoroughly documented. This documentation is crucial for audit trails, compliance, and improving future SOC operations.","zq":"SOC 工作流程的正確順序為何？","zo":["收集、匯入、驗證、記錄文件、報告、回應","收集、匯入、記錄文件、驗證、報告、回應","收集、回應、驗證、匯入、報告、記錄文件","收集、匯入、驗證、報告、回應、記錄文件"],"ze":"SOC 工作流程：Collect（收集）→ Ingest（匯入、剖析、正規化）→ Validate（驗證、排除誤報）→ Report（報告）→ Respond（回應）→ Document（記錄文件，供稽核與改善）。"},{"n":80,"c":"ir","q":"The SOC team found a suspicious document file on a user's workstation. Upon initial inspection, the document appears benign, but deeper analysis reveals an embedded PowerShell script. The team suspects the script is designed to download and execute a malicious payload. They need to understand the script's functionality without triggering it. Which malware analysis technique is recommended to understand the PowerShell script's functionality without executing it?","o":["Static analysis","Dynamic analysis","Automated behavioral analysis","Network traffic analysis"],"a":0,"e":"Static analysis is the correct approach when the requirement is to understand what the script is intended to do without executing it. For PowerShell embedded in documents, static analysis includes extracting the script content, de-obfuscating it (common techniques include base64 decoding, string reconstruction, and analyzing encoded commands), and reviewing functions, URLs/IPs, file paths, registry keys, and command-line arguments. This allows the SOC to determine likely behaviors such as downloading payloads, establishing persistence, credential theft, or disabling security controls—without risking system impact. Dynamic or behavioral analysis involves running code in a controlled sandbox to observe actions, which can be valuable but violates the constraint “without triggering it,” and can be risky if containment fails or the malware has evasive logic. Network traffic analysis can help once execution has occurred or in a sandbox run, but it cannot fully explain logic that never ran. Static analysis is also useful for creating detections (hashes, strings, YARA-like patterns, command-line indicators) and for scoping across the environment by searching for matching script fragments or document markers.","zq":"SOC 團隊在使用者工作站發現可疑文件，表面無害，但深入分析發現內嵌 PowerShell 腳本，疑似會下載並執行惡意酬載。團隊需要在「不觸發」的情況下了解腳本功能，應採用哪一種惡意程式分析技術？","zo":["靜態分析","動態分析","自動化行為分析","網路流量分析"],"ze":"靜態分析不執行程式：抽出腳本、解 Base64／混淆、檢視 URL、檔案路徑、登錄機碼與參數，即可推斷行為並產生偵測指標。動態與行為分析都需要執行；網路流量分析需先有執行才有流量。"},{"n":81,"c":"siem","q":"SecureTech Solutions, a managed security service provider (MSSP), is optimizing its log management architecture to enhance log storage, retrieval, and analysis efficiency. The SOC team needs logs stored in a structured or semi-structured format for easy parsing, querying, and correlation. They choose a format that organizes data in a text file in a tabular structure, where each log entry is stored in rows and columns, and that supports easy export to databases or spreadsheet analysis while maintaining readability. Which log format should they choose?","o":["Comma-Separated Values (CSV) format","Cloud storage","Syslog format","Database"],"a":0,"e":"CSV is a structured, tabular text format where each record is a row and fields are separated by commas, making it easy to parse, import into spreadsheets, and export into databases. The scenario specifically calls for a text file with rows and columns, readability, and easy export to databases or spreadsheet-based analysis—\nthese are classic CSV strengths. Cloud storage is a storage location/architecture, not a log format. Syslog is a transport and message format family used for sending event messages from systems and network devices; it is often semi-structured but not inherently “rows and columns” in a tabular file structure. A database is a storage system rather than a file format; while logs can be stored in databases, the question asks specifically for a text file format. In SOC practice, CSV is commonly used for exporting specific datasets for reporting, offline analysis, and sharing with stakeholders, especially when interoperability is needed. For high-scale SIEM ingestion, formats like JSON are often preferred, but given the explicit requirement for a tabular text file compatible with spreadsheets, CSV is the correct choice.","zq":"MSSP SecureTech 要最佳化日誌管理架構，需要結構化或半結構化格式以便解析、查詢與關聯。他們選擇一種以表格方式在文字檔中組織資料、每筆日誌為一列、欄位分欄，可輕易匯出至資料庫或試算表且保有可讀性的格式。應選哪一種？","zo":["逗號分隔值（CSV）格式","雲端儲存","Syslog 格式","資料庫"],"ze":"CSV 是以列與欄組成的表格型文字格式，易於匯入試算表與資料庫。雲端儲存是存放位置；Syslog 是傳輸與訊息格式；資料庫是儲存系統而非檔案格式。"},{"n":82,"c":"web","q":"During a routine security audit, analysts discover several web servers still use a vulnerable third-party library flagged for a zero-day exploit. The vulnerability was identified previously and patches were deployed, but the application team rolled back patches due to instability and compatibility issues. The vulnerability remains unaddressed, and no alternative mitigations are in place. How should the security team classify this risk in the context of web application security?","o":["Software and data integrity failures","Security logging and monitoring failures","Vulnerable and outdated components","Insecure design"],"a":2,"e":"This is best classified as “Vulnerable and outdated components” because the organization is knowingly running a third-party library with a known exploitable vulnerability and has rolled back the available fix. In web application security, third-party dependencies are a major risk driver because attackers routinely target widely used frameworks and libraries, especially when exploit code becomes available or active exploitation is observed. Even if the rollback was motivated by stability, leaving the vulnerable component in production without compensating controls (WAF rules, disabling vulnerable functionality, strict input validation, segmentation) maintains high risk. Software and data integrity failures would focus on unauthorized changes or untrusted code deployment; the issue here is the presence of a known vulnerable dependency. Security logging/monitoring failures refer to insufficient visibility, not the root exposure. Insecure design refers to architectural weaknesses built into the application; while dependency management can be part of secure design, the immediate classification is the vulnerable component itself. From a SOC perspective, this classification drives remediation: prioritize patch-compatible fixes, upgrade dependency versions, implement compensating controls until patching is possible, and improve change management to prevent security rollback without risk acceptance and mitigation.","zq":"例行稽核發現數台 Web 伺服器仍使用被標記有零時差漏洞的第三方函式庫。之前已部署修補，但應用團隊因不穩定與相容性問題回滾了修補，漏洞仍存在且無替代緩解措施。在 Web 應用安全脈絡下應如何分類此風險？","zo":["軟體與資料完整性失效","安全日誌與監控失效","易受攻擊與過時的元件","不安全的設計"],"ze":"對應 OWASP Top 10「A06 易受攻擊與過時的元件」：在正式環境執行已知有漏洞的第三方相依套件。應盡快找到相容的修補版本，並在修補前以 WAF 規則、停用漏洞功能等補償控制降低風險。"},{"n":83,"c":"ops","q":"A SOC analyst is responsible for designing a security dashboard that provides real-time monitoring of security threats. The organization wants to avoid overwhelming analysts with excessive information and focus on the most critical security alerts to ensure timely responses to potential threats. Which principle should guide the design of the dashboard?","o":["Include as much data as possible to ensure complete visibility","Restrict dashboard access to only network administrators","Prioritize critical information and remove unnecessary details","Use only historical data to avoid real-time inconsistencies"],"a":2,"e":"SOC dashboards are operational tools, not data lakes. The guiding principle is to maximize analyst decision speed and accuracy under time pressure. Prioritizing critical information and removing unnecessary details reduces cognitive overload and alert fatigue, which are major contributors to missed high-severity incidents. A well-designed SOC dashboard highlights high-signal items first: active high/critical incidents, alerts with confirmed impact, identity compromise indicators, lateral movement signals, and key environmental health metrics (ingestion gaps, sensor failures). It also supports triage by surfacing minimal but essential context: affected user/host, severity, time window, tactic/technique mapping, and recommended first action. “Include as much data as possible” often results in clutter that slows response and hides important signals. Restricting access to only network admins is not a design principle and can hinder collaboration. Using only historical data undermines real-time detection and containment, which is central to SOC operations. Effective dashboards follow “need-to-know for action”: show what enables a fast, correct response first, and provide drill-down for deeper analysis when needed.","zq":"SOC 分析師負責設計即時監控資安威脅的儀表板。組織希望避免資訊過載，聚焦最關鍵的告警以確保及時回應。儀表板設計應以哪個原則為依歸？","zo":["盡可能納入所有資料以確保完整可視性","限制只有網路管理員能存取儀表板","優先呈現關鍵資訊、移除不必要細節","只使用歷史資料以避免即時資料不一致"],"ze":"SOC 儀表板是作業工具，應讓分析師在壓力下快速做出正確決策：優先顯示高／嚴重事件、受影響資產、必要情境，並提供下鑽功能。塞滿資料只會掩蓋重要訊號。"},{"n":84,"c":"web","q":"Jane, a security analyst, while analyzing IDS logs, detected an event matching Regex /((\\%3C)|<)((\\%69)|i|(\\% 49))((\\%6D)|m|(\\%4D))((\\%67)|g|(\\%47))[^\\n]+((\\%3E)|>)/|.\nWhat does this event log indicate?","o":["Directory Traversal Attack","Parameter Tampering Attack","XSS Attack","SQL Injection Attack"],"a":2,"e":"The regular expression provided in the question is designed to detect patterns that are typically found in XSS (Cross-Site Scripting) attacks. Here’s a breakdown of theregex pattern:\n/((\\%3C)|<) - This part of the pattern matches the encoded version of < which is %3C, or the symbol < itself. In HTML, this symbol denotes the start of a tag.\n((\\%69)|i|(\\%49)) - This matches the encoded version of i which is %69, thelowercase i, or the encoded version of I which is %49.\n((\\%6D)|m|(\\%4D)) - This matches the encoded version of m which is %6D, the lowercase m, or the encoded version of M which is %4D.\n((\\%67)|g|(\\%47)) - This matches the encoded version of g which is %67, the lowercase g, or the encoded version of G which is %47.\n[^\\n]+ - This part of the pattern matches one or more characters that are not a newline character.\n((\\%3E)|>) - This matches the encoded version of > which is %3E, or the symbol > itself, denoting the end of an HTML tag.\nThe combination of these patterns is looking for a string that resembles an HTML img tag, which is a common vector for XSS attacks. XSS attacks involve injecting malicious scripts into webpages viewed by other users, exploiting the trust a user has for a particular site. XSS attacks can occur when a web application uses unsanitized user input in the output it generates.","zq":"資安分析師 Jane 分析 IDS 日誌時，偵測到符合下列正規表示式的事件：/((\\%3C)|<)((\\%69)|i|(\\%49))((\\%6D)|m|(\\%4D))((\\%67)|g|(\\%47))[^\\n]+((\\%3E)|>)/I。此事件代表什麼？","zo":["目錄穿越攻擊","參數竄改攻擊","XSS 攻擊","SQL 注入攻擊"],"ze":"此 regex 比對 <（%3C）+ i/m/g（含大小寫與 URL 編碼）+ 任意字元 + >（%3E），也就是 <img ...> 標籤，是常見的 XSS 注入向量（如 <img src=x onerror=alert(1)>）。"},{"n":85,"c":"ir","q":"Which one of the following is the correct flow for Setting Up a Computer Forensics Lab?","o":["Planning and budgeting –> Physical location and structural design considerations –> Work area considerations –> Human resource considerations –> Physical security recommendations –> Forensics lab licensin
