 vulnerability that enabled initial access. Updating mail filtering rules to block the malicious payload reduces reinfection risk and removes the delivery path. Network segmentation can be a containment measure, but in this context it is being implemented as a corrective control to prevent continued lateral movement and re-compromise as part of eliminating the threat’s operational pathways. Evidence gathering is already implied by the forensic identification of the exploited CVE; recovery would involve restoring services and data after the threat is removed. In SOC practice, containment stops immediate spread (isolate servers, block traffic), while eradication focuses on removing malware, closing exploited vulnerabilities, removing persistence, and making the environment safe for return-to-service. Because the scenario explicitly includes patching and control changes aimed at eliminating the exploit vector and stopping recurrence, eradication is the best fit.","zq":"團隊收到影響郵件基礎架構的勒索軟體告警。鑑識確認其利用未修補郵件伺服器上的 CVE-2024-0123。事件應變團隊正部署緊急修補（KB5025941）、更新郵件過濾規則以阻擋惡意酬載，並實施額外網路分段以限制橫向移動。SOC 目前執行的是哪個階段？","zo":["證據蒐集與鑑識分析","根除","圍堵","復原"],"ze":"修補被利用的漏洞、阻斷投遞管道、消除攻擊者再入侵的途徑，是在移除根因，屬根除階段。圍堵著重立即阻止擴散；復原則是恢復服務與資料。"},{"n":177,"c":"web","q":"Which of the following attack can be eradicated by disabling of \"allow_url_fopen and allow_url_include\" in the php.ini file?","o":["File Injection Attacks","URL Injection Attacks","LDAP Injection Attacks","Command Injection Attacks"],"a":0,"e":"Disabling theallow_url_fopen allow_url_include and directives in the configuration file is a php.ini\nrecommended security measure to mitigate the risk of File Injection Attacks in PHP applications. These settings, when enabled, allow PHPscripts to open and include files from remote locations through URL references. This capability can be exploited in File Injection Attacks, where attackers inject malicious files into the application by manipulating inputs to reference external resources. By disabling these directives, you limit PHP's ability to open or include files only to local resources, thus significantly reducing the risk associated with remote file inclusion vulnerabilities. This specific countermeasure is effective against File Injection Attacks but does not directly impact other types of injection attacks such as URL, LDAP, or Command Injection.","zq":"在 php.ini 中停用 allow_url_fopen 與 allow_url_include，可以根除哪一種攻擊？","zo":["檔案注入攻擊","URL 注入攻擊","LDAP 注入攻擊","命令注入攻擊"],"ze":"這兩個設定允許 PHP 以 URL 開啟或 include 遠端檔案，是遠端檔案包含（RFI）等檔案注入攻擊的前提。停用後 PHP 只能包含本機檔案。"},{"n":178,"c":"siem","q":"David is a SOC analyst in Karen Tech. One day an attack is initiated by the intruders but David was not able to find any suspicious events.\nThis type of incident is categorized into?","o":["True Positive Incidents","False positive Incidents","True Negative Incidents","False Negative Incidents"],"a":3,"e":"A false negative incident in the context of a Security Operations Center (SOC) is when an actual attack or intrusion occurs, but the SOC analyst fails to detect any suspicious events or indicators of compromise. This means that the security measures in place did not work as intended, and the attack went unnoticed.\nIn David’s case, since an attack was initiated and he was not able to find any suspicious events, it is categorized as a false negative incident. This is a critical type of incident because it indicates a failure in the detection capabilities of the SOC, potentially allowing the intruder to cause harm without being detected.","zq":"Karen Tech 的 SOC 分析師 David 遇到入侵者發動攻擊，但他找不到任何可疑事件。這類事件屬於？","zo":["真陽性事件","偽陽性事件","真陰性事件","偽陰性事件"],"ze":"攻擊確實發生卻沒被偵測到 = 偽陰性（False Negative），代表偵測能力有缺口，是最危險的類型。偽陽性則是誤報：無攻擊卻告警。"},{"n":179,"c":"ops","q":"InfoSystem LLC, a US-based company, is establishing an in-house SOC. John has been given the responsibility to finalize strategy, policies, and procedures for the SOC.\nIdentify the job role of John.","o":["Security Analyst – L1","Chief Information Security Officer (CISO)","Security Engineer","Security Analyst – L2"],"a":1,"e":"The role offinalizing strategy, policies, and procedures for a Security Operations Center (SOC) typically falls under the responsibilities of a Chief Information Security Officer (CISO). The CISO is a senior-level executive within an organization who coordinates and manages the overall strategy and defense mechanisms to protect the organization’s information and technology assets. This role involves leadership and strategic decision-making, which includes establishing the SOC’s framework, defining its policies, and overseeing its procedures.","zq":"美國公司 InfoSystem 正在建立內部 SOC，John 負責最終確定 SOC 的策略、政策與程序。John 的職務是？","zo":["資安分析師 – L1","資訊安全長（CISO）","資安工程師","資安分析師 – L2"],"ze":"制定 SOC 策略、政策與程序屬於高階管理職責，由 CISO 負責。L1/L2 分析師負責監控與調查；資安工程師負責設計與建置安全系統。"},{"n":180,"c":"hunt","q":"Which of the following event detection techniques uses User and Entity Behavior Analytics (UEBA)?","o":["Rule-based detection","Heuristic-based detection","Anomaly-based detection","Signature-based detection"],"a":2,"e":"User and Entity Behavior Analytics (UEBA) is a cybersecurity process that uses machine learning, algorithms, and statistical analyses to detect abnormal behavior of users and entities within an organization. UEBA systems analyze patterns of behavior and can identify anomalies that deviate from the norm, which could indicate a potential security threat.\nAnomaly-based detection is the technique that aligns with UEBA’s functionality. It contrasts with:\nRule-based detection, which relies on predefined rules to detect threats.\nHeuristic-based detection, which uses experience-based techniques.\nSignature-based detection, which depends on known patterns orsignatures of malware to identify threats.\nAnomaly-based detection systems are designed to be dynamic, continuously learning and establishing what is considered normal to identify deviations. This approach is particularly effective in identifying previously unknown threats, hence its alignment with UEBA.","zq":"下列哪一種事件偵測技術使用使用者與實體行為分析（UEBA）？","zo":["規則式偵測","啟發式偵測","異常偵測","特徵碼偵測"],"ze":"UEBA 以機器學習與統計建立使用者與實體的正常行為基準，找出偏離基準的行為，屬於異常偵測，可發現未知威脅與內部威脅。"},{"n":181,"c":"hunt","q":"The SOC team at a national cybersecurity agency detects anomalous network traffic from a sensitive government server and escalates to forensics. The forensic team discovers a trojan suspected of data exfiltration and persistence. The lead malware analyst must determine capabilities and persistence mechanisms by analyzing the trojan’s binary code at the instruction level without executing it. Which technique should the analyst use?","o":["Malware disassembly","Network behavior monitoring","Dynamic code injection","Interactive debugging"],"a":0,"e":"Malware disassembly is the technique used to analyze a binary at the instruction level without executing it. It converts compiled machine code into assembly instructions so an analyst can study program logic, identify functions, locate strings and API calls, and understand how the malware performs actions such as persistence, command execution, credential theft, and exfiltration. This meets the requirement to avoid execution on a sensitive system, which is critical in high-risk environments where unintended detonation could cause further damage. Network behavior monitoring requires execution to observe outbound connections and protocols, which violates the “without executing” constraint. Dynamic code injection is an active technique used during runtime and is not appropriate when execution must be avoided. Interactive debugging often involves running the program under a debugger to observe behavior step-by-step; while it can be done in controlled labs, it still requires execution. For strict non-execution, disassembly is the correct static technique. SOC teams use disassembly results to produce detections (behavioral signatures, YARA-like patterns, API sequence indicators) and to identify IOCs such as domains, mutexes, registry keys, and file paths for enterprise-wide hunting.","zq":"國家資安機構 SOC 偵測到敏感政府伺服器異常流量並升級給鑑識團隊，發現疑似能外洩資料與持久化的木馬。首席惡意程式分析師必須在「不執行」的情況下，於指令層級分析木馬二進位檔以判斷其能力與持久化機制。應使用哪一種技術？","zo":["惡意程式反組譯（Disassembly）","網路行為監控","動態程式碼注入","互動式除錯"],"ze":"反組譯把機器碼轉成組合語言指令，可在不執行的情況下分析函式、字串、API 呼叫與持久化邏輯（常用 IDA Pro、Ghidra）。網路監控、動態注入與互動式除錯都需要執行程式。"},{"n":182,"c":"net","q":"Juliea a SOC analyst, while monitoring logs, noticed large TXT, NULL payloads.\nWhat does thisindicate?","o":["Concurrent VPN Connections Attempt","DNS Exfiltration Attempt","Covering Tracks Attempt","DHCP Starvation Attempt"],"a":1,"e":"Juliea, the SOC analyst, noticed large TXT and NULL payloads in the logs. This is indicative of a DNS exfiltration attempt. DNS exfiltration is a type of cyber attack where an attacker uses the DNS protocol to sneak data out of a network undetected. It typically involves the use of large TXT records, which can be used to carry data out of the network. NULL payloads can be used in this context to pad the DNS queries and make them less suspicious or to bypass security controls that inspect the content of DNSqueries.\nThe steps involved in DNS exfiltration include:\nThe attacker compromises a system within the target network.\nMalware on the compromised system encodes the data it wants to exfiltrate.\nThe encoded data is split into chunks that fit into DNS query sizes.\nThese chunks are sent as data in DNS queries or responses, often using TXT records.\nAn external attacker-controlled server receives the DNS queries and decodes the data.","zq":"SOC 分析師 Juliea 監控日誌時注意到大量 TXT、NULL 類型的大型酬載，這代表什麼？","zo":["並行 VPN 連線嘗試","DNS 資料外洩嘗試","掩蓋行蹤嘗試","DHCP 耗盡嘗試"],"ze":"DNS 外洩／通道會把資料編碼後塞進查詢與回應，TXT 與 NULL 記錄可承載較大資料量，因此大量大型 TXT/NULL 酬載是 DNS 外洩的典型指標。"},{"n":183,"c":"risk","q":"According to the Risk Matrix table, what will be the risk level when the probability of an attack is very high, and the impact of that attack is major?\nNOTE: It is mandatory to answer the question before proceeding to the next one.","o":["High","Extreme","Low","Medium"],"a":1,"e":"In a Risk Matrix, risk levels are determined by the intersection of the likelihood of anoccurrence (probability) and the consequence of that occurrence (impact). When the probability of an event is very high and the impact is major, it typically falls into the ‘Extreme’ category. This is because the combination of a high likelihood and major impact represents a scenario where the risk is unacceptable and requires immediate attention and mitigation measures.","zq":"依風險矩陣表，當攻擊發生機率「非常高」且影響為「重大」時，風險等級為何？","zo":["高","極高","低","中"],"ze":"機率非常高 × 影響重大 = 極高（Extreme），屬不可接受的風險，需立即處理。對照第 169 題：機率非常低 × 重大 = 低。"},{"n":184,"c":"log","q":"What does Windows event ID 4740 indicate?","o":["A user account was locked out.","A user account was disabled.","A user account wasenabled.","A user account was created."],"a":0,"e":"Event ID 4740 is a security audit event in Windows that indicates a user account has been locked out. This event is generated every time the system locks out a user account due to repeated logon failures, which are typically caused by incorrect password entries. The event is logged on domain controllers, member servers, and workstations where the lockout occurred. It includes details such as the account name, domain, and the computer from which the lockout originated.","zq":"Windows 事件 ID 4740 代表什麼？","zo":["使用者帳號已被鎖定","使用者帳號已被停用","使用者帳號已被啟用","使用者帳號已被建立"],"ze":"4740 = 帳號被鎖定（通常因多次密碼錯誤），記錄於網域控制站，包含來源電腦名稱，可追查暴力破解來源。對照：4720 建立、4722 啟用、4725 停用。"},{"n":185,"c":"log","q":"John as a SOC analyst is worried about the amount of Tor traffic hitting the network. He wants to prepare adashboard in the SIEM to get a graph to identify the locations from where the TOR traffic is coming.\nWhich of the following data source will he use to prepare the dashboard?","o":["DHCP/Logs capable of maintaining IP addresses or hostnames withIPtoName resolution.","IIS/Web Server logs with IP addresses and user agent IPtouseragent resolution.","DNS/ Web Server logs with IP addresses.","Apache/ Web Server logs with IP addresses and Host Name."],"a":0,"e":"To monitor and visualize Tor traffic hitting the network, John would need data sources that can provide detailed information about the source IP addresses of incoming traffic, as well as the capability to resolve these IP addresses to more identifiable information such as hostnames or geographical locations. DHCP logs, or other log sources capable of maintaining detailed IP address records and facilitating IP-to-Name resolution, would be suitable for this purpose. This data would allow John to create a dashboard in the SIEM system that maps the source IP addresses of Tor traffic to their corresponding locations or identities, providing insights into where the Tor traffic is originating. While web server logs (options B, C, and D) can provide IP addresses, they might not offer the same level of detail or resolution capabilities as DHCP logs or similar network-level logs for this specific use case.","zq":"SOC 分析師 John 擔心大量 Tor 流量進入網路，想在 SIEM 中建立儀表板，以圖表顯示 Tor 流量的來源位置。他應使用哪一種資料來源？","zo":["DHCP／能維護 IP 位址或主機名稱並做 IP 對名稱解析的日誌","IIS／含 IP 位址與 User-Agent 的 Web 伺服器日誌","DNS／含 IP 位址的 Web 伺服器日誌","Apache／含 IP 位址與主機名稱的 Web 伺服器日誌"],"ze":"題庫答案為 A：需要能保存 IP 並將 IP 解析為主機名稱（IPtoName）的資料來源，才能把流量對應到位置與主機。實務上常結合 Tor 出口節點清單與 GeoIP 做判斷。"},{"n":186,"c":"net","q":"DNS logs in the SIEM show an internal host sending many DNS queries with long, encoded subdomains to an external domain. The queries predominantly use TXT records and occur during off-business hours. The external domain is newly registered and has no known business association. Which option best explains this behavior?","o":["Monitoring DNS cache poisoning attempts","Detecting rogue DNS servers within the internal network","Identifying DNS tunneling for data exfiltration","Validating DNS records for legitimate business operations"],"a":2,"e":"The described pattern is highly consistent with DNS tunneling used for command-and-control or data exfiltration. Long, encoded subdomains are commonly used to embed data into DNS queries because DNS labels can carry arbitrary text that can be base32/base64/hex encoded. TXT records are frequently abused in tunneling because they can return larger payloads and are flexible for exchanging data between malware and an external resolver or authoritative DNS infrastructure controlled by an attacker. The fact that this occurs off-hours and targets a newly registered domain with no business relationship increases suspicion and reduces the likelihood of legitimate use. DNS cache poisoning attempts would typically show anomalies in resolver behavior, unexpected DNS responses, or mismatched records, not a high volume of encoded outbound queries from a single internal host. Rogue DNS servers would present as internal hosts acting as resolvers or responding to many DNS queries, not sending encoded TXT queries outward. Legitimate record validation might involve standard query types (A/AAAA/CNAME) and normal domain names, not long encoded subdomains. For SOC triage, the next steps would include identifying the originating process/host, blocking the domain, capturing related network flows, and scoping for other hosts with similar DNS patterns.","zq":"SIEM 的 DNS 日誌顯示某內部主機發出大量帶有長串編碼子網域的 DNS 查詢，指向一個外部網域；查詢多為 TXT 記錄、發生於非上班時段，且該網域為新註冊、與業務無關。下列哪一項最能解釋此行為？","zo":["監控 DNS 快取汙染嘗試","偵測內部網路中的惡意 DNS 伺服器","識別用於資料外洩的 DNS 通道","驗證合法業務的 DNS 紀錄"],"ze":"長串編碼子網域（Base32/Base64/Hex 承載資料）+ TXT 記錄 + 新註冊網域 + 離峰時段 = DNS 通道（Tunneling）用於 C2 或資料外洩。應找出來源行程、封鎖網域並擴大清查類似模式的主機。"},{"n":187,"c":"log","q":"Which of the following fields in Windows logs defines the type of event occurred, such as Correlation Hint, Response Time, SQM, WDI Context, and so on?","o":["Keywords","Task Category","Level","Source"],"a":1,"e":"The Task Category in Windows logs is used to define the type of event that has occurred. It is a subcategory within the event itself that provides additional context about the event, such as whether it is a Correlation Hint, Response Time, SQM, WDI Context, etc. This categorization helps in filtering and identifying events based on their nature and type.","zq":"Windows 日誌中，哪一個欄位定義事件的類型，例如 Correlation Hint、Response Time、SQM、WDI Context 等？","zo":["關鍵字（Keywords）","工作類別（Task Category）","等級（Level）","來源（Source）"],"ze":"題庫答案為 Task Category（工作類別）：事件的子分類，提供事件性質的額外情境，便於篩選。Level 是嚴重度（資訊／警告／錯誤）；Source 是產生事件的元件。"},{"n":188,"c":"siem","q":"A multinational corporation with strict regulatory requirements (e.g., GDPR, PCI-DSS) needs a SIEM solution to monitor its global network. Data residency laws in certain regions prohibit transferring logs outside local jurisdictions. The company also requires centralized monitoring with 24/7 SOC operations but has limited in-house SIEM expertise. Which SIEM deployment model is appropriate?","o":["Self-hosted, jointly managed","Hybrid model, jointly managed","Self-hosted, MSSP-managed","Cloud, MSSP-managed"],"a":1,"e":"A hybrid, jointly managed model best satisfies the competing requirements: regional data residency constraints plus centralized monitoring and limited internal SIEM expertise. Hybrid SIEM deployments can keep logs stored and processed within required jurisdictions (for example, regional collectors/workspaces or on-prem storage) while still enabling centralized oversight through federated monitoring, cross-region dashboards, or aggregated metadata that does not violate residency rules. “Jointly managed” addresses the limited expertise by involving a service provider or external specialists alongside internal teams, allowing 24\n/7 SOC coverage and operational support while maintaining control and governance required by regulations. A fully cloud, MSSP-managed model can conflict with data residency if logs must not leave a region and the cloud tenancy doesn’t meet specific jurisdictional requirements. A self-hosted model reduces residency risk but can fail operationally if internal expertise is limited and 24/7 coverage cannot be sustained. Therefore, a hybrid model jointly managed provides the best balance of compliance, centralized visibility, and operational capability.","zq":"受 GDPR、PCI-DSS 等嚴格法規約束的跨國企業需要 SIEM 監控全球網路。部分地區的資料在地化法規禁止將日誌傳出轄區；公司也需要集中監控與 24/7 SOC，但內部 SIEM 專業有限。應採用哪一種 SIEM 部署模式？","zo":["自建，共同管理","混合模式，共同管理","自建，MSSP 管理","雲端，MSSP 管理"],"ze":"混合模式可讓各區日誌留在當地（區域收集器／工作區），同時做聯合式集中監控；共同管理則藉外部專業補足 24/7 能力。全雲端可能違反資料在地化；全自建則缺乏專業人力。"},{"n":189,"c":"hunt","q":"A threat hunter analyzing an infected endpoint finds that malicious processes keep reappearing even after termination, making traditional remediation ineffective. The user reports slowdowns, abnormal pop-ups, and unauthorized application launches. Deeper inspection reveals multiple scheduled tasks executing unknown scripts at intervals, along with suspicious registry modifications enabling automatic execution on startup. The endpoint makes intermittent encrypted outbound connections to an unclassified external server. The organization also observed multiple failed privileged logins from the same subnet. Which signs should the threat hunter look for to confirm and mitigate the threat?","o":["Network-based artifacts","Threat intelligence and adversary context","Host-based artifacts","Indicators of Attack (IoAs)"],"a":2,"e":"Host-based artifacts are the most direct evidence to confirm persistence and recurring execution on an endpoint. The scenario already describes classic host persistence mechanisms: scheduled tasks and registry autorun modifications. To confirm and mitigate, a threat hunter should focus on endpoint-resident artifacts such as: persistence entries (scheduled tasks, Run/RunOnce keys, services, WMI subscriptions), process ancestry (which parent launches the malicious script), file system changes (dropped scripts, DLLs, staged payloads), and security control tampering. These artifacts enable containment and eradication because they point to what must be removed and what must be prevented from re-creating itself after reboot. Network-based artifacts are important for identifying C2 destinations and potential lateral movement, but they won’t fully explain how the malware survives termination. Threat intelligence context can help attribute and match TTPs, but it’s not required to confirm persistence locally. Indicators of Attack are behavior patterns (like scheduled task creation, registry autoruns, process injection) and are valuable conceptually, but the option that best represents the concrete evidence you need to examine and remediate on the endpoint is “host-based artifacts.” In SOC response, you’d combine host artifact removal with credential resets and scoping for similar persistence across endpoints.","zq":"威脅獵人分析一台受感染端點，發現惡意行程被終止後仍不斷重現。使用者回報變慢、異常彈窗與未授權程式啟動。深入檢查發現多個排程工作定時執行未知腳本、登錄檔被修改以開機自動執行，並有間歇性加密外連；同網段也出現多次特權登入失敗。應尋找哪一類跡象以確認並緩解威脅？","zo":["網路型跡證","威脅情資與攻擊者背景","主機型跡證（Host-based artifacts）","攻擊指標（IoA）"],"ze":"惡意行程能「死而復生」的關鍵在於主機上的持久化機制：排程工作、Run/RunOnce 機碼、服務、WMI 訂閱、落地腳本等。檢查並清除這些主機型跡證才能根除。網路跡證可找 C2，但無法解釋持久化。"},{"n":190,"c":"siem","q":"Secuzin Corp. is a large enterprise performing millions of financial transactions daily, making it critical to analyze security logs efficiently, detect suspicious activities, and respond to incidents in real time. Its SOC is responsible for managing security logs from various network devices, including firewalls, intrusion detection systems (IDS), authentication servers, and cloud services. To fulfill compliance and regulatory requirements that mandate long-term archival of logs, you need to provide a log storage solution that is scalable to handle increasing log volumes, provides encryption for data security, and is seamlessly accessible. Which storage solution should you choose to meet these long-term log storage requirements?","o":["Distributed storage system","Hybrid storage system","Local storage","Cloud storage"],"a":3,"e":"Cloud storage best meets long-term log archival requirements when the priorities are scalability, encryption, durability, and accessibility. From a SOC and compliance standpoint, log volume growth is predictable and often spikes during incidents; cloud storage provides elastic scale without the operational overhead of continuously expanding on-prem capacity. Encryption at rest and in transit is typically standard in cloud storage services, supporting confidentiality requirements for regulated data. Cloud storage also supports lifecycle management (hot to cool/archive tiers), retention policies, and immutability options that help preserve evidentiary integrity for investigations and audits. Local storage is limited by physical capacity, increases risk of single-site failure, and becomes costly to scale and maintain for multi-year retention. “Distributed” and “hybrid” can be viable architectures, but they are broader design patterns rather than a direct fit to the stated requirements; distributed systems still require significant operational management, and hybrid introduces complexity around governance and residency unless explicitly required. Given the need for scalable, encrypted, long-term archival that remains accessible for SOC analytics and audits, cloud storage is the most appropriate option in this question’s context.","zq":"Secuzin 每天處理數百萬筆金融交易，SOC 管理防火牆、IDS、驗證伺服器與雲端服務的日誌。為符合法規的長期日誌保存要求，需要一個可擴充以應付日誌量成長、提供加密且能便利存取的儲存方案。應選擇哪一種？","zo":["分散式儲存系統","混合儲存系統","本機儲存","雲端儲存"],"ze":"雲端儲存具彈性擴充、預設靜態與傳輸加密、生命週期管理（熱／冷／封存層）與不可變更（immutability）選項，適合長期合規保存。本機儲存容量有限且有單點故障風險。"},{"n":191,"c":"net","q":"Which of the following attacks causes sudden changes in file extensions or increase in file renames at rapid speed?","o":["Ransomware Attack","DoS Attack","DHCP starvation Attack","File Injection Attack"],"a":0,"e":"Ransomware encrypts files rapidly, typically renaming them and changing their extensions; a sudden spike in file renames or extension changes is a common ransomware detection indicator.","zq":"下列哪一種攻擊會造成副檔名突然改變，或檔案重新命名次數急速增加？","zo":["勒索軟體攻擊","DoS 攻擊","DHCP 耗盡攻擊","檔案注入攻擊"],"ze":"勒索軟體加密檔案時會大量快速地重新命名並改變副檔名（如 .locked、.crypt），監控檔案重新命名速率與副檔名變化是常見的勒索軟體偵測方法。"},{"n":192,"c":"siem","q":"Which of the following are the responsibilities of SIEM Agents?\n1.Collecting data received from various devices sending data to SIEM before forwarding it to the central engine.\n2.Normalizing data received fromvarious devices sending data to SIEM before forwarding it to the central engine.\n3.Co-relating data received from various devices sending data to SIEM before forwarding it to the central engine.\n4.Visualizing data received from various devices sending data to SIEM before forwarding it to the central engine.","o":["1 and 2","2 and 3","1 and 4","3 and 1"],"a":0,"e":"SIEM Agents are primarily responsible for the initial stages of data processing within a SIEM system. Their duties include:\nCollecting data: SIEM Agents collect logs and other data from various devices across the network. This is a crucial step as it ensures that all relevant data is gathered for analysis.\nNormalizing data: Once the data is collected, SIEM Agents normalize it, which means they convert different log and data formats into a standardized format. This process is essential for the SIEM’s central engine to analyze and correlate the data effectively.\nThe responsibilities of SIEM Agents generally do not include correlating data (which is typically done by the central SIEM engine) or visualizing data (which is usually a function of the SIEM’s user interface or reporting tools).","zq":"下列哪些是 SIEM 代理程式（Agent）的職責？\n1. 在轉送到中央引擎前，收集各裝置送往 SIEM 的資料\n2. 在轉送到中央引擎前，將各裝置送往 SIEM 的資料正規化\n3. 在轉送到中央引擎前，將各裝置送往 SIEM 的資料進行關聯\n4. 在轉送到中央引擎前，將各裝置送往 SIEM 的資料視覺化","zo":["1 和 2","2 和 3","1 和 4","3 和 1"],"ze":"SIEM Agent 負責前端的收集與正規化；關聯由中央 SIEM 引擎執行，視覺化則由 SIEM 介面或報表工具負責。"},{"n":193,"c":"hunt","q":"A financial services company hosts an online banking platform accessible via a public web portal. The SOC team has deployed Snort IDS to monitor HTTP traffic for potential attacks targeting the login page. One day, a user attempts to log in multiple times, generating a series of failed authentication events. During this time, Snort IDS triggers an alert based on the following rule:\nalert tcp any any -> any 80 (msg:\"SQL Injection attempt detected\"; content:\"' OR T=T\"; nocase; sid:1000001; rev:1;)\nThe alert indicates that an incoming HTTP request contained the classic SQL injection payload ' OR T=T, which is commonly used to bypass login authentication by always evaluating to true. The SIEM, integrated with Snort, receives this alert and correlates it with multiple failed login attempts from the same source IP. This triggers an automated response, temporarily blocking the suspicious IP address and notifying the SOC team. Which detection method is used by this rule?","o":["Behavioral-based detection","Signature-based detection","Anomaly-based detection","Statistical-based detection"],"a":1,"e":"This rule is signature-based because it matches a known malicious pattern (a specific string payload) within network traffic. Snort’s content keyword searches for an exact sequence of bytes/characters in the packet payload—in this case, a classic SQL injection tautology pattern intended to manipulate application logic. Signature detection is high-confidence when the signature is precise and the payload is strongly associated with malicious intent. In SOC operations, signature-based rules are commonly used for well-known exploit strings, malware beacons, and protocol abuse patterns. The tradeoff is that signatures can be bypassed with encoding, obfuscation, payload variations, or different injection strategies that avoid the exact string. Behavioral/anomaly/statistical methods, by contrast, focus on deviations from baseline or broader behavioral patterns (for example, unusual login rates, uncommon HTTP methods, or atypical data transfer volumes). Here, the detection trigger is explicitly the presence of a known SQL injection payload string, which is the defining characteristic of signature-based detection. The SIEM correlation with failed logins adds context and confidence, but the rule itself is still signature-driven.","zq":"金融公司網銀入口部署 Snort IDS 監控 HTTP 流量。某使用者多次登入失敗期間，Snort 依下列規則觸發告警：alert tcp any any -> any 80 (msg:\"SQL Injection attempt detected\"; content:\"' OR T=T\"; nocase; sid:1000001; rev:1;)。SIEM 將此告警與同一來源 IP 的多次登入失敗關聯，自動暫時封鎖該 IP 並通知 SOC。此規則使用的是哪一種偵測方法？","zo":["行為式偵測","特徵碼（Signature）偵測","異常偵測","統計式偵測"],"ze":"Snort 的 content 關鍵字比對封包酬載中特定字串（已知惡意模式），即特徵碼偵測。優點是準確度高，缺點是可被編碼或變形繞過。SIEM 的關聯只是加上情境，規則本身仍是特徵碼式。"},{"n":194,"c":"siem","q":"Katie is a SOC analyst at an international financial corporation. Her team needs functionality so the system continuously scans logs for anomalies, identifies suspicious activities, notifies analysts when predefined security thresholds are reached, and generates incidents or tickets to ensure immediate response. It must provide details such as event type, duration, affected device, and OS version. Which function should she configure to achieve this?","o":["Log collection","Alerting and reporting","Log normalization","Log parsing"],"a":1,"e":"Alerting and reporting is the SIEM/SOC function that turns detected conditions into actionable notifications and tracked incidents. The scenario requires real-time detection triggers (thresholds/anomalies), analyst notifications, and automatic ticket/incident generation with relevant context fields (event type, duration, affected device, OS version). That is exactly what alerting does: it monitors rules, correlations, and analytics outputs and produces alerts/incidents; reporting provides structured summaries and operational views for stakeholders and audits. Log collection is only ingesting data and does not create incidents. Log parsing extracts fields from raw messages, and log normalization standardizes those fields across sources—both are foundational, but they do not themselves generate alerts or tickets. In SOC practice, effective alerting depends on good parsing/normalization so alerts carry the right context, but the function that performs continuous monitoring and triggers incident workflows is alerting and reporting. This also supports escalation workflows, SLA tracking, and post-incident documentation because the alert/incident record becomes the primary case artifact.","zq":"國際金融公司 SOC 分析師 Katie 需要系統持續掃描日誌中的異常、辨識可疑活動、在達到預定門檻時通知分析師，並產生事件或工單以確保立即回應，內容需包含事件類型、持續時間、受影響裝置與作業系統版本。她應設定哪一項功能？","zo":["日誌收集","告警與報告","日誌正規化","日誌剖析"],"ze":"告警與報告功能負責持續比對規則、在達門檻時通知並建立事件／工單，附上情境欄位。收集、剖析、正規化都是前置作業，本身不會產生告警。"},{"n":195,"c":"ir","q":"TechSolutions, a software development firm, discovered a potential data leak after an external security researcher reported finding sensitive customer data on a public code repository. Level 1 SOC analysts confirmed the presence of the data and escalated the issue. Level 2 analysts traced the source of the leak to an internal network account. The incident response team has been alerted, and the CISO demands a comprehensive analysis of the incident, including the extent of the data breach and the timeline of events. The SOC manager must decide whom to assign to the in-depth investigation. To accurately determine the timeline, extent, and root cause of the data leak, which SOC role is critical in gathering and analyzing digital evidence?","o":["SOC Manager","Subject Matter Expert","Threat Intelligence Analyst","Forensic Analyst"],"a":3,"e":"A forensic analyst is the role best suited to perform in-depth evidence gathering and analysis required to reconstruct timelines, determine scope, and establish root cause for a data leak. This work includes preserving evidence (ensuring integrity), collecting endpoint and server artifacts, reviewing authentication and repository access logs, correlating commit history with identity and device telemetry, and building a defensible chain of events for leadership and potential legal/regulatory review. The SOC manager coordinates resources and priorities but typically does not perform hands-on forensic reconstruction. A subject matter expert may provide domain expertise (e.g., on Git workflows, cloud platforms, or database systems), but forensic rigor and evidence handling are the core requirement here. A threat intelligence analyst focuses on external adversary information, campaigns, and indicators; they can assist with context but are not the primary role for internal evidence reconstruction. Because the CISO needs timeline, extent, and root cause—deliverables that depend on digital evidence handling and forensic methodology—the forensic analyst is the critical assignment.","zq":"TechSolutions 被外部研究人員通報客戶敏感資料出現在公開程式碼儲存庫。L1 確認後升級，L2 追查到外洩來源為某內部帳號。CISO 要求完整分析外洩範圍與事件時間軸。為準確判定時間軸、範圍與根本原因，哪一個 SOC 角色在蒐集與分析數位證據上最關鍵？","zo":["SOC 經理","領域專家（SME）","威脅情報分析師","鑑識分析師"],"ze":"鑑識分析師負責保全證據、蒐集端點與伺服器跡證、關聯儲存庫存取紀錄與提交歷史，重建可經得起法律檢驗的時間軸與根因。SOC 經理負責調度；情報分析師著重外部威脅。"},{"n":196,"c":"log","q":"A SOC analyst receives an alert indicating that the system time on a critical Windows server was changed at 3:\n00 AM. There are no scheduled maintenance tasks at this time. Unauthorized time changes can be used to evade security controls, such as altering timestamps to obscure malicious activity. The analyst must identify the relevant event codes that log system time modifications and related suspicious behavior. Which of the following Windows Security Event Codes should the analyst review to investigate potential tampering?","o":["4608 and 4609","4625 and 4634","4616 and 4618","4616 and 4624"],"a":2,"e":"Event ID 4616 is the key Windows Security log event for “system time was changed,” and it is the primary artifact to confirm and investigate time-tampering. It typically includes details such as the previous time, the new time, and the account or process context responsible, which helps the SOC determine whether the change was authorized (maintenance) or suspicious (off-hours, unusual account, unexpected host). Event ID 4618 is useful as a companion signal because it indicates monitored security-relevant conditions and can help reveal related suspicious behavior around auditing or security event patterns that may coincide with timestamp manipulation. In practice, SOC analysts correlate the time-change event with surrounding authentication events, privilege use, and process creation telemetry to identify the actor and intent. The other options do not directly target the time-change activity: 4608/4609 relate to system startup/shutdown; 4625 is failed logon and 4634 is logoff; 4624 is successful logon (useful context, but not the event that records the time modification itself). Therefore, the best pairing for investigating time tampering in the options provided is 4616 and 4618.","zq":"SOC 分析師收到告警：某關鍵 Windows 伺服器的系統時間在凌晨 3:00 被修改，當時並無排程維護。未授權修改時間可用來規避安全控制，例如竄改時間戳以掩蓋惡意活動。分析師應檢視哪些 Windows 安全性事件代碼來調查可能的竄改？","zo":["4608 和 4609","4625 和 4634","4616 和 4618","4616 和 4624"],"ze":"4616 = 系統時間已變更（含舊時間、新時間與執行帳號），是調查時間竄改的核心事件；4618 = 發生受監控的安全事件模式，可作為相關可疑行為佐證。4608/4609 為開機／關機；4625/4634 為登入失敗／登出。"},{"n":197,"c":"net","q":"Which of the following service provides phishing protection and content filtering to manage the Internet experience on and off your network with the acceptable use or compliance policies?","o":["Apility.io","Malstrom","OpenDNS","I-Blocklist"],"a":2,"e":"OpenDNS provides extensive phishing protection and content filtering services. It operates by enforcing internet use policies on and off the network, ensuring that users adhere to acceptable use and compliance policies. Here’s how OpenDNS achieves this:\nPhishing Protection: OpenDNS uses predictive security to anticipate and prevent threats before they can reach the network. It does this by using DNS to enforce security, which is often quicker and more effective than traditional methods.\nContent Filtering: OpenDNS allows the network administrator to block unwanted content categories, thus enforcing compliance with organizational policies. This is done through DNS queries, which are checked against OpenDNS’s database to ensure they comply with the set policies.\nOff-Network Protection: OpenDNS’s roaming client allows the same level of protection and filtering even when devices are not connected to the company network, ensuring consistent enforcement of policies.","zq":"哪一項服務提供網路釣魚防護與內容過濾，能依可接受使用政策或合規政策管理網路內外的上網行為？","zo":["Apility.io","Malstrom","OpenDNS","I-Blocklist"],"ze":"OpenDNS（Cisco Umbrella）以 DNS 層級封鎖網釣與惡意網域，並依類別過濾內容；漫遊用戶端讓裝置離開公司網路時仍受保護。"},{"n":198,"c":"cti","q":"Which of the following is a Threat Intelligence Platform?","o":["SolarWinds MS","TC Complete","Keepnote","Apility.io"],"a":1,"e":"ThreatConnect Complete (TCComplete) is a Threat Intelligence Platform (TIP) designed to aggregate, analyze, and disseminate threat intelligence data. TIPs like TC Complete enable organizations to understand and act upon threats by providing a comprehensive view of the threat landscape, integrating with other security tools, and facilitating collaboration among security teams. Unlike general management systems like SolarWinds MS, note-taking applications like Keepnote, or threat intelligence APIs like Apility.io, TC Complete is specifically built to handle the lifecycle of threat intelligence, from collection and analysis to sharing and applying intelligence. This makes it a pivotal tool for organizations looking to enhance their security posture through informed decision-making based on timely and relevant threat intelligence.","zq":"下列何者是威脅情報平台（TIP）？","zo":["SolarWinds MS","TC Complete","Keepnote","Apility.io"],"ze":"ThreatConnect Complete（TC Complete）是威脅情報平台，負責彙整、分析、分享情資並與資安工具整合。SolarWinds 是 IT 管理工具；Keepnote 是筆記軟體；Apility.io 是信譽查詢 API。"},{"n":199,"c":"net","q":"A SOC analyst monitors network traffic to detect potential data exfiltration. The team uses a security solution that inspects data packets in real time as they traverse the network. During incident response, the solution struggles to analyze encrypted traffic, limiting effectiveness in identifying threats hidden within secure communications. Which security control, with this known limitation, is the SOC team relying on?","o":["VPN","Packet filters","SSH","IPsec"],"a":1,"e":"Packet filters are a network security control that inspects packet headers (source/destination IP, ports, protocol flags) to allow or block traffic. Their known limitation is that they generally do not inspect encrypted payload content; they can see metadata but not the application-layer data inside TLS/SSL sessions. The scenario describes a solution that “inspects data packets in real time” but struggles with encrypted traffic, which aligns with packet filtering and other header-based inspection approaches. VPN, SSH, and IPsec are encryption technologies/protocols themselves, not the inspection control; they create encrypted tunnels that make payload inspection harder. From a SOC viewpoint, packet filtering is valuable for fast enforcement and reducing attack surface, but it is limited for detecting threats embedded in encrypted sessions. To improve visibility, SOC teams often complement packet filters with TLS termination at controlled points (proxies), endpoint telemetry (process initiating connection), and flow analytics (NetFlow/IPFIX) to detect anomalies in encrypted traffic based on behavior and metadata.","zq":"SOC 分析師以一套即時檢查封包的方案監控網路流量以偵測資料外洩，但在事件應變時發現它難以分析加密流量，限制了發現加密通訊中隱藏威脅的能力。SOC 依賴的是哪一種有此已知限制的安全控制？","zo":["VPN","封包過濾器（Packet filters）","SSH","IPsec"],"ze":"封包過濾器只檢查標頭（IP、埠、協定、旗標），看不到加密酬載內容。VPN、SSH、IPsec 本身是加密技術，是造成檢查困難的原因而非檢查工具。可搭配 TLS 解密代理、端點遙測與流量分析補強。"},{"n":200,"c":"risk","q":"Which of the following formula represents the risk levels?","o":["Level of risk = Consequence × Severity","Level of risk = Consequence × Impact","Level of risk =Consequence × Likelihood","Level of risk = Consequence × Asset Value"],"a":2,"e":"The level of risk is typically calculated by considering the consequence (or impact) of an event and the likelihood (or probability) of its occurrence. The formula represents a fundamental risk assessment concept where risk is the product of the two factors:\nConsequence (Impact): The outcome or result if a threat does exploit a vulnerability.\nLikelihood (Probability): The chance that a given threat will exploit a vulnerability.\nBy multiplying these two factors, one can determine the level of risk, which helps in prioritizing risks and deciding on the appropriate level of controls and mitigation strategies.","zq":"下列哪一個公式代表風險等級？","zo":["風險等級 = 後果 × 嚴重度","風險等級 = 後果 × 衝擊","風險等級 = 後果 × 可能性","風險等級 = 後果 × 資產價值"],"ze":"風險等級 = 後果（Consequence）× 可能性（Likelihood），即風險矩陣的兩個軸。與第 171 題「風險 = 可能性 × 衝擊 × 資產價值」不同，請分開記憶。"}];

}

function shuffleArr(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function matches(d){
  if(S.cat!=="all" && d.c!==S.cat) return false;
  const k = S.q.trim().toLowerCase();
  if(!k) return true;
  const m = k.match(/^#(\d+)$/); if(m) return d.n===+m[1];
  return (d.q+" "+d.o.join(" ")+" "+d.zq+" "+d.zo.join(" ")+" "+d.ze+" "+d.e).toLowerCase().includes(k);
}
function sourceList(src){
  return DATA.filter(d => (src==="wrong" ? store.wrong[d.n] : src==="fav" ? store.fav[d.n] : src==="new" ? !store.hist[d.n] : src==="disp" ? DISPUTE[d.n] : true) && matches(d));
}

/* ---------- rendering pieces ---------- */
function qBlock(d){
  const L = store.lang;
  let h = "";
  if(L!=="en") h += `<div class="qz">${hl(d.zq)}</div>`;
  if(L!=="zh") h += `<div class="qe">${hl(d.q)}</div>`;
  return h;
}
function optText(d,i){
  const L = store.lang, z = d.zo[i], e = d.o[i];
  if(L==="zh") return hl(z);
  if(L==="en") return hl(e);
  return z===e ? hl(z) : `${hl(z)}<small>${hl(e)}</small>`;
}
function explBlock(d){
  const L = store.lang;
  let h = "";
  const dp = DISPUTE[d.n];
  if(dp) h += `<div class="disp"><h4>⚠ 題庫答案有爭議</h4><div class="body">
    <div class="dr main"><span>新版題庫 v2（批改依據）</span><b>${LET[d.a]}</b><span>${optText(d,d.a)}</span></div>
    <div class="dr"><span>原 200 題版（參考）</span><b>${LET[dp.old]}</b><span>${optText(d,dp.old)}</span></div>
    <div class="dn"><b>${DV[dp.v]}</b>：${esc(dp.note)}</div></div></div>`;
  const oldTag = dp ? `（依原 200 題版答案 ${LET[dp.old]} 撰寫）` : "";
  if(L!=="en") h += `<div class="expl"><h4>// 中文解析${oldTag}</h4><div class="body">${hl(d.ze)}</div></div>`;
  if(d.e){
    if(L==="en") h += `<div class="expl"><h4>// EXPLANATION${dp?` (written for the older answer ${LET[dp.old]})`:""}</h4><div class="body">${hl(d.e)}</div></div>`;
    else h += `<details class="en"><summary>英文原文解析 English explanation${oldTag}</summary><div>${hl(d.e)}</div></details>`;
  }
  return h;
}
function metaBlock(d, extra=""){
  const w = store.wrong[d.n], h = store.hist[d.n];
  return `<div class="qmeta"><span class="tag id">#${String(d.n).padStart(3,"0")}</span><span class="tag">${CATS[d.c]}</span>`+
    (DISPUTE[d.n]?`<span class="tag dq" title="兩份題庫的標準答案不同">⚠ 答案有爭議</span>`:"")+
    (w?`<span class="tag w">錯 ${w} 次</span>`:"")+
    (h?`<span class="tag">作答 ${h.t}・對 ${h.c}</span>`:"")+ extra +
    `<button class="star ${store.fav[d.n]?"on":""}" data-fav="${d.n}" title="收藏 (F)">${store.fav[d.n]?"★ 已收藏":"☆ 收藏"}</button></div>`;
}
function record(n, ok){
  const h = store.hist[n] || {t:0,c:0,last:0};
  h.t++; if(ok) h.c++; h.last = ok?1:0; store.hist[n] = h;
  if(!ok) store.wrong[n] = (store.wrong[n]||0) + 1;
  persist();
}

let pSrc = "all";
function practicePool(){
  const list = sourceList(pSrc);

  if(key !== S.pKey){
    S.pKey = key; S.pIdx = 0; S.pAns = {};

}

  }).join("");
  let fb = "";

      (store.wrong[d.n] ? `<span class="sp"></span><button class="btn" data-unwrong="${d.n}" style="padding:4px 10px;font-size:12.5px">從錯題本移除</button>` : "") + `</div>` + explBlock(d);

        <span class="sp"></span>
        <button class="btn pri" id="nextBtn" ${S.pIdx===order.length-1?"disabled":""}>下一題 →</button>
      </div>

    </div>`;

function practiceAnswer(i){
  const order = S.pOrder; if(!order || !order.length) return;
  const d = BY[order[S.pIdx]];
  if(S.pAns[d.n]!==undefined) return;
  S.pAns[d.n] = i;
  const ok = i===d.a;
  record(d.n, ok);
  if(ok && store.autoNext && S.pIdx < order.length-1){
    render(); setTimeout(()=>{ if(S.pAns[d.n]===i && BY[S.pOrder[S.pIdx]]===d){ S.pIdx++; render(); window.scrollTo({top:0,behavior:"smooth"}); } }, 900);
    return;
  }
  render();
}

function startExam(){
  const pool = sourceList(exCfg.src).map(d=>d.n);
  const set = shuffleArr(pool).slice(0, exCfg.count);
  EX = {set, ans:{}, flags:{}, i:0, start:Date.now(), limit:exCfg.minutes*60, done:false};
  clearInterval(startExam._t); startExam._t = setInterval(tick, 1000);
  render(); window.scrollTo({top:0});
}
function tick(){
  if(!EX || EX.done){ clearInterval(startExam._t); return; }
  const el = $("#timer"); const used = Math.floor((Date.now()-EX.start)/1000);
  const fmt = s => `${String(Math.floor(s/3600)).padStart(2,"0")}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  if(EX.limit){
    const left = EX.limit - used;
    if(left<=0){ submitExam(true); return; }
    if(el){ el.textContent = fmt(left); el.classList.toggle("low", left<120); }
  } else if(el){ el.textContent = "已用 " + fmt(used); el.style.fontSize="18px"; }
}
function submitExam(auto, sure){
  if(!EX || EX.done) return;
  const un = EX.set.length - Object.keys(EX.ans).length;
  if(!auto && !sure && un>0){ ask(`還有 ${un} 題未作答，確定要交卷嗎？`, ()=>submitExam(false,true)); return; }
  EX.done = true; EX.used = Math.floor((Date.now()-EX.start)/1000);
  clearInterval(startExam._t);
  let right = 0;
  EX.set.forEach(n => { const a = EX.ans[n]; const ok = a===BY[n].a; if(ok) right++; if(a!==undefined) record(n, ok); });
  EX.right = right; EX.pct = Math.round(right/EX.set.length*100);
  const dt = new Date();
  store.exams.push({date:`${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}`, total:EX.set.length, pct:EX.pct});
  store.exams = store.exams.slice(-30); persist();
  if(auto) toast("時間到，已自動交卷");
  render(); window.scrollTo({top:0});
}

function reviewItem(d, chosen, idx){
  const L = store.lang;

  }).join("");
  const verdict = chosen===undefined ? `<span class="tag w">未作答</span>` : (chosen===d.a?`<span class="tag" style="color:var(--ok);border-color:var(--ok)">✓ 答對</span>`:`<span class="tag w">✗ 你選 ${LET[chosen]}</span>`);
  return `<div class="card item lang-${L}">${metaBlock(d, (idx?`<span class="tag">第 ${idx} 題</span>`:"")+verdict)}${qBlock(d)}<div class="mini">${mini}</div>${explBlock(d)}</div>`;
}

  let head = "";
  if(kind==="browse"){
    head = `<div class="toolbar" style="margin-top:0"><div class="seg"><button id="revBtn" class="${S.reveal?"on":""}">${S.reveal?"◉ 顯示答案與解析":"○ 隱藏答案"}</button></div>
      <span class="poolinfo" style="margin:0">符合條件：<b>${list.length}</b> 題</span></div>`;
  } else {
    const total = Object.keys(kind==="wrong"?store.wrong:store.fav).length;
    head = `<div class="toolbar" style="margin-top:0">
      <span class="poolinfo" style="margin:0">${kind==="wrong"?"錯題本":"收藏夾"}共 <b>${total}</b> 題${list.length!==total?`（目前篩選顯示 ${list.length} 題）`:""}</span><span class="sp"></span>
      <button class="btn pri" data-practice="${kind}" ${list.length?"":"disabled"}>▶ 練習這些題目</button>
      <button class="btn" data-exam="${kind}" ${list.length?"":"disabled"}>⏱ 用這些題目測驗</button>
      ${kind==="wrong"&&total?`<button class="btn danger" id="clearWrong">清空錯題本</button>`:""}</div>`;
  }
  if(!list.length){
    const msg = kind==="wrong" ? "錯題本是空的。在刷題或測驗中答錯的題目會自動收進這裡。" : kind==="fav" ? "還沒有收藏題目。點題目右上角的「☆ 收藏」即可加入。" : "沒有符合條件的題目。";
    $("#view").innerHTML = head + `<div class="card empty"><div class="big">[ ∅ ]</div>${msg}</div>`; return;
  }
  const show = list.slice(0, listLimit);
  const items = show.map(d=>{
    const open = kind!=="browse" || S.reveal;
    const mini = d.o.map((_,i)=>`<div class="${open&&i===d.a?"right":""}"><b>${LET[i]}</b><span>${optText(d,i)}</span></div>`).join("");
    const acts = `<div class="acts">${!open?`<button class="btn" data-peek="${d.n}">顯示答案</button>`:""}
      <button class="btn" data-goq="${d.n}">在刷題模式開啟</button>
      ${kind==="wrong"?`<button class="btn danger" data-unwrong="${d.n}">移出錯題本</button>`:""}</div>`;
    return `<div class="card item lang-${L}" id="it${d.n}">${metaBlock(d)}${qBlock(d)}<div class="mini">${mini}</div>
      ${open?explBlock(d):`<div class="peek" data-for="${d.n}"></div>`}${acts}</div>`;
  }).join("");
  const more = list.length>listLimit ? `<div style="text-align:center;margin-top:14px"><button class="btn" id="moreBtn">載入更多（剩 ${list.length-listLimit} 題）</button></div>` : "";
  $("#view").innerHTML = head + `<div class="list">${items}</div>` + more;
}

/* ---------- STATS ---------- */
function renderStats(){
  const rows = Object.entries(CATS).map(([k,v])=>{
    const ds = DATA.filter(d=>d.c===k);
    const tried = ds.filter(d=>store.hist[d.n]);
    const t = tried.reduce((a,d)=>a+store.hist[d.n].t,0), c = tried.reduce((a,d)=>a+store.hist[d.n].c,0);
    const w = ds.filter(d=>store.wrong[d.n]).length;
    return {k,v,total:ds.length,tried:tried.length,acc:t?Math.round(c/t*100):null,w};
  });
  const hs = Object.values(store.hist);
  const mastered = DATA.filter(d=>store.hist[d.n] && store.hist[d.n].last===1 && !store.wrong[d.n]).length;
  $("#view").innerHTML = `<div class="grid2 half">
    <div class="card corner"><h3 style="font-family:var(--mono);font-size:12px;color:var(--muted);margin:0 0 12px">// 各分類掌握度</h3>
      <div class="catstat">${rows.map(r=>`<div class="row"><span>${r.v}</span><span class="num">${r.tried}/${r.total} · ${r.acc===null?"—":r.acc+"%"}${r.w?` · <span style="color:var(--bad)">錯 ${r.w}</span>`:""}</span>
        <div class="bar"><i style="width:${r.tried/r.total*100}%;background:${r.acc===null?"var(--line2)":r.acc>=70?"var(--ok)":r.acc>=50?"var(--warn)":"var(--bad)"}"></i></div></div>`).join("")}</div>
      <div class="note" style="margin-top:10px">長條長度＝練習覆蓋率，顏色＝正確率（綠 ≥70%、黃 ≥50%、紅 &lt;50%）</div></div>
    <div class="card"><h3 style="font-family:var(--mono);font-size:12px;color:var(--muted);margin:0 0 12px">// 總覽</h3>
      <table class="cat">
        <tr><td>已練習題數</td><td class="n">${hs.length} / 200</td></tr>
        <tr><td>總作答次數</td><td class="n">${hs.reduce((a,h)=>a+h.t,0)}</td></tr>
        <tr><td>最近一次答對且不在錯題本</td><td class="n">${mastered}</td></tr>
        <tr><td>錯題本</td><td class="n">${Object.keys(store.wrong).length}</td></tr>
        <tr><td>收藏</td><td class="n">${Object.keys(store.fav).length}</td></tr>
        <tr><td>模擬測驗次數</td><td class="n">${store.exams.length}</td></tr>
      </table>
      <div class="navrow"><button class="btn" id="exportBtn">匯出紀錄</button><button class="btn" id="pasteBtn">貼上匯入</button><button class="btn danger" id="resetAll">清除所有紀錄</button></div>
      <div class="note" style="margin-top:8px">紀錄儲存在此瀏覽器；換電腦或換瀏覽器時可用匯出／匯入搬移。</div></div></div>`;
}

/* ---------- main render ---------- */
function render(){
  document.documentElement.dataset.theme = store.theme;
  renderKpis(); renderTabs(); renderChips(); toolbarVisible();
  const v = S.view;
  if(v==="practice") renderPractice();
  else if(v==="exam") renderExam();
  else if(v==="stats") renderStats();
  else renderList(v);
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("button,[data-peek]");
  if(!t) return;
  const ds = t.dataset;
  if(ds.tab){ if(S.view==="exam" && EX && !EX.done && ds.tab!=="exam"){ toast("測驗進度已保留，可回到「模擬測驗」繼續"); } S.view=ds.tab; listLimit=LIST_PAGE; render(); window.scrollTo({top:0}); return; }
  if(ds.cat){ S.cat=ds.cat; listLimit=LIST_PAGE; render(); return; }
  if(t.parentElement && t.parentElement.id==="langSeg"){ store.lang=ds.v; persist(); render(); return; }
  if(ds.fav){ const n=+ds.fav; if(store.fav[n]) delete store.fav[n]; else store.fav[n]=1; persist(); toast(store.fav[n]?"已加入收藏":"已取消收藏"); render(); return; }
  if(ds.unwrong){ delete store.wrong[+ds.unwrong]; persist(); toast("已移出錯題本"); render(); return; }
  if(ds.src){ pSrc=ds.src; render(); return; }
  if(ds.opt!==undefined){ practiceAnswer(+ds.opt); return; }
  if(ds.jump!==undefined){ S.pIdx=+ds.jump; render(); return; }
  if(ds.exsrc){ exCfg.src=ds.exsrc; render(); return; }
  if(ds.excount){ exCfg.count=+ds.excount; render(); return; }
  if(ds.exmin!==undefined){ exCfg.minutes=+ds.exmin; render(); return; }
  if(ds.exopt!==undefined){ const n=EX.set[EX.i]; EX.ans[n]=+ds.exopt; render(); return; }
  if(ds.exjump!==undefined){ EX.i=+ds.exjump; render(); return; }
  if(ds.exf){ exFilter=ds.exf; render(); return; }
  if(ds.practice){ pSrc=ds.practice; S.view="practice"; S.pKey=""; render(); window.scrollTo({top:0}); return; }
  if(ds.exam){ exCfg.src=ds.exam; EX=null; S.view="exam"; render(); window.scrollTo({top:0}); return; }
  if(ds.goq){ pSrc="all"; S.cat="all"; S.q=""; $("#q").value=""; S.view="practice"; S.pKey=""; practicePool(); S.pIdx=S.pOrder.indexOf(+ds.goq); render(); window.scrollTo({top:0}); return; }
  if(ds.peek){ const d=BY[+ds.peek]; const card=$("#it"+d.n); card.querySelectorAll(".mini div")[d.a].classList.add("right"); card.querySelector(".peek").innerHTML=explBlock(d); t.remove(); return; }
  switch(t.id){
    case "prevBtn": if(S.pIdx>0){S.pIdx--;render();} break;
    case "nextBtn": if(S.pIdx<S.pOrder.length-1){S.pIdx++;render();window.scrollTo({top:0,behavior:"smooth"});} break;
    case "redoBtn": delete S.pAns[S.pOrder[S.pIdx]]; render(); break;
    case "showBtn": { const d=BY[S.pOrder[S.pIdx]]; S.pAns[d.n]=d.a; render(); } break;
    case "resetRound": S.pAns={}; S.pIdx=0; if(store.shuffle) S.pOrder=shuffleArr(S.pOrder); render(); break;
    case "shufBtn": store.shuffle=!store.shuffle; persist(); render(); break;
    case "autoBtn": store.autoNext=!store.autoNext; persist(); render(); break;
    case "themeBtn": store.theme=store.theme==="dark"?"light":"dark"; persist(); render(); break;
    case "startExam": startExam(); break;
    case "exPrev": if(EX.i>0){EX.i--;render();} break;
    case "exNext": if(EX.i<EX.set.length-1){EX.i++;render();window.scrollTo({top:0,behavior:"smooth"});} break;
    case "flagBtn": { const n=EX.set[EX.i]; EX.flags[n]=!EX.flags[n]; render(); } break;
    case "exSubmit": case "exSubmit2": submitExam(false); break;
    case "exQuit": ask("確定放棄本次測驗？作答不會被記錄。", ()=>{ clearInterval(startExam._t); EX=null; render(); }); break;
    case "newExam": EX=null; render(); break;
    case "goWrong": S.view="wrong"; render(); window.scrollTo({top:0}); break;
    case "revBtn": S.reveal=!S.reveal; render(); break;
    case "moreBtn": listLimit+=LIST_PAGE; render(); break;
    case "clearWrong": ask("確定清空錯題本？", ()=>{ store.wrong={}; persist(); render(); }); break;
    case "resetAll": ask("確定清除所有練習紀錄、錯題本、收藏與測驗成績？", ()=>{ store.wrong={}; store.fav={}; store.hist={}; store.exams=[]; persist(); S.pAns={}; render(); toast("已清除"); }); break;
    case "exportBtn":
      ask("複製下方文字，到另一台裝置的「貼上匯入」貼上即可搬移紀錄。", ()=>{
        const t=$("#dlgTxt"); t.select();
        try{ navigator.clipboard.writeText(t.value).then(()=>toast("已複製"),()=>toast("請手動長按複製")); }catch(e){ toast("請手動長按複製"); }
      }, {text:JSON.stringify({wrong:store.wrong,fav:store.fav,hist:store.hist,exams:store.exams}), ok:"複製", keep:true, readonly:true});
      break;
    case "pasteBtn":
      ask("把匯出的紀錄文字貼在下方：", ()=>importText($("#dlgTxt").value), {text:"", ok:"匯入"});
      break;
    case "dlgOk": { const f=DLG.fn, keep=DLG.keep; if(!keep) closeDlg(); if(f) f(); } break;
    case "dlgCancel": closeDlg(); break;
  }
});
const DLG = {fn:null, keep:false};
function ask(msg, fn, o={}){
  DLG.fn=fn; DLG.keep=!!o.keep;
  $("#dlgMsg").textContent=msg; $("#dlgOk").textContent=o.ok||"確定"; $("#dlgCancel").textContent=o.keep?"關閉":"取消";
  const t=$("#dlgTxt"); t.hidden = o.text===undefined; t.value=o.text||""; t.readOnly=!!o.readonly;
  $("#ovl").hidden=false; (t.hidden?$("#dlgOk"):t).focus();
}
function closeDlg(){ $("#ovl").hidden=true; DLG.fn=null; }
function importText(txt){
  try{ const o=JSON.parse(txt); if(!o || typeof o!=="object") throw 0; ["wrong","fav","hist","exams"].forEach(k=>{ if(o[k]) store[k]=o[k]; }); persist(); render(); toast("紀錄已匯入"); }
  catch(err){ toast("內容格式不正確"); }
}
document.addEventListener("change", e=>{
  if(e.target.id==="importIn" && e.target.files[0]){
    const r=new FileReader(); r.onload=()=>importText(r.result);
    r.readAsText(e.target.files[0]);
  }
});
let qTimer;
$("#q").addEventListener("input", e=>{ clearTimeout(qTimer); qTimer=setTimeout(()=>{ S.q=e.target.value; listLimit=LIST_PAGE; render(); }, 180); });
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA" || !$("#ovl").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const idx = "abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(k);
  if(S.view==="practice" && S.pOrder && S.pOrder.length){
    if(idx>=0){ practiceAnswer(idx); e.preventDefault(); }
    else if(k==="arrowright" && S.pIdx<S.pOrder.length-1){ S.pIdx++; render(); }
    else if(k==="arrowleft" && S.pIdx>0){ S.pIdx--; render(); }
    else if(k==="f"){ const n=S.pOrder[S.pIdx]; if(store.fav[n]) delete store.fav[n]; else store.fav[n]=1; persist(); toast(store.fav[n]?"已加入收藏":"已取消收藏"); render(); }
    else if(k==="r"){ delete S.pAns[S.pOrder[S.pIdx]]; render(); }
  } else if(S.view==="exam" && EX && !EX.done){
    if(idx>=0){ EX.ans[EX.set[EX.i]]=idx; render(); e.preventDefault(); }
    else if(k==="arrowright" && EX.i<EX.set.length-1){ EX.i++; render(); }
    else if(k==="arrowleft" && EX.i>0){ EX.i--; render(); }
    else if(k==="m"){ const n=EX.set[EX.i]; EX.flags[n]=!EX.flags[n]; render(); }
  }
});
render();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
</html>
