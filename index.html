log/cups/access_log","~/Library/Logs"],"a":0,"e":"The default directory in Mac OS X that stores security-related logs is /private/var/log. This directory is used by the system to keep various log files, which include security-related information. These logs can provide valuable insights for a Security Operations Center (SOC) analyst when monitoring and analyzing security events on Mac OS systems.","zq":"在 Mac OS X 中，下列哪一個是存放安全相關日誌的預設目錄？","zo":["/private/var/log","/Library/Logs/Sync","/var/log/cups/access_log","~/Library/Logs"],"ze":"macOS 系統日誌位於 /private/var/log（/var 為其符號連結），包含 system.log、secure 相關紀錄等。~/Library/Logs 是使用者層級應用程式日誌。"},{"n":131,"c":"hunt","q":"A SIEM alert is triggered due to unusual network traffic involving NetBIOS. The system log shows: “The TCP/IP NetBIOS Helper service entered the running state.” Concurrently, Windows Security Event ID 4624 (“An account was successfully logged on”) appears for multiple machines within a short time frame. The logon type is 3 (Network logon). Which of the following security incidents is the SIEM detecting?","o":["An attacker performing lateral movement within the network","A user connecting to shared files from multiple workstations","A network administrator conducting routine maintenance","A malware infection spreading via SMB protocol"],"a":0,"e":"The pattern described most strongly indicates lateral movement: multiple network logons (Event ID 4624, Logon Type 3) across multiple machines in a short period, combined with NetBIOS/SMB-related service activity, suggests a host-to-host authentication pattern consistent with an attacker moving through the environment. In SOC terms, Logon Type 3 reflects network-based authentication (commonly SMB, remote service access, admin shares, or remote management). When the same source account or host triggers many network logons quickly across endpoints—especially outside normal administrative patterns—it often indicates credential abuse (pass-the-hash, stolen credentials, or remote execution frameworks). While SMB-worm propagation is possible, the scenario emphasizes authentication events across multiple machines rather than explicit malware indicators or file-write propagation patterns. Routine maintenance is plausible only with strong supporting context (approved admin accounts, change windows, known tooling), which is not provided. A single user connecting to shared files typically wouldn’t generate a burst of network logons “for multiple machines” in the same way, nor would it usually coincide with suspicious NetBIOS helper state changes as an anomaly. Therefore, the best classification is attacker lateral movement within the network.","zq":"SIEM 因涉及 NetBIOS 的異常流量告警。系統日誌顯示「TCP/IP NetBIOS Helper 服務進入執行狀態」，同時多台機器在短時間內出現 Windows 事件 4624（帳號成功登入），登入類型為 3（網路登入）。SIEM 偵測到的是哪一種資安事件？","zo":["攻擊者在網路內橫向移動","使用者從多台工作站連線共用檔案","網路管理員進行例行維護","惡意程式透過 SMB 協定擴散"],"ze":"短時間內在多台主機出現登入類型 3 的網路登入，搭配 NetBIOS/SMB 活動，是憑證濫用（如 pass-the-hash）橫向移動的典型模式。例行維護需有已核准帳號與變更時段佐證；題目未提到惡意檔案寫入擴散。"},{"n":132,"c":"siem","q":"A financial institution suspects an insider threat due to unauthorized access attempts on restricted databases. However, SIEM alerts lack sufficient information to differentiate between legitimate and malicious access. The SOC manager recommends integrating contextual data to improve detection. Which contextual data source should be integrated in this scenario?","o":["User context from HR systems","Location and physical context from CPS sensors","Threat context from external threat intelligence feeds","Vulnerability context"],"a":0,"e":"User context from HR systems is the most relevant contextual source for insider-threat differentiation because it helps determine whether access aligns with the user’s role, employment status, and business need. HR context can include department, job title, manager, location assignment, employment status (active\n/terminated), and sometimes risk signals like recent role changes or offboarding timelines. For restricted database access, the key questions are “should this person have access?” and “is this behavior normal for their role?” Threat intelligence feeds primarily help with external adversaries (malicious IPs, domains, known actor infrastructure) and are less useful for insiders who operate from legitimate networks and accounts. Vulnerability context is useful for exposure management and exploit prioritization, but it doesn’t explain whether a particular employee’s access attempt is legitimate. Physical/CPS sensor context can be valuable in some environments (badge access vs. login), but the most broadly applicable and directly relevant enrichment for insider cases is HR-based identity context. In SOC operations, combining HR context with identity logs and data access telemetry improves detection logic (for example, flagging restricted access attempts by users outside the relevant business unit or after termination) and reduces false positives from legitimate administrative activity.","zq":"金融機構因受限資料庫出現未授權存取嘗試而懷疑有內部威脅，但 SIEM 告警資訊不足以區分合法與惡意存取。SOC 主管建議整合情境資料以改善偵測。應整合哪一種情境資料來源？","zo":["來自人資系統的使用者情境","來自 CPS 感測器的位置與實體情境","來自外部威脅情資的威脅情境","弱點情境"],"ze":"人資資料（部門、職稱、主管、在職／離職狀態、職務異動）能判斷「此人是否應有存取權、行為是否符合職務」，是區分內部威脅最直接的情境。外部情資適用外部攻擊者；弱點情境用於曝險管理。"},{"n":133,"c":"siem","q":"Global Solutions Inc. uses syslog for centralized logging across a geographically diverse network. The SOC team must ensure logs are reliably delivered from remote sites to the central logging server across potentially unreliable network connections. To guarantee consistent and dependable log delivery, which syslog architectural layer should they focus on optimizing and hardening?","o":["Syslog application layer","Syslog management and filtering","Syslog content layer","Syslog transport layer"],"a":3,"e":"Reliable delivery across unreliable networks is primarily a transport-layer concern. The syslog transport layer covers how messages are transmitted between devices, relays, and collectors, including protocol choice and delivery assurance. Many syslog deployments default to UDP for simplicity, but UDP is lossy and does not guarantee delivery—problematic for remote sites and compliance-driven logging. Hardening transport typically involves using TCP (reliable delivery), TLS for encryption and integrity, buffering/queueing at relays, retransmission handling, and monitoring of connection health and backlog. The content layer is about message format and fields; management and filtering is about routing and reduction of noise; application layer relates to the syslog-generating and receiving software. Those are important, but they do not address the fundamental need for dependable delivery under network instability. From a SOC perspective, transport reliability directly impacts forensic completeness, alert accuracy, and compliance evidence. Therefore, optimizing and hardening the syslog transport layer is the correct priority.","zq":"Global Solutions 以 syslog 在分散的網路中集中收集日誌，SOC 必須確保日誌在可能不穩定的網路連線下仍能可靠地從遠端據點送達中央伺服器。應著重最佳化與強化 syslog 架構的哪一層？","zo":["Syslog 應用層","Syslog 管理與過濾","Syslog 內容層","Syslog 傳輸層"],"ze":"可靠傳遞是傳輸層議題：以 TCP 取代易遺失的 UDP、以 TLS 加密、在中繼端做緩衝佇列與重傳。內容層關乎訊息格式；管理過濾關乎路由與降噪。"},{"n":134,"c":"web","q":"Rinni, SOC analyst, while monitoring IDS logs detected events shown in the figure below.\nWhat does this event log indicate?","o":["Directory Traversal Attack","XSS Attack","SQL Injection Attack","Parameter Tampering Attack"],"a":3,"e":"The event log indicates a ParameterTampering Attack. This type of attack involves the manipulation of parameters exchanged between the client and the server to alter application data, such as user credentials and permissions, product price and quantity, etc. The IDS log entries showing repeated access to the URL “\n/OrderDetail.aspx?id=ORDR-001117” with varying order ID values suggest that the attacker is manipulating the ‘id’ parameter to potentially access or modify order details unauthorizedly.","zq":"SOC 分析師 Rinni 監控 IDS 日誌時發現如下圖事件（原題附圖：反覆存取 /OrderDetail.aspx?id=ORDR-001117 等，且 id 參數值不斷變動）。此事件代表什麼？","zo":["目錄穿越攻擊","XSS 攻擊","SQL 注入攻擊","參數竄改攻擊"],"ze":"反覆修改 URL 中的訂單 id 參數以存取他人資料，屬於參數竄改（也類似 IDOR 不安全直接物件參考）。防禦需在伺服器端驗證授權。（此 PDF 文字版未含原圖）"},{"n":135,"c":"log","q":"What does the Security Log Event ID 4624 of Windows 10 indicate?","o":["Service added to the endpoint","A share was assessed","An account was successfully logged on","New process executed"],"a":2,"e":"The Security Log Event ID 4624 in Windows 10 indicates that an account was successfully logged on. This event is generated when a logon session is created, which could be due to a user logging on to the system, a service starting, or a scheduled task running. It is a critical event for security monitoring as it can help in identifying unauthorized access to the system.","zq":"Windows 10 安全性日誌事件 ID 4624 代表什麼？","zo":["端點新增了服務","存取了共用資料夾","帳號成功登入","執行了新行程"],"ze":"4624 = 帳號成功登入，搭配 Logon Type（2 互動、3 網路、10 遠端桌面等）分析。對照：4625 登入失敗、7045 新服務、5140 共用存取、4688 新行程。"},{"n":136,"c":"ir","q":"Bonney's system has been compromised by a gruesome malware.\nWhat is the primary step that is advisable to Bonney in order to contain the malware incident fromspreading?","o":["Complaint to police in a formal way regarding the incident","Turn off the infected machine","Leave it to the network administrators to handle","Call the legal department in the organization and inform about the incident"],"a":1,"e":"Theprimary step in containing a malware incident is to isolate the infected machine to prevent the malware from spreading to other systems. This can be done by disconnecting it from the network and turning it off. This action helps to contain the incident and allows for a proper investigation without the risk of further infection or data loss.","zq":"Bonney 的系統遭到嚴重惡意程式入侵。為防止惡意程式擴散，建議 Bonney 採取的首要步驟是？","zo":["正式向警方報案","關閉受感染的機器","交給網路管理員處理","通知公司法務部門"],"ze":"首要是隔離受感染主機以阻止擴散（題庫答案為關機）。實務上更建議先中斷網路而非直接關機，以保留記憶體中的揮發性證據；但考試請選「關閉受感染機器」。"},{"n":137,"c":"ir","q":"A leading e-commerce company relies on backend servers for processing customer transactions. You are working with their cybersecurity team as a SOC analyst. One morning, you notice a sharp increase in CPU utilization on one of your backend servers. Your team scans and monitors the server and finds that an unknown process is running, consuming excessive resources. You further perform detailed forensic analysis and identify the presence of an unrecognized scheduled task that triggers a PowerShell script connecting to an unknown IP address. What should you do to confirm whether this is an active attack?","o":["Analyze the network logs to identify external connections","Check file integrity and detect recent unauthorized changes","Analyze the system logs for unauthorized changes","Review user access logs for unauthorized activity"],"a":0,"e":"The strongest “must-be-true” confirmation for an active attack in this scenario is evidence of command-and-control (C2) or other suspicious external communication. You already have a scheduled task launching PowerShell and attempting to connect to an unknown IP address, which is a high-signal indicator of malicious automation. The fastest way to validate ongoing activity is to analyze network telemetry (firewall/proxy logs, netflow, EDR network events) to confirm whether outbound connections are occurring, how frequently, and whether data is being transferred. Network logs can reveal destination IP/port, protocols, connection success\n/failure, volume, and timing correlation with the scheduled task triggers. File integrity checks and system logs are useful for understanding persistence and modifications, but they may lag behind or miss short-lived network beacons. User access logs help attribute activity but do not directly confirm an active external control channel. From a SOC triage and containment perspective, confirming external connections enables immediate actions such as blocking the destination, isolating the host, and scoping for other systems contacting the same IPs/domains. Therefore, network log analysis is the most direct next step to confirm active malicious behavior.","zq":"電商公司某後端伺服器 CPU 使用率驟升，掃描發現未知行程大量耗用資源；鑑識發現一個未知排程工作會觸發 PowerShell 腳本連線到未知 IP。要確認是否為進行中的攻擊，應該怎麼做？","zo":["分析網路日誌以找出對外連線","檢查檔案完整性、偵測近期未授權變更","分析系統日誌中的未授權變更","檢視使用者存取日誌中的未授權活動"],"ze":"確認「進行中」攻擊最直接的證據是是否有對外 C2 連線。分析防火牆、Proxy、流量與 EDR 網路事件，可確認連線頻率、傳輸量與排程觸發時間是否吻合，並據以封鎖與擴大清查。"},{"n":138,"c":"net","q":"Identify the attack, where an attacker tries to discover all the possible information about a target network before launching a further attack.","o":["DoS Attack","Man-In-Middle Attack","Ransomware Attack","Reconnaissance Attack"],"a":3,"e":"A Reconnaissance Attack is a type of cyber attack where theattacker engages in activities to gather information about a target network before launching further attacks. This preliminary phase involves collecting data that could include network infrastructure details, system vulnerabilities, and other critical information that could be exploited in subsequent stages of an attack. Reconnaissance can be both passive, involving information gathering without directly interacting with the target system, or active, which may include more direct methods like port scanning.","zq":"攻擊者在發動進一步攻擊前，嘗試找出目標網路的所有可能資訊，這是哪一種攻擊？","zo":["DoS 攻擊","中間人攻擊","勒索軟體攻擊","偵察攻擊（Reconnaissance）"],"ze":"偵察是攻擊的第一階段，蒐集網路架構、系統、弱點等資訊，可分被動（OSINT、WHOIS）與主動（埠掃描、指紋辨識）。"},{"n":139,"c":"cti","q":"The threat intelligence, which will help you, understand adversary intent and make informed decision to ensure appropriate security in alignment with risk.\nWhat kind of threat intelligence described above?","o":["Tactical Threat Intelligence","Strategic Threat Intelligence","Functional Threat Intelligence","Operational Threat Intelligence"],"a":1,"e":"The type of threat intelligence that helps in understanding adversary intent and making informed decisions to ensure appropriate security in alignment with risk is known as Strategic Threat Intelligence. This form of intelligence is concerned with the broader goals and motivations of threat actors, as well as the long-term trends and implications of their activities. It provides insights into the cyber threat landscape and helps organizations shape their security strategy and policies to mitigate risks.\nStrategic Threat Intelligence is used to inform decision-makers about the nature of threats, the potential impact on the organization, and the necessary steps to align security measures with business objectives. It is less technical than Tactical or Operational Threat Intelligence and does not focus on the specific details of attacks or the technical indicators of compromise. Instead, it provides a high-level view of the threats and their relevance to the organization’s risk management.","zq":"能幫助你了解攻擊者意圖，並做出與風險一致之安全決策的威脅情報，屬於哪一種？","zo":["戰術型威脅情報","策略型威脅情報","功能型威脅情報","營運型威脅情報"],"ze":"策略型情報提供攻擊者動機、長期趨勢與對組織的影響，協助高層依風險制定安全策略與政策，技術細節較少。"},{"n":140,"c":"ir","q":"A multinational financial institution notices unusual network activity during a routine security audit. The SOC detects multiple failed login attempts, followed by a successful access attempt using an administrator's credentials from an unrecognized IP address. Shortly after, sensitive customer records are accessed without authorization. The company suspects a breach and calls in the forensic investigation team. During evidence collection, the forensic team creates a detailed record that tracks every individual who handled the evidence, its storage location, and timestamps of transfers. What is this process called?","o":["Chain of Custody","Incident Documentation","Data Imaging","Digital Fingerprinting"],"a":0,"e":"Chain of custody is the formal process used to document and preserve evidence integrity by recording who collected the evidence, who accessed it, where it was stored, and when it changed hands. In SOC and forensic operations, chain of custody is essential for maintaining evidentiary reliability, especially in cases with regulatory, legal, or disciplinary implications. It ensures that evidence has not been altered, tampered with, or mishandled, and it supports defensible conclusions about what occurred. Incident documentation is broader and includes timelines, decisions, actions taken, and communications, but it does not specifically track evidence handling transfers. Data imaging is the creation of a forensic copy of storage media (disk image), a separate technical step that may be recorded within chain-of-custody logs. Digital fingerprinting refers to generating hashes or other identifiers to confirm file integrity; again, it is a technique used within evidence handling, but the tracking record of handlers, locations, and transfers is chain of custody. For SOC analysts, correctly maintaining chain of custody is critical when responding to breaches involving sensitive customer records and potential compliance investigations.","zq":"某跨國金融機構發現多次登入失敗後，有人以管理員憑證從陌生 IP 成功登入並存取客戶紀錄。鑑識團隊在蒐集證據時，建立一份詳細紀錄，追蹤每位經手證據的人、存放位置與移轉時間。這個過程稱為？","zo":["監管鏈（Chain of Custody）","事件文件化","資料映像","數位指紋"],"ze":"監管鏈記錄證據的蒐集者、經手人、存放地點與每次移轉時間，確保證據未被竄改，具法律效力。資料映像與雜湊（數位指紋）是證據處理中的技術步驟。"},{"n":141,"c":"siem","q":"A rapidly growing e-commerce company wants to implement a SIEM solution to improve its security posture and comply with PCI DSS requirements. They need a solution that offers both the necessary technological features and the expertise to manage the system effectively. They also need continuous compliance support and data security assistance. Which SIEM solution is appropriate for this company?","o":["Cloud-based SIEM","In-house SIEM","Managed SIEM","Security analytics"],"a":2,"e":"A managed SIEM provides both the technology platform and the operational expertise to run it effectively, which aligns with the company’s need for features plus ongoing management, compliance support, and security assistance. Rapidly growing organizations often struggle to staff SIEM engineering, content tuning, and 24/7 monitoring internally. Managed SIEM offerings typically include onboarding data sources, maintaining parsers, tuning detections, handling alert triage, producing compliance reports, and advising on remediation—capabilities that directly support PCI DSS requirements and continuous audit readiness. A cloud-based SIEM is a deployment model and can be part of the answer, but it does not guarantee expert management or compliance support unless paired with a managed service. An in-house SIEM requires building and maintaining internal expertise, which conflicts with the stated need for external expertise and continuous support. “Security analytics” is a capability category, not a full SIEM solution model. From a SOC operations standpoint, managed SIEM reduces time-to-value, improves alert quality through professional tuning, and provides consistent reporting and operational coverage without needing the company to immediately build a mature internal SOC function.","zq":"一家快速成長的電商公司想導入 SIEM 改善資安並符合 PCI DSS，需要同時具備技術功能與管理系統的專業，也需要持續的合規支援與資料安全協助。哪一種 SIEM 方案合適？","zo":["雲端 SIEM","自建 SIEM","託管式 SIEM（Managed SIEM）","安全分析"],"ze":"託管式 SIEM 同時提供平台與營運專業：資料源導入、規則調校、告警分級、合規報表，適合缺乏內部專業又需持續合規支援的組織。雲端只是部署模式；自建需自有專業。"},{"n":142,"c":"log","q":"You are working as a SOC analyst for a cloud-based service provider that relies on PostgreSQL databases to store critical customer data. During a security review, you discover that logs are not being generated for failed authentication attempts, slow queries, or database errors. This lack of visibility is making it difficult to detect threats and investigate suspicious activity. To ensure PostgreSQL captures and stores logs for centralized monitoring and forensic analysis, which configuration parameter should you enable?","o":["logging-collector","log_collector","loggingcollector","logging-collector (with space)"],"a":1,"e":"In PostgreSQL, the configuration parameter that enables writing logs to files via the logging collector process islog_collector. When enabled, PostgreSQL can collect stderr output from backend processes and route it into log files, which is foundational for centralized log shipping and retention. From a SOC standpoint, turning on log collection is necessary but not sufficient: you typically also need to configure what gets logged (authentication failures, statement duration thresholds for slow queries, and error verbosity), define log line prefixes for consistent parsing, and set rotation/retention to meet operational and compliance needs. However, the question specifically asks which parameter should be enabled to ensure PostgreSQL captures and stores logs, and log_collector is the correct parameter name and casing. The other options include incorrect naming or formatting. Once enabled, the SOC team can forward PostgreSQL logs to the SIEM to correlate database activity with identity, endpoint, and network signals—critical for detecting brute force attempts, suspicious administrative actions, and anomalous query behavior.","zq":"你在一家以 PostgreSQL 存放客戶資料的雲端服務商擔任 SOC 分析師，發現驗證失敗、慢查詢與資料庫錯誤都沒有被記錄，難以偵測威脅。要讓 PostgreSQL 擷取並儲存日誌以供集中監控與鑑識，應啟用哪個設定參數？","zo":["logging-collector","log_collector","loggingcollector","logging-collector（含空格）"],"ze":"題庫答案為 log_collector。注意：PostgreSQL 實際參數名稱為 logging_collector = on（postgresql.conf），啟用後將 stderr 輸出寫入日誌檔；另需搭配 log_connections、log_min_duration_statement、log_line_prefix 等設定。考試請依題庫選 B。"},{"n":143,"c":"cloud","q":"A large financial institution receives thousands of security logs daily from firewalls, IDS systems, and user authentication platforms. The SOC uses an AI-driven SIEM system with Natural Language Processing (NLP) capabilities to streamline threat detection. This enables faster response times, reduces manual rule creation, and helps detect advanced threats that traditional systems might overlook. Which option best illustrates the advantage of NLP in SIEM?","o":["Eliminates the need for data normalization and correlation in SIEM systems","Allows security analysts to write SIEM rules using complex programming languages","Simplifies infrastructure management by reducing hardware dependencies","Enables analysis of text-based data from logs and communications to detect threats"],"a":3,"e":"NLP excels at interpreting and extracting meaning from human-readable, text-heavy sources—exactly the kind of data often found in logs, alerts, ticket notes, email content, and incident narratives. In SIEM contexts, NLP can help classify alerts, cluster similar events, summarize incident context, extract entities (usernames, hosts, IPs) from free-form text, and identify suspicious language or patterns in communications (for example, phishing email content). This can reduce manual triage work by automatically enriching and organizing noisy textual data. NLP does not eliminate the need for normalization or correlation; those are core SIEM functions for structured event linking. NLP also does not require analysts to write rules in complex programming languages; it often reduces that burden by improving parsing and interpretation. Hardware dependency reduction is unrelated. Therefore, the best advantage statement is that NLP enables analysis of text-based data from logs and communications to detect threats and improve triage, which supports faster response and better detection for complex or subtle attacks.","zq":"大型金融機構每天收到大量防火牆、IDS 與驗證平台日誌，SOC 使用具自然語言處理（NLP）能力的 AI 驅動 SIEM，加快回應、減少人工撰寫規則，並偵測傳統系統可能忽略的進階威脅。哪一項最能說明 NLP 在 SIEM 中的優勢？","zo":["免除 SIEM 資料正規化與關聯的需求","讓分析師能用複雜程式語言撰寫 SIEM 規則","減少硬體相依以簡化基礎架構管理","能分析日誌與通訊中的文字資料以偵測威脅"],"ze":"NLP 擅長解讀文字：從日誌、工單、郵件內容中擷取實體、分類與摘要告警、辨識網釣語句。它不會取代正規化與關聯，也與硬體無關。"},{"n":144,"c":"ir","q":"At a large healthcare organization, the Security Operations Center (SOC) detects a surge of failed login attempts on employee accounts, indicating a possible brute-force attack. To contain the threat, the team quickly takes action to prevent unauthorized access. However, they also need to implement a security measure that strengthens account protection beyond just stopping the current attack, reducing the risk of similar incidents in the future. During the Containment Phase, which action would best enhance long-term account security against brute-force attacks?","o":["Notify affected users","Block IP addresses and enforce account lockout policies","Cross-verify false positives","Enable multi-factor authentication (MFA)"],"a":3,"e":"MFA is the most effective long-term control among the options because it directly reduces the attacker’s ability to succeed even when passwords are guessed, reused, or stolen. Brute-force and credential stuffing attacks exploit the single-factor nature of passwords; MFA adds an additional verification factor (authenticator app prompt, FIDO2 key, certificate-based auth), making account takeover significantly harder. From a containment standpoint, blocking IPs and enabling lockout can reduce immediate attack volume, but attackers commonly rotate IPs, use botnets, or target many accounts in parallel, which can also cause operational impact via account lockouts (denial of service against users). Cross-verifying false positives is important for accuracy, but it does not strengthen security. Notifying users can help awareness but is not a technical control. In SOC operations, the best practice is layered containment: immediate throttling/blocks and lockout tuning for the active attack, followed by durable hardening controls. MFA is the durable hardening step that meaningfully reduces future brute-force success rates and complements conditional access policies (geo/time/device risk) and stronger password protections.","zq":"大型醫療機構 SOC 偵測到員工帳號大量登入失敗，疑似暴力破解。團隊迅速阻止未授權存取，但也需要一項能強化帳號保護、降低未來類似事件風險的措施。在圍堵階段，哪一項行動最能長期強化帳號對暴力破解的防護？","zo":["通知受影響使用者","封鎖 IP 並實施帳號鎖定政策","交叉驗證誤報","啟用多因素驗證（MFA）"],"ze":"MFA 讓攻擊者即使猜中或竊得密碼也無法登入，是對抗暴力破解與撞庫最有效的長期控制。封鎖 IP 與鎖定只能短期緩解（攻擊者會輪換 IP，鎖定也可能被濫用造成使用者被 DoS）。"},{"n":145,"c":"siem","q":"Which of the log storage method arranges event logs in the form of a circularbuffer?","o":["FIFO","LIFO","non-wrapping","wrapping"],"a":3,"e":"In the context of log storage, a circular buffer is a data structure that uses a single, fixed-size buffer as if it were connected end-to-end. This structure lends itself to bufferingstreams of data, where the data is written to the buffer and read from it in a potentially non-sequential manner. When the buffer is full, new data is written starting at the beginning of the buffer, and thus ‘wraps’ around. This is why the method is referred to as ‘wrapping’. FIFO (First In, First Out) and LIFO (Last In, First Out) are queueing methods, and non-wrapping implies that the buffer does not overwrite existing data when full.","zq":"哪一種日誌儲存方式會以環形緩衝區（circular buffer）方式存放事件日誌？","zo":["FIFO","LIFO","非循環（non-wrapping）","循環覆寫（wrapping）"],"ze":"Wrapping：緩衝區滿了之後從頭覆寫最舊的紀錄，就像首尾相連的環。Non-wrapping 滿了就停止寫入或需人工清除。"},{"n":146,"c":"hunt","q":"A SOC analyst monitoring authentication logs detects a sudden and significant spike in failed login attempts targeting multiple critical servers during non-business hours. These repeated authentication failures are abnormal compared to typical login activity. All attempts originate from a single external IP address, indicating a targeted attack rather than random scanning. Some login attempts use legitimate employee usernames, suggesting credential stuffing using previously compromised credentials or an ongoing brute-force attempt. Given this suspicious activity and its potential to escalate into unauthorized access, what is the appropriate next step in the threat-hunting process to assess the situation further?","o":["Rapid response","Continuous improvement","Establish a baseline","Investigate and analyze"],"a":3,"e":"The analyst has already identified a clear anomaly (spike in failures), attributes (single external IP), and potential attack type (credential stuffing/brute force). At this point, the correct next step is to investigate and analyze: validate the activity, confirm scope, and determine whether any attempts succeeded or led to additional malicious actions. In practical SOC threat hunting, this means pivoting from the initial observation to structured analysis: check for successful logons from the same source, identify targeted accounts and servers, correlate with geo/location anomalies, review authentication methods, and look for follow-on behaviors like privilege escalation, token issuance, or suspicious process execution on targeted hosts. “Establish a baseline” is a step used earlier when normal patterns are unknown; here the activity is already recognized as abnormal. “Continuous improvement” is a post-activity maturity step (tuning detections, updating playbooks). “Rapid response” can be part of containment if compromise is confirmed or imminent, but the question asks specifically for the next step in threat hunting to assess further. Therefore, investigation and analysis is the best fit, enabling informed containment actions such as IP blocks, account lockouts, MFA enforcement, and credential resets based on evidence.","zq":"SOC 分析師發現非上班時段多台關鍵伺服器的登入失敗暴增，全部來自單一外部 IP，部分使用合法員工帳號名稱，疑似撞庫或暴力破解。在威脅獵捕流程中，下一步應該做什麼以進一步評估狀況？","zo":["快速回應","持續改善","建立基準","調查與分析"],"ze":"異常已被辨識（已知偏離基準），下一步是調查分析：是否有成功登入、哪些帳號與主機受影響、是否出現提權或後續行為，再據此決定圍堵措施。持續改善屬事後；建立基準是更早的步驟。"},{"n":147,"c":"siem","q":"A manufacturing company is deploying a SIEM system and uses an output-driven approach, starting with use cases addressing unauthorized access to production control systems. They configure data sources and alerts to ensure actionable alerts with low false positives, then expand to supply chain disruptions and malware detection. What is the primary advantage of an output-driven approach?","o":["The company can collect logs from non-critical systems.","The company can create more complex use cases with greater scope.","The SOC team can respond to all incidents in real time without delays.","The SIEM system can automatically block all unauthorized access attempts."],"a":1,"e":"An output-driven SIEM deployment builds capability by starting with a narrowly defined, high-value detection outcome and then expanding once success is proven. The primary advantage is that it supports iterative growth into broader and more complex use cases with confidence. Each validated use case forces disciplined work on prerequisites: correct data onboarding, parsing, field normalization, baseline understanding, and tuning to reduce false positives. That foundation enables more advanced scenarios that require richer correlation (for example, linking identity events, network telemetry, endpoint behavior, and application logs) and often cover longer timelines or more complex workflows, such as supply chain disruption detection. Option A is not an advantage; collecting logs from non-critical systems may or may not be required depending on use cases. Option C is unrealistic because response speed depends on staffing and workflows, not only SIEM deployment strategy. Option D implies active prevention, which is not the SIEM’s core role (it can trigger automation, but blocking is not automatic by default). Therefore, the best advantage among the given options is enabling creation and expansion to more complex use cases with wider scope.","zq":"某製造公司部署 SIEM 採輸出導向方法，先以生產控制系統未授權存取的使用案例起步，確保告警可行動、誤報低，再擴展到供應鏈中斷與惡意程式偵測。輸出導向方法的主要優點是什麼？","zo":["公司可以收集非關鍵系統的日誌","公司能建立範圍更大、更複雜的使用案例","SOC 能即時回應所有事件毫無延遲","SIEM 可自動阻擋所有未授權存取"],"ze":"與第 108 題相同概念：逐一驗證使用案例、累積資料品質與調校經驗，使組織能逐步擴展到需要多來源關聯的複雜使用案例。"},{"n":148,"c":"net","q":"Which of the following attack inundates DHCP servers with fake DHCP requests toexhaust all available IP addresses?","o":["DHCP Starvation Attacks","DHCP Spoofing Attack","DHCP Port Stealing","DHCP Cache Poisoning"],"a":0,"e":"A DHCP Starvation Attack is a type of network attack that aims to deplete the pool of available IP addresses on the DHCP server. The attacker floods the DHCP server with fake DHCP DISCOVER messages using spoofed MAC addresses. If successful, the server will exhaust its address space, denying IP configuration to legitimate clients. This can lead to a denial of service (DoS) for new devices attempting to join the network. Additionally, the attacker may set up a rogue DHCP server to issue malicious IP configurations to clients, potentially redirecting traffic or causing further disruption1.","zq":"哪一種攻擊以大量偽造的 DHCP 請求淹沒 DHCP 伺服器，耗盡所有可用 IP 位址？","zo":["DHCP 耗盡攻擊（Starvation）","DHCP 偽冒攻擊（Spoofing）","DHCP 埠竊取","DHCP 快取汙染"],"ze":"DHCP Starvation 以偽造 MAC 大量發送 DHCP DISCOVER，耗盡位址池使合法用戶取不到 IP；攻擊者常接著架設惡意 DHCP 伺服器（Spoofing）進行中間人攻擊。防禦：交換器 Port Security、DHCP Snooping。"},{"n":149,"c":"hunt","q":"You are a Threat Hunter in an IT company’s security team working to enhance threat hunting capabilities. You observed that relying solely on traditional security alerts often results in missed detections of sophisticated threats. To strengthen your approach, you decide to incorporate multiple data sources, including external threat intelligence feeds, internal security logs, network traffic data, and endpoint telemetry. To efficiently process this vast amount of data, you implement a new tool that can aggregate, normalize, and correlate threat intelligence with internal telemetry to gain a more holistic understanding of emerging threats and enhance detection accuracy. What key threat detection capability is being leveraged in this scenario?","o":["Threat Reports","Intelligence Buy-In","Threat Trending","Data Integration"],"a":3,"e":"This scenario is centered on combining multiple heterogeneous data sources into a single analytical view so that signals can be correlated into higher-confidence detections. That is the core of data integration: ingesting external intelligence (malicious IPs/domains/hashes/TTPs) and internal telemetry (endpoint events, authentication, network flows, DNS, proxy, cloud logs), then normalizing and correlating them to detect activity that would be missed if each source were analyzed in isolation. In threat hunting, integration enables pivoting and validation: an external indicator becomes meaningful when matched to internal events, and internal anomalies become higher priority when they align with known adversary behaviors. “Threat reports” are outputs, not the underlying capability. “Intelligence buy-in” is governance and stakeholder support, not a technical detection capability. “Threat trending” focuses on patterns over time (frequency, prevalence), which can inform strategy but does not directly describe the aggregation/normalization/correlation capability emphasized here. For SOC analysts, data integration is what allows efficient triage and hunting at scale, reduces blind spots, and improves detection fidelity by cross-validating evidence across endpoints, identity, network, and external intelligence.","zq":"身為威脅獵人，你發現只依賴傳統告警會漏掉精密威脅，於是納入外部情資、內部安全日誌、網路流量與端點遙測，並導入一套工具來彙整、正規化並將威脅情資與內部遙測關聯，以更全面地了解新興威脅並提升偵測準確度。這運用了哪一項關鍵偵測能力？","zo":["威脅報告","情資支持（Buy-In）","威脅趨勢","資料整合"],"ze":"把多種異質資料來源彙整、正規化並關聯成單一分析視角，就是資料整合。外部指標在與內部事件比對後才有意義，內部異常也能因符合已知 TTP 而提升優先度。"},{"n":150,"c":"ir","q":"A mid-sized hospital's SOC team has recently detected multiple malware incidents that disrupted access to patient records and caused operational inefficiencies. The SOC analysts have been tasked with eradicating current infections and preventing future attacks by addressing the underlying vulnerabilities that allowed the malware to breach defenses. As a SOC analyst, you need to recommend a step that directly targets weaknesses in the hospital’s network infrastructure or system configurations exploited by the malware. Which eradication step would best address these root causes?","o":["Fixing devices","Using antivirus tools for quarantine","Updating the malware database with vendor signatures","Implementing blacklist techniques for file execution"],"a":0,"e":"Eradication is about removing the threat and eliminating the conditions that allowed it to persist or recur. “Fixing devices” best aligns with addressing root causes because it implies remediating exploited weaknesses: patching vulnerable software, correcting misconfigurations, removing persistence mechanisms, hardening endpoints/servers, and restoring secure baselines. In healthcare environments, malware frequently exploits unpatched systems, exposed services, weak segmentation, permissive scripting policies, or inadequate least privilege. Quarantining with antivirus is helpful for immediate removal but may not eliminate the exploited vulnerability or persistence path; attackers can reinfect if the underlying gap remains. Updating signatures improves detection for known malware but does not address a misconfiguration or missing patch and will not reliably stop novel variants. Blacklisting file execution can reduce risk but is typically a partial, reactive control and can be bypassed by renaming, living-off-the-land tools, or script-based payloads. From a SOC analyst perspective, the most durable eradication action is to “fix the device” by restoring trusted configuration and closing the exploit vector, combined with validation scans and monitoring to confirm the environment is clean and hardened.","zq":"中型醫院 SOC 偵測到多起惡意程式事件，影響病歷存取與營運效率。SOC 需根除現有感染並處理讓惡意程式得以入侵的根本弱點。應建議哪一個直接針對被利用之網路基礎架構或系統設定弱點的根除步驟？","zo":["修復裝置（Fixing devices）","使用防毒工具隔離","以廠商特徵碼更新惡意程式資料庫","實施檔案執行黑名單"],"ze":"修復裝置包括修補漏洞、修正錯誤設定、移除持久化、恢復安全基準，直接消除根因。隔離與更新特徵碼只處理已知惡意程式；黑名單容易被繞過。"},{"n":151,"c":"siem","q":"Jannet works in a multinational corporation that operates multiple data centers, cloud environments, and on\u0002premises systems. As a SOC analyst, she notices that security incidents are taking too long to detect and investigate. After analyzing this, she discovers that logs from firewalls, endpoint security solutions, authentication servers, and cloud applications are scattered across different systems in various formats. Her team has to manually convert logs into a readable format before investigating incidents. What approach should she implement to accept logs from heterogeneous sources with different formats, convert them into a common format, and improve incident detection and response time?","o":["Log transformation","Log normalization","Log correlation","Log collection"],"a":1,"e":"Log normalization is the key step that converts heterogeneous logs into a consistent, common schema so analysts and detections can reliably query and correlate events. In real SOC workflows, different sources use different field names, timestamp formats, severity labels, and value conventions (for example, “src_ip” vs “SourceIP,” “user” vs “AccountName”). Normalization standardizes these into consistent fields (time, host, user, source/destination, action, outcome), enabling rule logic and dashboards to work across vendors without constant manual translation. Log collection is simply getting logs into a central place; it does not guarantee they are usable or consistent. Log transformation is a broader term that can include parsing or enrichment, but normalization is the specific practice of mapping diverse formats into a common model. Log correlation comes after normalization; correlation links related events (e.g., failed logons + suspicious process + outbound beaconing) and depends on normalized data to work well. Since the problem is explicitly “multiple formats” and manual conversion delays investigation, the best solution is normalization to accelerate triage, reduce query complexity, and improve detection fidelity.","zq":"Jannet 在擁有多座資料中心、雲端與地端系統的跨國企業擔任 SOC 分析師，她發現事件偵測與調查耗時過長，原因是防火牆、端點、驗證伺服器與雲端應用的日誌分散在不同系統、格式各異，團隊必須手動轉換格式才能調查。她應實施哪一種方法，接收不同格式的異質日誌並轉換成共同格式？","zo":["日誌轉換","日誌正規化","日誌關聯","日誌收集"],"ze":"正規化把不同廠商的欄位（src_ip vs SourceIP、user vs AccountName）、時間格式與嚴重度對應到統一結構，讓查詢與規則跨來源通用。收集只是集中；關聯需以正規化為前提。"},{"n":152,"c":"ir","q":"Which of the following is a report writing tool that will help incident handlers to generate efficientreports on detected incidents during incident response process?","o":["threat_note","MagicTree","IntelMQ","Malstrom"],"a":1,"e":"MagicTree is a data management tool designed for penetration testers, incident handlers, and IT security professionals. It is particularly useful for handling the voluminous data typically generated during a security assessment or incident response process. MagicTree allows users to import and aggregate data from various sources, organize it in a structured manner, and generate comprehensive reports. This tool helps in consolidating and making sense of the data, which is crucial for efficient incident handling and reporting.","zq":"下列哪一個是報告撰寫工具，可協助事件處理人員在事件回應過程中對偵測到的事件產生有效的報告？","zo":["threat_note","MagicTree","IntelMQ","Malstrom"],"ze":"MagicTree 能匯入並整合各工具產出的資料，以樹狀結構整理並產生報告。threat_note 是情資筆記工具；IntelMQ 是情資收集處理框架；Malstrom 是惡意程式追蹤工具。"},{"n":153,"c":"web","q":"Following a high-priority security incident, you, as an Incident Responder at a Cyber Incident Response firm, initiate an internal investigation after reports confirm a serious data breach in which sensitive customer data, including payment details and personal information, was stolen from a critical web server. You begin analyzing the server logs to reconstruct the attack timeline and identify how the attacker gained access. During your investigation, you discover suspicious activity in the logs, including repeated requests attempting to access files and directories outside of the web server’s root directory. Some of these requests appear to be manipulating URL paths to navigate into restricted system files—a behavior that is often associated with web\u0002based exploits. You suspect that a vulnerability in the web server was exploited to bypass security restrictions and access unauthorized directories, potentially exposing sensitive configurations and credentials. However, you still need to confirm the exact technique used. Which type of web application attack might have caused this incident?","o":["Cross-Site Scripting (XSS) Attacks","Directory Traversal","SQL Injection Attack","Session Attacks: Cookie Poisoning"],"a":1,"e":"Directory Traversal is the technique most directly aligned with “manipulating URL paths to access files and directories outside the web root.” Attackers abuse path sequences (for example, patterns like “../”) or encoded variants to move upward in a directory structure and reach restricted locations such as configuration files, credentials, or system files. In SOC investigations, repeated attempts to request “outside-root” paths in web logs (often with URL encoding, double encoding, or mixed separators) is a classic indicator of traversal probing and exploitation. This differs from SQL injection, which targets database queries and typically shows payloads manipulating SQL syntax (quotes, UNION, tautologies, time delays) rather than filesystem path navigation. XSS focuses on injecting scripts into web pages to run in a victim’s browser, so the log artifacts are more about injected JavaScript/HTML payloads and reflected/stored contexts. Cookie poisoning is a session attack involving tampering with session tokens or cookie values, which shows up as abnormal cookie parameters rather than path traversal requests. Given the explicit evidence of path manipulation to reach unauthorized directories, Directory Traversal is the best match and should drive mitigations such as strict input validation, canonical path checks, least-privilege file permissions, and WAF rules.","zq":"你在資安事件應變公司調查一起關鍵 Web 伺服器客戶資料（含付款資訊）外洩事件。分析伺服器日誌時，發現反覆有請求嘗試存取 Web 根目錄以外的檔案與目錄，部分請求操縱 URL 路徑以進入受限的系統檔案。可能是哪一種 Web 應用攻擊造成的？","zo":["跨站腳本（XSS）攻擊","目錄穿越","SQL 注入攻擊","工作階段攻擊：Cookie 下毒"],"ze":"操縱 URL 路徑（../ 及其編碼變形）存取 Web 根目錄以外的檔案，是目錄穿越的明確特徵。防禦：正規化路徑檢查、嚴格輸入驗證、最小權限檔案權限、WAF 規則。"},{"n":154,"c":"siem","q":"An organization with a complex IT infrastructure is planning to implement a SIEM solution to improve its threat detection and response capabilities. Due to the scale and complexity of its systems, the organization opts for a phased deployment approach to ensure a smooth implementation and reduce potential risks. Which of the following should be the first phase in their SIEM deployment strategy?","o":["Automate incident response processes","Implement User and Entity Behavior Analytics (UEBA)","Set up the log management component before deploying the SIEM component","Configure security analytics to identify potential threats"],"a":2,"e":"The first phase should establish reliable log ingestion and storage—log management—before attempting advanced detection content or automation. A SIEM is only as effective as the data it receives. In a complex environment, initial success depends on building a stable pipeline: collecting logs from priority sources, normalizing timestamps, ensuring consistent parsing, defining retention, and validating data quality (completeness, latency, duplication, and integrity). Without this foundation, analytics will produce blind spots, false positives, and missed detections, and automation may take disruptive actions based on incomplete data. UEBA and security analytics are valuable but require sufficient historical, high-quality telemetry to build baselines and correlations. Similarly, incident response automation should come after the organization has validated detections, tuning, and operational workflows; otherwise, playbooks may amplify errors at scale. A phased approach typically starts with identifying key data sources (identity, endpoint, network, cloud), onboarding them into log management, confirming visibility and schema consistency, and only then layering detection rules, correlations, and response workflows. Therefore, setting up log management first is the correct starting phase for a low-risk, high-success SIEM deployment.","zq":"某 IT 架構複雜的組織計畫導入 SIEM，因規模與複雜度選擇分階段部署以降低風險。SIEM 部署策略的第一階段應該是什麼？","zo":["自動化事件回應流程","導入使用者與實體行為分析（UEBA）","先建置日誌管理元件，再部署 SIEM 元件","設定安全分析以找出潛在威脅"],"ze":"SIEM 的效果取決於資料。第一階段應先建立穩定的日誌收集、剖析、時間同步、保存與品質驗證；UEBA 需要歷史基準，自動化需要已調校的偵測，都應在後面階段。"},{"n":155,"c":"siem","q":"ABC is a multinational company with multiple offices across the globe, and you are working as an L2 SOC analyst. You are implementing a centralized logging solution to enhance security monitoring. You must ensure that log messages from routers, firewalls, and servers across multiple remote offices are efficiently collected and forwarded to a central syslog server. To streamline this process, an intermediate component is deployed to receive log messages from different devices and forward them to the main syslog server. Which component in the syslog infrastructure performs this function?","o":["Syslog Database","Syslog Collector","Syslog Listener","Syslog Relay"],"a":3,"e":"A syslog relay is specifically used as an intermediary that receives syslog messages from multiple sources and forwards them to an upstream (central) syslog server. In distributed enterprises, relays reduce bandwidth usage across WAN links, provide buffering during intermittent connectivity, and allow local aggregation before forwarding, which improves reliability and manageability. Relays can also apply basic filtering or routing rules so that critical logs are prioritized and noisy logs can be handled appropriately without overwhelming the central collector. A syslog “listener” is typically the process that receives syslog traffic on a given port, but it does not inherently imply forwarding as an architectural role. A syslog “collector” is often used generically to describe a central receiver/ingestion point; however, the question emphasizes an intermediate component that forwards to the main server, which is the role of a relay. A syslog database is for storage/indexing, not message forwarding. From a SOC design standpoint, relays are common in remote sites to maintain log continuity and reduce loss, helping incident investigations by ensuring centralized visibility even when networks are unstable.","zq":"你是 ABC 跨國公司的 L2 SOC 分析師，正在建置集中式日誌。需要把各遠端據點的路由器、防火牆與伺服器日誌有效收集並轉送到中央 syslog 伺服器。為此部署一個中介元件，接收各裝置日誌再轉送給主 syslog 伺服器。這是 syslog 架構中的哪個元件？","zo":["Syslog 資料庫","Syslog 收集器","Syslog 監聽器","Syslog 中繼（Relay）"],"ze":"Syslog Relay 接收多個來源的訊息並轉送到上游伺服器，可在遠端據點做本地彙整、緩衝與過濾，減少 WAN 頻寬並提升可靠性。收集器是中央接收點；資料庫負責儲存。"},{"n":156,"c":"hunt","q":"The SOC analyst at a national cybersecurity agency detected unusual system behavior on critical infrastructure servers. Initial scans flagged potential malware activity. Due to the sophisticated nature of the suspected attack, including registry modifications, process injection, and unauthorized tasks, the case was escalated to the forensic team. The forensic team suspects the malware is designed for stealthy data exfiltration. To assess the compromise, they captured system snapshots before and after suspected infection to identify unauthorized changes and anomalies. Which process are they following by capturing and comparing system snapshots to detect unauthorized changes?","o":["Digital forensics","Signature-based detection","Threat intelligence gathering","Host integrity monitoring"],"a":3,"e":"Capturing and comparing system snapshots before and after suspected compromise is a core method of host integrity monitoring. The goal is to detect unauthorized changes to critical system components such as registry keys, scheduled tasks, services, binaries, configuration files, and security settings. By comparing a known-good baseline snapshot to a suspected-compromised state, analysts can identify what changed, when it changed (with supporting timestamps), and which changes are anomalous relative to expected patching or administrative activity. While this activity can occur within a broader digital forensics investigation, the specific technique described—baseline comparison to detect unauthorized modification—is integrity monitoring. Signature-based detection focuses on matching known indicators (hashes, strings, known patterns) and does not rely on before/after snapshot comparison. Threat intelligence gathering is about collecting and analyzing information on external threats, not directly comparing host states. From a SOC standpoint, integrity monitoring supports rapid scoping and eradication because it highlights persistence and tampering mechanisms that must be removed and can reveal stealth modifications that evade signature scanners. It also supports compliance requirements by demonstrating configuration control and unauthorized-change detection capabilities.","zq":"國家資安機構 SOC 發現關鍵基礎設施伺服器行為異常，疑似有登錄檔修改、行程注入與未授權排程工作，案件升級給鑑識團隊。團隊在疑似感染前後擷取系統快照並比較，以找出未授權變更與異常。他們遵循的是哪一個流程？","zo":["數位鑑識","特徵碼偵測","威脅情資蒐集","主機完整性監控"],"ze":"以已知良好基準快照比對目前狀態、找出登錄機碼、服務、排程、系統檔案的未授權變更，是主機完整性監控（HIM/FIM）的核心方法。特徵碼偵測是比對已知惡意模式。"},{"n":157,"c":"net","q":"Which of the following process refers to the discarding of the packets at the routing level without informing the source that the data did not reach its intended recipient?","o":["Load Balancing","Rate Limiting","Black Hole Filtering","Drop Requests"],"a":2,"e":"Black hole filtering is a network security measure used to prevent unwanted or malicious traffic from entering a network. It works by directing traffic to a null interface, a non-existent server, or a black hole IP address where the packets are dropped without acknowledgment. This process is typically used to protect against denial-of-service (DoS) attacks, where an overwhelming amount of traffic is sent to a network with the intent to disrupt service.\nIn the context of a security operations center (SOC), black hole filtering can be an effective strategy for mitigating threats. When a threat is identified, such as a DoS attack, the SOC analyst can configure the network to redirect the suspicious traffic to a black hole, effectively neutralizing the attack by preventing the malicious data packets from reaching their intended target.","zq":"哪一個程序是在路由層級丟棄封包，且不通知來源端資料未送達預定接收者？","zo":["負載平衡","速率限制","黑洞過濾（Black Hole Filtering）","丟棄請求"],"ze":"黑洞過濾把流量導向 null 介面（如 null0）直接丟棄、不回應 ICMP，常用於緩解 DDoS（RTBH 遠端觸發黑洞）。缺點是目標也會一併無法被合法存取。"},{"n":158,"c":"web","q":"An attacker exploits the logic validation mechanisms of an e-commerce website. He successfully purchases a product worth $100 for $10 by modifying the URL exchanged between the client and the server.\nOriginal\nURL: http://www.buyonline.com/product.aspx?profile=12\n&debit=100\nModified URL: http://www.buyonline.com/product.aspx?profile=12\n&debit=10\nIdentify the attack depicted in the above scenario.","o":["Denial-of-Service Attack","SQL Injection Attack","Parameter Tampering Attack","Session Fixation Attack"],"a":2,"e":"The scenario described involves an attacker modifying the URL parameters to alter the price of a product, which is a classic example of a Parameter Tampering attack. This type of attack occurs when an attacker manipulates parameters exchanged between client and server in order to modify application data, such as user credentials, permissions, and price of products, as seen in this case.\nThe original URL indicates that the product price (debit) is set to $100. The attacker has modified this parameter value to $10 in the modified URL, thus exploiting the logic validation mechanism of the e-commerce website to purchase the product at a lower price. Thismanipulation of parameters is indicative of a Parameter Tampering attack, which is a form of web-based attack where the properties of a web application are altered to achieve unintended outcomes by the attacker.","zq":"攻擊者利用電商網站的邏輯驗證機制，修改用戶端與伺服器之間傳遞的 URL，成功以 10 美元購買價值 100 美元的商品。\n原始 URL：http://www.buyonline.com/product.aspx?profile=12&debit=100\n修改後 URL：http://www.buyonline.com/product.aspx?profile=12&debit=10\n這是哪一種攻擊？","zo":["阻斷服務攻擊","SQL 注入攻擊","參數竄改攻擊","工作階段固定攻擊"],"ze":"修改 URL 中的價格參數 debit=100 → 10，是典型參數竄改。根本原因是伺服器信任用戶端傳來的價格；價格等敏感數值必須在伺服器端取得與驗證。"},{"n":159,"c":"ir","q":"The SOC team is investigating a phishing attack that targeted multiple employees. During the Containment Phase, they need to determine how users interacted with the malicious email: whether they opened it, clicked links, downloaded attachments, or entered credentials. This information is critical to assessing impact and preventing further compromise. Which specific activity helps the SOC team understand user interactions with the phishing email?","o":["Monitoring and containment validation","Malware infection check","User action verification","Blocking command-and-control (C2) and email traffic"],"a":2,"e":"User action verification is the activity that directly answers “what did users do with the phishing message?” In SOC containment, you need to rapidly determine exposure: who opened the email, who clicked the URL, who opened an attachment, and who submitted credentials. This drives priority actions such as password resets, session revocation, MFA re-registration, endpoint isolation, URL/domain blocking, mailbox searches for similar messages, and targeted user notifications. Monitoring/containment validation confirms whether containment actions are effective (e.g., blocks are working, incidents aren’t spreading), but it does not specifically measure user interaction steps. Malware infection checks assess whether an endpoint is infected—\nuseful if an attachment executed—but it comes after confirming interaction and is not the primary method to understand email engagement. Blocking C2 and email traffic is an active containment control, but it doesn’t provide the “who clicked/opened” understanding needed to scope impacted users. SOC analysts typically use email gateway telemetry, message trace, safe links/safe attachments logs, and identity sign-in logs to verify user actions. Because the question is explicitly about understanding user interactions, “User action verification” is the best match.","zq":"SOC 在調查一起針對多名員工的網釣攻擊。在圍堵階段，需要判斷使用者如何與惡意郵件互動：是否開啟、點擊連結、下載附件或輸入憑證。哪一項活動能幫助 SOC 了解使用者的互動情況？","zo":["監控與圍堵驗證","惡意程式感染檢查","使用者行為驗證（User action verification）","封鎖 C2 與郵件流量"],"ze":"使用者行為驗證透過郵件閘道追蹤、Safe Links／附件日誌與登入紀錄，確認誰開信、誰點擊、誰輸入憑證，據以決定重設密碼、撤銷工作階段或隔離端點的範圍。"},{"n":160,"c":"cti","q":"Banter is a threat analyst in Christine Group of Industries. As a part ofthe job, he is currently formatting and structuring the raw data.\nHe is at which stage of the threat intelligence life cycle?","o":["Dissemination and Integration","Processing and Exploitation","Collection","Analysis and Production"],"a":1,"e":"In thethreat intelligence life cycle, the stage of Processing and Exploitation involves the formatting and structuring of raw data. This is the phase where collected data is turned into a format that can be more easily analyzed and used. Banter, as a threat analyst, is engaged in this specific activity, which indicates that he is in the Processing and Exploitation stage. This stage is crucial as it prepares the data for further analysis and production of actionable intelligence.","zq":"Banter 是 Christine Group 的威脅分析師，目前正在格式化與結構化原始資料。他處於威脅情報生命週期的哪個階段？","zo":["傳播與整合","處理與利用（Processing and Exploitation）","收集","分析與產出"],"ze":"情報生命週期：規劃與方向 → 收集 → 處理與利用（整理、格式化、結構化原始資料）→ 分析與產出 → 傳播與整合。"},{"n":161,"c":"ir","q":"Which of the following steps of incident handling and response process focus on limiting the scope and extent of an incident?","o":["Containment","Data Collection","Eradication","Identification"],"a":0,"e":"The step in theincident handling and response process that focuses on limiting the scope and extent of an incident is Containment. This phase aims to isolate affected systems to prevent the spread of the incident and to minimize its impact. Containment strategies may involve disconnecting affected systems from the network, blocking malicious traffic, or taking systems offline. The goal is to contain the incident quickly to reduce damage and to maintain business operations1.","zq":"事件處理與回應流程中，哪一個步驟著重於限制事件的範圍與程度？","zo":["圍堵","資料蒐集","根除","識別"],"ze":"圍堵的目標是隔離受影響系統、阻止擴散，把損害控制在最小範圍，例如中斷網路、封鎖惡意流量、隔離主機。"},{"n":162,"c":"web","q":"Which of the following attack can be eradicated by filtering improper XML syntax?","o":["CAPTCHAAttacks","SQL Injection Attacks","Insufficient Logging and Monitoring Attacks","Web Services Attacks"],"a":3,"e":"Web services attacks can be mitigated by filtering improper XML syntax because these attacks often exploit vulnerabilities in web services that accept XML input. XML filtering ensures that only properly formatted XML data is processed by the web service. This can prevent various forms of XML-related attacks, such as XML injection or XML External Entity (XXE) attacks, where attackers attempt to interfere with the processing of XML data.","zq":"過濾不正確的 XML 語法可以根除哪一種攻擊？","zo":["CAPTCHA 攻擊","SQL 注入攻擊","日誌與監控不足攻擊","Web Services 攻擊"],"ze":"Web Services（SOAP 等）以 XML 交換資料，常見 XML 注入、XXE、XML 炸彈等攻擊。驗證並過濾不正確的 XML 語法（並停用外部實體）可有效防禦。"},{"n":163,"c":"log","q":"Which of the following Windows features is used to enable Security Auditing in Windows?","o":["Bitlocker","Windows Firewall","Local Group Policy Editor","Windows Defender"],"a":2,"e":"To enable Security Auditing in Windows, the Local Group Policy Editor is used. This feature allows administrators to configure security policies and audit settings on a local computer. Here’s how you can enableSecurity Auditing using the Local Group Policy Editor:\nPress Win + R, type gpedit.msc, and press Enter to open the Local Group Policy Editor.\nNavigate to Computer Configuration -> Windows Settings -> Security Settings -> Local Policies -\n> Audit Policy.\nHere, you will find a list of audit policies that you can configure for both success and failure events.\nBy enabling these policies, you can specify which security-related events you want to audit, such as account logon events, object access, policy change, privilege use, and more.","zq":"下列哪一個 Windows 功能可用來啟用安全性稽核？","zo":["BitLocker","Windows 防火牆","本機群組原則編輯器","Windows Defender"],"ze":"執行 gpedit.msc → 電腦設定 → Windows 設定 → 安全性設定 → 本機原則 → 稽核原則（或進階稽核原則設定），即可啟用登入、物件存取、原則變更等成功／失敗稽核。"},{"n":164,"c":"siem","q":"You are working in a Cybersecurity Operations Center for PayOnline, which handles payment gateways for multiple applications. Your team monitors logs across firewalls, authentication servers, and endpoint detection tools. The team currently relies on manual log reviews, but the volume of raw, unstructured logs makes the process inefficient and error-prone. During a recent incident, the team struggled to extract relevant details from disorganized logs, delaying detection and response. The team decides to implement an automated log parsing solution that can transform unstructured logs into a structured format. Which log parsing technique should you implement to improve log data structuring and enable efficient querying and analysis?","o":["Delimited parsing","Key-value extraction","Grok filters","Semantic parsing"],"a":2,"e":"Grok filters are widely used to parse unstructured or semi-structured logs into structured fields by applying pattern-based extraction. In SOC environments, many logs arrive as free-form text (application logs, custom service logs, legacy device logs). Grok allows analysts/engineers to define reusable patterns (for timestamps, IPs, usernames, HTTP methods, error codes) and map extracted values into normalized fields. This enables reliable querying, correlation, dashboards, and alert rules in a SIEM because the same concept (source IP, user, action) is consistently represented. Delimited parsing is effective when logs are already consistently separated by commas/tabs/pipes, but the question emphasizes “raw, unstructured logs,” where delimiters may not be stable. Key-value extraction is excellent when logs are already formatted as key=value pairs, but unstructured logs often lack consistent keys. Semantic parsing is more advanced (often involving deeper content understanding) and may not be the practical first choice for rapid operational parsing at scale. For a fast-growing SOC needing immediate improvements in structure and queryability, Grok-style pattern parsing is a proven, practical technique to convert messy log lines into actionable structured data.","zq":"你在支付閘道公司 PayOnline 的資安營運中心，團隊目前人工檢視大量原始、非結構化日誌，效率低且易出錯，延誤了事件偵測。團隊決定導入自動化日誌剖析，將非結構化日誌轉為結構化格式。應採用哪一種剖析技術？","zo":["分隔字元剖析","鍵值擷取","Grok 過濾器","語意剖析"],"ze":"Grok（Logstash 常用）以可重複使用的樣式（時間戳、IP、使用者名稱等）從非結構化文字中擷取欄位。分隔字元剖析需格式固定；鍵值擷取需 key=value 格式；語意剖析較進階不實際。"},{"n":165,"c":"cti","q":"A type of threatintelligent that find out the information about the attacker by misleading them is known as\n.","o":["Threat trending Intelligence","Detection Threat Intelligence","Operational Intelligence","Counter Intelligence"],"a":3,"e":"CounterIntelligence in the context of threat intelligence refers to efforts to deceive, manipulate, or mislead potential attackers to uncover their intentions, capabilities, or identities. This type of intelligence is proactive and often involves setting up honeypots or other traps to engage the attacker without them realizing they are being monitored and analyzed. The goal is to gather information about the attacker that can be used to strengthen defenses and prevent future attacks.","zq":"一種藉由誤導攻擊者來取得其相關資訊的威脅情報，稱為什麼？","zo":["威脅趨勢情報","偵測型威脅情報","營運情報","反情報（Counter Intelligence）"],"ze":"反情報透過欺敵手段（蜜罐、假資料、誘餌帳號）誤導攻擊者，在其未察覺下蒐集其意圖、能力與身分資訊。"},{"n":166,"c":"risk","q":"Which of the following framework describes the essential characteristics of an organization's security engineering process that must exist to ensure good security engineering?","o":["COBIT","ITIL","SSE-CMM","SOC-CMM"],"a":2,"e":"The Systems Security Engineering Capability Maturity Model (SSE-CMM) is the framework that describes the essential characteristics of an organization’s security engineering process that must exist to ensure good security engineering. The SSE-CMM provides a standard metric for security engineering practices, covering the entire lifecycle of development, operation, maintenance, and decommissioning activities. It also includes management, organizational, and engineering activities, as well as interactions with other disciplines and organizations1.","zq":"哪一個框架描述組織資安工程流程必須具備的關鍵特性，以確保良好的資安工程？","zo":["COBIT","ITIL","SSE-CMM","SOC-CMM"],"ze":"SSE-CMM（系統安全工程能力成熟度模型，ISO/IEC 21827）定義資安工程流程的基本特性。COBIT 是 IT 治理框架；ITIL 是 IT 服務管理；SOC-CMM 評估 SOC 成熟度。"},{"n":167,"c":"cti","q":"TechInnovate receives an alert about a newly discovered zero-day vulnerability in a widely used web application framework that is being actively exploited. No official patch is available. The SOC must monitor adversary tactics, identify indicators of compromise (IoCs), and proactively adjust controls to detect, track, and mitigate the threat. Which SOC technology is crucial for real-time visibility into evolving threat intelligence and enabling proactive mitigation?","o":["Vulnerability management tools","Threat intelligence management tools","Endpoint detection and response (EDR) tools","Security information and event management (SIEM) solutions"],"a":1,"e":"When a zero-day is being exploited and no patch exists, the SOC must rapidly consume, curate, and operationalize evolving threat intelligence: new IoCs, attacker infrastructure, exploitation patterns, and defensive guidance. Threat intelligence management tools are purpose-built for this. They aggregate feeds and reports, normalize indicators, score confidence and relevance, de-duplicate noise, enrich with context (campaign, actor, targeting), and push actionable intelligence into detection and response systems. This provides real-time visibility into changes as the threat evolves and enables proactive mitigation such as blocking malicious domains/IPs, updating WAF rules, tuning detections, and prioritizing monitoring on vulnerable assets. Vulnerability management tools are important for exposure tracking, but they provide limited real-time adversary intelligence and cannot resolve a zero-day without patching/mitigation guidance. EDR tools provide endpoint visibility and containment but don’t serve as the intelligence aggregation and distribution layer. SIEM solutions correlate internal telemetry and alert on suspicious behavior, but they rely on intelligence sources and still need a mechanism to manage rapidly changing indicators at scale. Therefore, threat intelligence management tools are crucial for quickly turning external intelligence into actionable defensive updates during a zero-day window.","zq":"TechInnovate 收到某熱門 Web 框架出現正被積極利用的零時差漏洞警報，目前沒有官方修補。SOC 必須監控攻擊者戰術、辨識 IoC，並主動調整控制措施以偵測、追蹤與緩解威脅。哪一項 SOC 技術對即時掌握演變中的威脅情資並主動緩解最為關鍵？","zo":["弱點管理工具","威脅情資管理工具（TIP）","端點偵測與回應（EDR）工具","SIEM 解決方案"],"ze":"零時差且無修補時，最重要的是快速取得並運用不斷更新的情資：新 IoC、攻擊基礎設施、利用手法與緩解建議。威脅情資管理平台負責彙整、去重、評分並推送到 SIEM/防火牆/WAF 等防禦系統。"},{"n":168,"c":"log","q":"Identify the HTTP status codes that represents the server error.","o":["2XX","4XX","1XX","5XX"],"a":3,"e":"HTTP status codes are categorized into fiveclasses, where each class is represented by the first digit of the status code. The 5XX series of status codes indicates server errors, which means that the server is aware that it has encountered an error or is otherwise incapable of performing the request. Common examples of 5XX status codes include 500 (Internal Server Error), 501 (Not Implemented), 502 (Bad Gateway), etc. These indicate that the request was valid, but the server failed to fulfill the request due to some issue on the server side.","zq":"哪一類 HTTP 狀態碼代表伺服器錯誤？","zo":["2XX","4XX","1XX","5XX"],"ze":"5XX 為伺服器錯誤，如 500 Internal Server Error、502 Bad Gateway、503 Service Unavailable。4XX 為用戶端錯誤。"},{"n":169,"c":"risk","q":"According to the Risk Matrix table, what will be the risk level when the probability of an attack is very low and the impact of that attack is major?","o":["High","Extreme","Low","Medium"],"a":2,"e":"In a RiskMatrix, risk levels are determined by the intersection of the likelihood of an event occurring and the impact that event would have if it did occur. When the probability of an attack is , it means that the very low\nevent is unlikely to happen. However, if the impact of that attack is , it suggests that the event would major\nhave significant consequences if it did occur.\nThe combination of a very low probability with a major impact typically results in a low risk level. This is because the overall risk is mitigated by the low chance of the event happening, despite the potential for a significant impact. Therefore, even though the impact is major, the risk level is kept low due to the very low likelihood of occurrence.","zq":"依風險矩陣表，當攻擊發生機率「非常低」而影響為「重大」時，風險等級為何？","zo":["高","極高","低","中"],"ze":"題庫答案為「低」：雖然衝擊重大，但發生機率非常低，在此題的風險矩陣中落在低風險區。對照第 183 題：機率非常高 × 重大 = 極高。"},{"n":170,"c":"cti","q":"Properly applied cyber threat intelligence to the SOC team help them in discovering TTPs.\nWhat does these TTPs refer to?","o":["Tactics, Techniques, and Procedures","Tactics, Threats, and Procedures","Targets, Threats, and Process","Tactics, Targets, and Process"],"a":0,"e":"TTPs in the context of cybersecurity and SOC (Security Operations Center) refer to the patterns of activities or methods associated with a specific threat actor or group of threat actors. Understanding TTPs is crucial for the SOC team as it allows them to identify, prepare, and respond to potential threats more effectively. Here’s a breakdown of the term:\nTactics: The adversary’s overall strategy or the ‘what’ they are trying to accomplish.\nTechniques: The general methods the adversary uses to achieve their tactical goals.\nProcedures: The specific, detailed methods theadversary employs, which can include tools, scripts, commands, and sequences of actions.\nBy analyzing TTPs, SOC teams can develop a more proactive defense posture, anticipate likely attack methods, and implement appropriate countermeasures.","zq":"妥善運用網路威脅情報能幫助 SOC 團隊發現 TTP。TTP 指的是什麼？","zo":["戰術、技術與程序（Tactics, Techniques, and Procedures）","戰術、威脅與程序","目標、威脅與流程","戰術、目標與流程"],"ze":"Tactics 是攻擊者想達成的目的（what/why）、Techniques 是達成目的的方法（how）、Procedures 是具體實作細節（工具、指令）。MITRE ATT&CK 即以此組織。"},{"n":171,"c":"risk","q":"Which of the following formula represents the risk?","o":["Risk = Likelihood × Severity × Asset Value","Risk = Likelihood × Consequence × Severity","Risk = Likelihood × Impact × Severity","Risk = Likelihood × Impact × Asset Value"],"a":3,"e":"Risk is typically calculated as the product oflikelihood, impact, and asset value. Likelihood represents the probability of a threat exploiting a vulnerability, impact refers to the potential damage or loss that could result from the threat, and asset value quantifies the importance or worth of the asset to the organization. The formula ( \\text{Risk} = \\text{Likelihood} \\times \\text{Impact} \\times \\text{Asset Value} ) captures the essence of risk in terms of these three factors.","zq":"下列哪一個公式代表風險？","zo":["風險 = 可能性 × 嚴重度 × 資產價值","風險 = 可能性 × 後果 × 嚴重度","風險 = 可能性 × 衝擊 × 嚴重度","風險 = 可能性 × 衝擊 × 資產價值"],"ze":"EC-Council 定義：風險 = 可能性（Likelihood）× 衝擊（Impact）× 資產價值（Asset Value）。另一題「風險等級 = 後果 × 可能性」請一併記住。"},{"n":172,"c":"log","q":"A SOC analyst detects multiple instances of powershell.exe being launched with the -ExecutionPolicy Bypass and -NoProfile arguments on a domain controller. The parent process is winrm.exe, and the activity occurs during non-business hours. What should be the analyst’s primary focus?","o":["Look for Event ID 4625 to check for failed authentication attempts before execution","Investigate Event ID 7045 to determine if a malicious service was created","Search for Event ID 4688 to find similar PowerShell executions within the last 24 hours","Review Event ID 5145 to see if unauthorized network shares were accessed"],"a":2,"e":"The highest-signal next step is to scope and confirm the suspicious execution pattern by identifying related process creation events. Event ID 4688 records process creation in Windows Security logs when auditing is enabled, and it can capture command-line details that confirm the use of -ExecutionPolicy Bypass and -\nNoProfile, as well as parent/child relationships. Since the activity is on a domain controller and the parent is winrm.exe (remote management), the SOC must quickly determine whether this is isolated or part of a broader remote execution campaign. Searching for similar 4688 events over a relevant window (such as the last 24 hours) helps identify frequency, affected accounts, and whether the same command line or script path appears across hosts. Event ID 4625 (failed logon) can provide context for brute force attempts, but it does not directly validate or scope the suspicious PowerShell executions already observed. Event ID 7045 (new service installation) is important if there are signs of service-based persistence, but it is a different hypothesis. Event ID 5145 is about network share access and can be useful for lateral movement, but the immediate priority is to scope execution behavior. Therefore, focusing on 4688 process creation for similar PowerShell executions is the best primary step.","zq":"SOC 分析師偵測到網域控制站上多次以 -ExecutionPolicy Bypass 與 -NoProfile 參數啟動 powershell.exe，其父行程為 winrm.exe，且發生在非上班時段。分析師的首要焦點應該是？","zo":["查詢事件 4625，檢查執行前的驗證失敗","調查事件 7045，判斷是否建立了惡意服務","搜尋事件 4688，找出過去 24 小時內類似的 PowerShell 執行","檢視事件 5145，看是否存取了未授權的網路共用"],"ze":"4688（行程建立，含命令列）可確認可疑參數與父子行程關係，並界定是否在多台主機或多次發生。winrm.exe 為父行程代表遠端執行，需優先確認範圍。4625、7045、5145 是其他假說的佐證。"},{"n":173,"c":"log","q":"Jason, a SOC Analyst with Maximus Tech, was investigating Cisco ASA Firewall logs and came across the following log entry:\nMay 06 2018 21:27:27 asa 1: %ASA -5 – 11008: User 'enable_15' executed the 'configure term' command What does the security level in the above log indicates?","o":["Warning condition message","Critical condition message","Normal but significant message","Informational message"],"a":0,"e":"In the context of Cisco ASA Firewall logs, messages are categorized intodifferent severity levels ranging from 0 (emergencies) to 7 (debugging messages). The log entry mentioned specifies a severity level of 5, denoted by \"-5-\" in the log entry. According to Cisco's documentation, a severity level of 5 corresponds to a \"Notification\" level, which indicates a warning condition message. These messages are significant and highlight conditions that could potentially lead to more severe problems if not addressed. The execution of the 'configure term' command by 'enable_15' user, asnoted in the log, is an example of a notable event that warrants attention, hence categorized under this severity level.","zq":"Maximus Tech 的 SOC 分析師 Jason 調查 Cisco ASA 防火牆日誌時看到：May 06 2018 21:27:27 asa 1: %ASA-5-11008: User 'enable_15' executed the 'configure term' command。此日誌中的安全等級代表什麼？","zo":["警告狀況訊息","嚴重狀況訊息","正常但重要的訊息","資訊訊息"],"ze":"題庫答案為 A（警告狀況）。注意：依 Cisco 官方定義，等級 5 為 Notification（正常但重要的狀況），等級 4 才是 Warning。考試請依題庫作答，實務上以官方定義為準。"},{"n":174,"c":"siem","q":"An attacker attempts to gain unauthorized access to a secure network by repeatedly guessing login credentials. The SIEM is configured to generate an alert after detecting 10 consecutive failed login attempts within a short timeframe. However, the attacker successfully logs in on the 9th attempt, just before the threshold is reached, bypassing the alert mechanism. The security team only becomes aware of the incident after detecting suspicious activity post-login, highlighting a gap in the SIEM’s detection rules. What type of alert classification does this represent?","o":["False negative","False positive","True negative","True positive"],"a":0,"e":"A false negative occurs when malicious activity happens but the detection logic fails to alert. In this case, an attacker successfully authenticates after multiple failed attempts, yet the SIEM rule does not trigger because the threshold (10 failed attempts) was not met. The incident is real, but the system missed it—this is the definition of a false negative. From a SOC engineering perspective, this highlights a common tuning pitfall: rigid thresholds can be evaded by attackers who adjust timing or stop just short of the trigger condition. To reduce false negatives, SOC teams often implement layered detections: alert on “many failed attempts” (lower thresholds), alert on “failed attempts followed by a success,” incorporate user risk context (unusual source IP\n/geo), and add account lockout or MFA policies to reduce attack success. A false positive would mean an alert triggered for benign activity, which did not occur here. True positives/true negatives require the SIEM to correctly alert or correctly stay silent, respectively. Since the SIEM stayed silent during an actual compromise, the classification is false negative.","zq":"攻擊者反覆猜測帳密。SIEM 設定為 10 次連續登入失敗後告警，但攻擊者在第 9 次就成功登入，未觸發告警，直到登入後的可疑活動才被發現。這屬於哪一種告警分類？","zo":["偽陰性（False negative）","偽陽性（False positive）","真陰性（True negative）","真陽性（True positive）"],"ze":"真實攻擊發生但系統沒有告警 = 偽陰性。改善方式：降低門檻、增加「多次失敗後成功」的規則、加入來源 IP／地理情境，並以 MFA 降低成功率。"},{"n":175,"c":"cloud","q":"The Security Operations Center (SOC) team at Rapid Response Group, a leading cybersecurity firm, is facing challenges in managing security incidents efficiently. With an increasing volume of alerts and security events being generated daily in their Microsoft Sentinel environment, the team is struggling to respond to threats quickly and consistently. To enhance their incident response capabilities, they aim to automate routine security tasks, such as log collection, alert triaging, remediation steps, and notifications to stakeholders. By implementing automated workflows, they seek to reduce response times, eliminate manual intervention for repetitive actions, and ensure a standardized approach to handling security threats across the organization. Which component of Microsoft Sentinel should they utilize to create these automated workflows for incident response?","o":["Community","Playbooks","Workspace","Analytics"],"a":1,"e":"In Microsoft Sentinel, Playbooks are the component used to automate incident response workflows. From a SOC analyst perspective, playbooks operationalize consistent actions at machine speed: enrich alerts (who, what, where), notify stakeholders, open tickets, isolate endpoints, disable accounts, block indicators, and orchestrate approvals. This directly addresses high alert volume by standardizing repetitive tasks and reducing manual handling time, which improves mean time to acknowledge (MTTA) and mean time to respond (MTTR). “Analytics” in Sentinel is where detection rules and correlations are configured to generate alerts and incidents; it is not the workflow engine for response actions. A “Workspace” is the Log Analytics environment where data is stored and queried, which is foundational but not the automation component. “Community” refers to shared content and contributions (rules, workbooks, playbooks), but it is not the mechanism that executes your organization’s automated response. Therefore, for building automated workflows that act on incidents and alerts, Playbooks are the correct choice.","zq":"Rapid Response Group 的 SOC 在 Microsoft Sentinel 中告警量大增，難以快速一致地回應。他們想自動化例行工作（日誌收集、告警分級、修復步驟、通知利害關係人）以縮短回應時間並標準化處理。應使用 Sentinel 的哪個元件建立自動化工作流程？","zo":["社群（Community）","劇本（Playbooks）","工作區（Workspace）","分析（Analytics）"],"ze":"Sentinel Playbooks（基於 Azure Logic Apps）用來自動化事件回應：豐富化、通知、開單、隔離端點、停用帳號。Analytics 是偵測規則；Workspace 是 Log Analytics 資料儲存；Community 是共享內容。"},{"n":176,"c":"ir","q":"The team receives an alert about a ransomware incident affecting the organization’s email infrastructure. Forensic analysis identifies the ransomware exploited CVE-2024-0123 in an unpatched mail server. The incident response team is deploying an emergency patch (KB5025941), updating mail filtering rules to block malicious payloads, and implementing additional network segmentation to limit lateral movement. Which phase of the Incident Response process is the SOC currently executing?","o":["Evidence gathering and forensic analysis","Eradication","Containment","Recovery"],"a":1,"e":"These actions align most strongly with eradication because they are removing the root cause of compromise and eliminating the adversary’s ability to persist. Applying an emergency patch to the exploited mail server closes the
