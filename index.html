<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CSA 題庫">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#070b10">
<title>CSA 312-39 題庫訓練台</title>
<style>
[hidden]{display:none!important}
:root{
  --bg:#070b10;--bg2:#0b121a;--panel:#0e1822;--panel2:#122030;--line:#1c2d3d;--line2:#27405a;
  --text:#d7e3ee;--muted:#8199b0;--dim:#5b7086;
  --accent:#22d3ee;--accent2:#38bdf8;--accentbg:rgba(34,211,238,.10);
  --ok:#34d399;--okbg:rgba(52,211,153,.12);--bad:#f87171;--badbg:rgba(248,113,113,.12);
  --warn:#fbbf24;--warnbg:rgba(251,191,36,.12);
  --mono:ui-monospace,"SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --r:10px;--grid:rgba(34,211,238,.035);
}
:root[data-theme="light"]{
  --bg:#eef3f7;--bg2:#e6edf3;--panel:#ffffff;--panel2:#f4f8fb;--line:#d5e0ea;--line2:#b9cbdb;
  --text:#132232;--muted:#4f6679;--dim:#7d91a3;
  --accent:#0e7490;--accent2:#0369a1;--accentbg:rgba(14,116,144,.09);
  --ok:#047857;--okbg:rgba(4,120,87,.09);--bad:#b91c1c;--badbg:rgba(185,28,28,.08);
  --warn:#b45309;--warnbg:rgba(180,83,9,.09);--grid:rgba(14,116,144,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.65;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--accent);border:1px solid var(--accent);padding:3px 8px;border-radius:6px;white-space:nowrap}
.brand h1{font-size:16px;margin:0;font-weight:650;white-space:nowrap}
.brand small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
.kpis{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.kpi{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;display:flex;gap:6px;align-items:baseline}
.kpi b{font-size:14px;color:var(--accent)}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}.kpi.warn b{color:var(--warn)}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;font-size:13px}
.iconbtn:hover{border-color:var(--accent)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:none;padding:9px 14px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap;font-weight:550}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--mono);font-size:11px;margin-left:5px;padding:0 6px;border-radius:9px;background:var(--panel2);color:var(--muted)}
/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 10px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
.search:focus-within{border-color:var(--accent)}
.search span{font-family:var(--mono);color:var(--accent)}
.search input{flex:1;border:none;background:none;outline:none;padding:9px 0;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.seg button{border:none;background:none;padding:7px 12px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accentbg);color:var(--accent);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.chip:hover{border-color:var(--line2);color:var(--text)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accentbg)}
.chip i{font-style:normal;font-family:var(--mono);font-size:11px;opacity:.8;margin-left:4px}
.poolinfo{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:14px}
.poolinfo b{color:var(--accent)}
/* layout */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.grid2.half{grid-template-columns:1fr 1fr}
@media (max-width:900px){.grid2,.grid2.half{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;position:relative}
.card.corner:before{content:"";position:absolute;left:-1px;top:-1px;width:18px;height:18px;border-left:2px solid var(--accent);border-top:2px solid var(--accent);border-top-left-radius:14px}
@media (max-width:560px){.card{padding:16px}}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-family:var(--mono);font-size:12px}
.tag{border:1px solid var(--line2);border-radius:6px;padding:1px 8px;color:var(--muted)}
.tag.id{color:var(--accent);border-color:var(--accent)}
.tag.dq{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:var(--warnbg)}
.disp{margin-top:12px;border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);border-radius:var(--r);background:var(--warnbg)}
.disp h4{margin:0;padding:10px 14px;font-size:13px;color:var(--warn);border-bottom:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.disp .body{padding:12px 14px;display:grid;gap:8px}
.disp .dr{display:grid;grid-template-columns:170px 22px minmax(0,1fr);gap:8px;align-items:start;font-size:14px}
.disp .dr>span:first-child{color:var(--muted);font-size:13px}
.disp .dr.main{font-weight:600}
.disp .dr b{font-family:var(--mono);color:var(--warn)}
.disp .dr small{display:block;color:var(--muted);font-size:12.5px}
.disp .dn{font-size:13.5px;border-top:1px dashed color-mix(in srgb,var(--warn) 35%,transparent);padding-top:8px}
@media (max-width:560px){.disp .dr{grid-template-columns:22px minmax(0,1fr)}.disp .dr>span:first-child{grid-column:1/-1}}
.tag.w{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.star{margin-left:auto;border:1px solid var(--line);background:none;border-radius:8px;padding:2px 10px;font-size:14px;color:var(--muted)}
.star.on{color:var(--warn);border-color:var(--warn);background:var(--warnbg)}
.qz{font-size:16.5px;font-weight:560;white-space:pre-line}
.qe{color:var(--muted);font-size:14px;margin-top:8px;white-space:pre-line;border-left:2px solid var(--line2);padding-left:10px}
.lang-en .qe{color:var(--text);font-size:16px;border:none;padding:0;margin:0;font-weight:520}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.opt{display:flex;gap:12px;text-align:left;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt .L{font-family:var(--mono);font-weight:700;color:var(--accent);flex:0 0 22px;height:22px;border:1px solid var(--line2);border-radius:6px;display:grid;place-items:center;font-size:12px;margin-top:1px}
.opt .t{flex:1;min-width:0;word-break:break-word}
.opt .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accentbg)}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right .L{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.wrong .L{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.verdict{margin-top:18px;border-radius:var(--r);padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.verdict.ok{background:var(--okbg);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.verdict.bad{background:var(--badbg);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.verdict .mono{font-family:var(--mono)}
.expl{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg2)}
.expl h4{margin:0;padding:10px 14px;font-size:13px;font-family:var(--mono);color:var(--accent);letter-spacing:.05em;border-bottom:1px solid var(--line)}
.expl .body{padding:12px 14px;white-space:pre-line}
details.en{margin-top:10px;border:1px dashed var(--line2);border-radius:var(--r);padding:0 14px}
details.en summary{cursor:pointer;padding:9px 0;font-family:var(--mono);font-size:12px;color:var(--muted)}
details.en div{padding-bottom:12px;color:var(--muted);font-size:13.5px;white-space:pre-line}
.navrow{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:var(--r);padding:8px 16px;font-weight:550}
.btn:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.1);color:var(--bg)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.sp{flex:1}
.kbd{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:12px}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
/* side */
.side h3{margin:0 0 10px;font-size:12px;font-family:var(--mono);color:var(--muted);letter-spacing:.08em;font-weight:600}
.side .card{padding:16px}
.side .card+.card{margin-top:14px}
.jump{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:300px;overflow:auto;padding-right:2px}
.jump button{font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:var(--panel2);border-radius:5px;padding:3px 0}
.jump button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.jump button.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.jump button.ans{background:var(--accentbg);border-color:var(--accent);color:var(--accent)}
.jump button.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.jump button.cur{outline:2px solid var(--text);outline-offset:-1px}
.catstat{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.catstat .row{display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.catstat .bar{grid-column:1/-1;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
.catstat .bar i{display:block;height:100%;background:var(--ok)}
.catstat .num{font-family:var(--mono);color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line2)}
.legend .l1:before{background:var(--okbg);border-color:var(--ok)}.legend .l2:before{background:var(--badbg);border-color:var(--bad)}.legend .l3:before{background:var(--accentbg);border-color:var(--accent)}
/* list */
.list{display:flex;flex-direction:column;gap:12px}
.item .qz{font-size:15.5px}
.item .mini{margin-top:12px;display:grid;gap:6px}
.item .mini div{display:flex;gap:10px;font-size:14px;padding:6px 10px;border-radius:8px;background:var(--panel2);border:1px solid transparent}
.item .mini div b{font-family:var(--mono);color:var(--accent)}
.item .mini div.right{border-color:var(--ok);background:var(--okbg)}
.item .mini small{display:block;color:var(--muted);font-size:12px}
.item .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.item .acts .btn{padding:5px 12px;font-size:13px}
mark{background:var(--warnbg);color:var(--warn);border-radius:3px;padding:0 1px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-family:var(--mono);font-size:30px;color:var(--dim);margin-bottom:8px}
/* exam */
.setup{display:grid;gap:16px;max-width:620px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.timer{font-family:var(--mono);font-size:22px;color:var(--accent);letter-spacing:.05em}
.timer.low{color:var(--bad);animation:pulse 1s infinite}
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:120px;height:120px}
.big-n{font-family:var(--mono);font-size:40px;font-weight:700}
.pass{color:var(--ok)}.fail{color:var(--bad)}
table.cat{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
table.cat td,table.cat th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
table.cat th{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em}
table.cat td.n{font-family:var(--mono);text-align:right}
.note{font-size:12.5px;color:var(--muted)}
footer{padding:30px 0 40px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);color:var(--text);padding:9px 16px;border-radius:10px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.ovl{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:20px;width:min(460px,100%);display:grid;gap:14px}
.dlg p{margin:0}
.dlg textarea{width:100%;height:150px;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--mono);font-size:12px;resize:vertical}
.dlg .navrow{margin-top:0;justify-content:flex-end}
@media (max-width:640px){header{position:static}.brand small{display:none}.kpis{margin-left:0;width:100%}.kpi{padding:3px 8px}.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}.chip{white-space:nowrap}.hbar{gap:10px}}
.lang-zh .en-only{display:none}.lang-en .zh-only{display:none}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hbar">
      <div class="brand">
        <span class="live" aria-hidden="true"></span>
        <span class="logo">CSA//312-39</span>
        <div><h1>SOC 分析師題庫訓練台</h1><small>CERTIFIED SOC ANALYST · 200 Q · BILINGUAL</small></div>
      </div>
      <div class="kpis" id="kpis"></div>
      <button class="iconbtn" id="themeBtn" title="切換深淺色">深／淺色</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap">
  <div class="toolbar" id="toolbar">
    <div class="search"><span>&gt;_</span><input id="q" type="search" placeholder="關鍵字搜尋（中英皆可，例如 4624、DMZ、勒索軟體、#57）" autocomplete="off"></div>
    <div class="seg" id="langSeg" title="顯示語言">
      <button data-v="both">中英對照</button><button data-v="zh">中文</button><button data-v="en">English</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="view"></div>
</main>
<footer>EC-Council 312-39 Certified SOC Analyst · 練習紀錄儲存在本機瀏覽器</footer>
<div class="toast" id="toast"></div>
<div class="ovl" id="ovl" hidden><div class="dlg" role="dialog" aria-modal="true"><p id="dlgMsg"></p><textarea id="dlgTxt" hidden></textarea><div class="navrow"><button class="btn" id="dlgCancel">取消</button><button class="btn pri" id="dlgOk">確定</button></div></div></div>

<script>
const DATA = [{"n":1,"c":"log","q":"David is a SOC analyst responsible for monitoring critical infrastructure. He detects unauthorized applications running on a high-privilege Windows server accessible only by a restricted set of users. The applications were not part of approved deployments, and installations occurred outside business hours. Logs indicate potential system configuration changes around the same timeframe. Which log should he examine to determine when and how these installations occurred?","o":["Security event log","System event log","Setup event log","Application event log"],"a":2,"e":"The Setup event log is the most relevant Windows log for installation activity because it captures events related to software installation, servicing, and setup operations. For unauthorized application installs, the SOC needs timing, installer context, and evidence of package deployment or configuration changes driven by setup processes. The Setup log can contain MSI and update-related events, component installation records, and indications of system changes tied to installation workflows. The Security log is crucial for attribution (logons, privilege use, process creation if enabled), but it is not specifically focused on installer actions and may not capture full installation details unless advanced auditing is configured. The System log focuses on OS-level service and driver events (boot, service start/stop, hardware/driver issues) and may show related changes but is not the primary installation record. The Application log captures events written by applications themselves, which is inconsistent for installer tracing. In SOC practice, analysts often combine Setup log evidence with Security log context (who logged on, elevated rights, process lineage) and endpoint telemetry to identify the actor and technique, but the best single log for “when and how installs occurred” among these options is the Setup event log.","zq":"David 是負責監控關鍵基礎設施的 SOC 分析師。他發現一台僅限少數使用者存取的高權限 Windows 伺服器上執行著未經授權的應用程式，這些程式不在核准部署清單中，且安裝時間在非上班時段；日誌也顯示同一時段可能有系統設定變更。他應檢查哪一個日誌來判斷這些安裝「何時、如何」發生？","zo":["安全性（Security）事件日誌","系統（System）事件日誌","安裝（Setup）事件日誌","應用程式（Application）事件日誌"],"ze":"Setup 日誌專門記錄軟體安裝、更新（MSI、Windows Update、元件安裝）等作業，最能回答「何時、如何安裝」。Security 日誌偏向歸因（誰登入、提權、行程建立），System 日誌記錄服務與驅動程式事件，Application 日誌則由各應用程式自行寫入、不一致。實務上會以 Setup 日誌為主，再搭配 Security 日誌與端點遙測找出行為者。"},{"n":2,"c":"ir","q":"Sarah Chen works as a security analyst at Midwest Financial. At 2:00 AM, the SOC detects unusual data exfiltration patterns and evidence of lateral movement across multiple servers containing sensitive customer data. The activity appears sophisticated and may require forensic analysis and system restoration. Which team should take primary responsibility for managing this complex security incident?","o":["Threat intelligence team","Incident response team (IRT)","Security engineering team","SOC team"],"a":1,"e":"The Incident Response Team (IRT) should take primary responsibility because the scenario describes an active, complex incident involving lateral movement and likely data exfiltration across sensitive systems, requiring coordinated containment, investigation, and recovery. The SOC often detects and initially triages incidents, but when severity and complexity increase—especially with potential data breach implications—\nIRT leadership is critical to coordinate cross-functional actions: containment steps, evidence preservation, forensics, remediation, system restoration, stakeholder communications, and regulatory considerations. Threat intelligence supports context (adversary patterns, IoCs/TTPs) but does not run response operations. Security engineering provides remediation support (hardening, patching, segmentation) but typically does not manage incident command and coordination. The SOC continues to support with monitoring, telemetry analysis, and detection tuning, but the IRT is the operational owner for managing the incident lifecycle end-to-end. In mature incident response, the IRT also ensures proper documentation, decision logging, and alignment with legal/compliance requirements—especially important when sensitive customer data and potential breach notification obligations are involved.","zq":"Sarah Chen 是 Midwest Financial 的資安分析師。凌晨 2 點，SOC 偵測到異常的資料外洩模式，以及在多台存放敏感客戶資料的伺服器之間橫向移動的跡象。此活動手法成熟，可能需要鑑識分析與系統復原。應由哪個團隊主責處理這起複雜資安事件？","zo":["威脅情報團隊","事件應變團隊（IRT）","資安工程團隊","SOC 團隊"],"ze":"事件已涉及橫向移動與疑似資料外洩，需要協調圍堵、鑑識、根除、復原、利害關係人溝通與法遵考量，這是 IRT 的主責範圍。SOC 負責偵測與初步分級，情資團隊提供背景，資安工程提供補強支援，但事件指揮應由 IRT 負責。"},{"n":3,"c":"siem","q":"Which of the following factors determine the choice of SIEM architecture?","o":["SMTP Configuration","DHCP Configuration","DNS Configuration","Network Topology"],"a":3,"e":"The choice of SIEM architecture is influenced by several factors that impact how the SIEM system willcollect, manage, and analyze data. Among the options provided, Network Topology is the most relevant factor. It determines the layout of the network, including the arrangement of nodes and the connections between them, which directly affects how the SIEM system will be integrated into the environment. A well-designed network topology ensures that the SIEM system can efficiently collect and correlate data from across the network.\nSMTP Configuration, DHCP Configuration DNS Configuration , and are related to specific services and protocols that may be monitored by a SIEM, but they do not determine the choice of SIEM architecture itself.","zq":"下列哪一項因素會決定 SIEM 架構的選擇？","zo":["SMTP 設定","DHCP 設定","DNS 設定","網路拓撲"],"ze":"網路拓撲決定節點配置與連線方式，直接影響 SIEM 收集器的部署位置、資料流向與關聯能力，是選擇 SIEM 架構的關鍵因素。SMTP、DHCP、DNS 只是 SIEM 可能監控的服務，不會決定架構本身。"},{"n":4,"c":"log","q":"Harley is working as a SOC analyst with Powell Tech. Powell Inc. is using Internet Information Service (IIS) version 7.0 to host their website.\nWhere will Harley find the web server logs, ifhe wants to investigate them for any anomalies?","o":["%SystemDrive%\\inetpub\\logs\\LogFiles\\W3SVCN","%SystemDrive%\\LogFiles\\inetpub\\logs\\W3SVCN","%SystemDrive%\\LogFiles\\logs\\W3SVCN","%SystemDrive%\\inetpub\\LogFiles\\logs\\W3SVCN"],"a":0,"e":"For InternetInformation Service (IIS) version 7.0, the default location for web server logs is in the directory %SystemDrive%\\inetpub\\logs\\LogFiles. Within this directory, you will find subfolders named W3SVCN, where N is a number that corresponds to the site ID of the IIS instance. These folders contain the log files for each website hosted on the server. Harley, as a SOC analyst, can investigate these logs for any anomalies by accessing this path.","zq":"Harley 是 Powell Tech 的 SOC 分析師，公司使用 IIS 7.0 架設網站。若他要調查 Web 伺服器日誌中的異常，應到哪個路徑尋找？","zo":["%SystemDrive%\\inetpub\\logs\\LogFiles\\W3SVCN","%SystemDrive%\\LogFiles\\inetpub\\logs\\W3SVCN","%SystemDrive%\\LogFiles\\logs\\W3SVCN","%SystemDrive%\\inetpub\\LogFiles\\logs\\W3SVCN"],"ze":"IIS 7.0 以後預設日誌位於 %SystemDrive%\\inetpub\\logs\\LogFiles，其下以 W3SVC + 網站 ID（N）命名子資料夾，每個網站各自一個資料夾。"},{"n":5,"c":"siem","q":"Which of the following stage executed after identifying the required event sources?","o":["Identifying the monitoring Requirements","Defining Rule for the Use Case","Implementing and Testing the Use Case","Validating the event source against monitoring requirement"],"a":1,"e":"After identifying the required event sources in a Security Operations Center (SOC) process, the next stage is to define rules for the use case. This involves specifying the criteria or conditions that will trigger alerts or actions based on the data received from the identified event sources. It is a critical step in ensuring that the SOC can effectively monitor and respond to security events.","zq":"在確認所需的事件來源之後，下一個執行的階段是什麼？","zo":["確認監控需求","為使用案例定義規則","實作並測試使用案例","依監控需求驗證事件來源"],"ze":"SIEM 使用案例（Use Case）開發流程：確認監控需求 → 確認事件來源 → 驗證事件來源 → 定義規則 → 實作與測試。題庫答案為「定義規則」：有了事件來源後，就要訂定觸發告警的條件與邏輯。"},{"n":6,"c":"cloud","q":"A multinational cybersecurity firm wants to enhance its threat intelligence capabilities by integrating real-time threat feeds into Microsoft Sentinel. These feeds include malicious IPs, domains, file hashes, and attack patterns. The firm requires a standardized protocol that allows automated threat intelligence sharing so Sentinel continuously receives updated indicators from external sources in a structured format. Which Microsoft Sentinel data connector should be implemented to integrate threat intelligence feeds using an industry-standard protocol?","o":["Threat Intelligence Platforms data connector","Syslog connector","TAXII data connector","Microsoft Defender for Cloud (Legacy) connector"],"a":2,"e":"TAXII (Trusted Automated eXchange of Indicator Information) is an industry-standard protocol for automated threat intelligence transport, commonly used alongside STIX-formatted threat data. The question explicitly requires a standardized protocol to automate sharing and continuously import structured threat indicators into Sentinel. The TAXII data connector is designed for this purpose: it enables pulling indicator data from TAXII servers so that malicious IPs, domains, and hashes can be ingested and used in detection and enrichment workflows. Syslog is a logging transport protocol for device and system logs, not threat intel sharing. Microsoft Defender for Cloud (Legacy) is unrelated to ingesting external threat feeds via a standardized intel protocol. The “Threat Intelligence Platforms” connector can be used to integrate certain TI sources, but the question specifically calls out using an industry-standard protocol for automated sharing, which is TAXII. From a SOC analyst perspective, using TAXII supports consistent ingestion, reduces manual indicator handling, and improves correlation by allowing Sentinel analytics rules and playbooks to leverage the latest indicators at scale.","zq":"一家跨國資安公司想把即時威脅情資（惡意 IP、網域、檔案雜湊、攻擊模式）整合進 Microsoft Sentinel，並需要一個標準化協定來自動分享情資，讓 Sentinel 以結構化格式持續接收外部來源更新的指標。應使用哪一個 Sentinel 資料連接器？","zo":["Threat Intelligence Platforms 資料連接器","Syslog 連接器","TAXII 資料連接器","Microsoft Defender for Cloud（Legacy）連接器"],"ze":"TAXII（Trusted Automated eXchange of Indicator Information）是自動化傳遞威脅情資的業界標準協定，通常搭配 STIX 格式。題目強調「業界標準協定」，因此選 TAXII 連接器。Syslog 是日誌傳輸協定，Defender for Cloud 與外部情資無關。"},{"n":7,"c":"net","q":"Identify the password cracking attempt involving a precomputed dictionary of plaintext passwords and their corresponding hash values to crack the password.","o":["Dictionary Attack","Rainbow Table Attack","Bruteforce Attack","Syllable Attack"],"a":1,"e":"A Rainbow Table Attack involves using a precomputed table of hash values for every possiblecombination of characters for a given password policy. This table, known as a rainbow table, is then used to look up the corresponding plaintext password for a given hash value. The process involves the following steps:\nPrecomputation: Generate therainbow table by computing hash values for all possible password combinations according to the password policy.\nStorage: Store these precomputed hash values in a table, associating each with its plaintext password.\nLookup: When a hash value is obtained during a password cracking attempt, search the rainbow table for the corresponding plaintext password.\nMatch: If a match is found, the plaintext password associated with the hash value is the cracked password.\nRainbow tables are effective because they trade storage space for time, allowing for quicker password cracking compared to brute-force or dictionary attacks, which compute hash values on the fly.","zq":"使用「預先計算好的明文密碼與其對應雜湊值字典」來破解密碼，屬於哪一種攻擊？","zo":["字典攻擊","彩虹表攻擊","暴力破解攻擊","音節攻擊"],"ze":"彩虹表（Rainbow Table）預先計算大量明文與雜湊對應，取得雜湊後直接查表，以儲存空間換取時間。字典與暴力破解都是即時計算雜湊。防禦方式是加鹽（salt）。"},{"n":8,"c":"net","q":"Identify the attack in which the attacker exploits a target system through publicly known but still unpatched vulnerabilities.","o":["Slow DoS Attack","DHCP Starvation","Zero-Day Attack","DNS Poisoning Attack"],"a":2,"e":"A Zero-Day Attack refers to the exploitation of a publicly known but still unpatched vulnerability. This type of attack occurs when attackers take advantage of a security weakness for which a fix or patch has not yet been released by the vendor. The term “zero-day” refers to the fact that the developers have “zero days” to fix the issue because it has already been exploited in the wild. These attacks are particularly dangerous because they occur before the vulnerability is widely known, giving attackers theopportunity to exploit systems while they are still vulnerable.","zq":"攻擊者利用「已公開但尚未修補」的弱點入侵目標系統，屬於哪一種攻擊？","zo":["慢速 DoS 攻擊","DHCP 耗盡攻擊","零時差（Zero-Day）攻擊","DNS 汙染攻擊"],"ze":"題庫答案為零時差攻擊：在廠商釋出修補前即被利用的弱點。嚴格定義上零時差多指「尚未公開」的弱點，但本題庫將「已知但未修補」歸於此類，考試時請依題庫答案作答。"},{"n":9,"c":"cloud","q":"A financial institution's SIEM is generating a high number of false positives, causing alert fatigue among SOC analysts. To reduce this burden and improve threat detection accuracy, the organization integrates AI capabilities into the SIEM. After implementation, the SOC team observes a significant decrease in redundant alerts, along with faster detection of genuine threats. Which AI capability contributed to this improvement?","o":["Dynamic rule optimization","Rule validation and testing","Automated rule generation","Data integration enhancement"],"a":0,"e":"Dynamic rule optimization best explains a reduction in false positives and redundant alerts after adding AI to a SIEM. In SOC operations, alert fatigue often comes from static thresholds, overly broad correlations, and detections that don’t adapt to changing baselines (new business apps, seasonal activity, infrastructure changes). AI-driven dynamic optimization can tune thresholds, suppress noisy patterns, and adjust scoring based on context (user role, device posture, known maintenance windows, historical behavior). This reduces duplicate/low-value alerts while preserving or improving sensitivity for real threats, which aligns with “decrease in redundant alerts” and “faster detection of genuine threats.” Rule validation/testing improves quality but is usually a manual or pre-deployment activity, not a continuous adaptive capability. Automated rule generation might create new detections, but it doesn’t inherently reduce noise unless paired with tuning. Data integration enhancement improves coverage and correlation, but by itself it can increase alerts if not tuned. The described outcome—less noise, better precision, quicker true detection—matches adaptive tuning and optimization of detections over time, which is dynamic rule optimization.","zq":"某金融機構的 SIEM 產生大量誤報，造成分析師告警疲勞。導入 AI 功能後，重複告警明顯減少，真實威脅也更快被偵測。是哪一項 AI 能力帶來這個改善？","zo":["動態規則最佳化","規則驗證與測試","自動產生規則","資料整合強化"],"ze":"動態規則最佳化能依環境基準、情境（使用者角色、維護時段、歷史行為）持續調整門檻與評分，壓低雜訊又保留敏感度。規則驗證偏向部署前的手動作業；自動產生規則未必降噪；資料整合反而可能增加告警。"},{"n":10,"c":"ops","q":"A large financial services company has experienced increasing sophisticated threats targeting critical assets. The SOC primarily focuses on log collection and basic monitoring, but incidents revealed gaps in detecting and responding to advanced threats proactively. Management decides to adopt the SOC Capability Maturity Model (CMM). The initial assessment indicates the SOC is at Level 1, and the organization aims to reach Level 3 by enhancing incident response procedures, improving threat intelligence integration, establishing KPIs, automating triage, implementing behavior-based analytics, and creating continuous training. Based on the SOC CMM, what should be the first priority in transitioning from Level 1 to Level 3?","o":["Outsourcing SOC operations to an MSSP","Deploying advanced deception technologies","Establishing well-defined and repeatable incident response processes","Implementing AI-driven automation for real-time detection and response"],"a":2,"e":"Moving from a low-maturity SOC to a more capable, repeatable operation requires a stable operational foundation before advanced technology layers. Establishing well-defined and repeatable incident response processes is the correct first priority because it creates consistency in how alerts are triaged, escalated, contained, investigated, and documented. At Level 1, organizations often operate ad hoc: inconsistent handoffs, unclear severity criteria, and weak documentation. Without standardized processes and playbooks, adding AI automation or deception technologies can amplify confusion or trigger disruptive actions based on poorly understood signals. Repeatable IR processes also enable measurement—KPIs like MTTA/MTTR, false positive rates, and containment effectiveness—which is essential to progress to Level 3 maturity. Threat intelligence integration and behavior analytics become far more effective when the SOC has defined workflows to consume intelligence, update detections, and execute response steps predictably. Outsourcing is a resourcing model choice rather than a maturity prerequisite. Therefore, the first step is building structured, documented, consistently executed incident response procedures that create the platform for tuning, automation, and advanced analytics.","zq":"一家大型金融公司面臨日益精密的攻擊。SOC 目前只做日誌收集與基本監控。管理層採用 SOC 能力成熟度模型（CMM），評估結果為 Level 1，目標是 Level 3。從 Level 1 邁向 Level 3，第一優先應做什麼？","zo":["將 SOC 外包給 MSSP","部署進階欺敵技術","建立明確且可重複執行的事件應變流程","導入 AI 驅動的即時偵測與回應自動化"],"ze":"低成熟度 SOC 的問題在於作業臨時性、交接不一致。先建立標準化、可重複的事件應變流程與劇本，才能量測 KPI（MTTA/MTTR）並在其上疊加自動化與進階分析。沒有流程就導入 AI 或欺敵技術，只會放大混亂。"},{"n":11,"c":"hunt","q":"In which phase of Lockheed Martin's – Cyber Kill Chain Methodology, adversary creates a deliverable malicious payload using an exploit and a backdoor?","o":["Reconnaissance","Delivery","Weaponization","Exploitation"],"a":2,"e":"In the Lockheed Martin Cyber Kill Chain Methodology, the phase where an adversary creates a deliverable maliciouspayload using an exploit and a backdoor is known as the Weaponization phase. This is the second stage of the Cyber Kill Chain, which occurs after the initial Reconnaissance phase. During Weaponization, the attacker prepares a malicious payload that is designed to exploit vulnerabilities in the target system. This payload often includes a backdoor to allow for persistent access to the compromised system.\nThe Weaponization phase involves the creation of malware tailored to the target’s specific vulnerabilities discovered during Reconnaissance. The attacker uses this malware to create a weaponized deliverable, which can be transmitted to the target during the subsequent Delivery phase of the Cyber Kill Chain.","zq":"在洛克希德・馬丁的網路殺傷鏈（Cyber Kill Chain）中，攻擊者在哪個階段利用漏洞利用程式與後門製作可投遞的惡意酬載？","zo":["偵察（Reconnaissance）","投遞（Delivery）","武器化（Weaponization）","漏洞利用（Exploitation）"],"ze":"殺傷鏈七階段：偵察 → 武器化 → 投遞 → 漏洞利用 → 安裝 → 命令與控制 → 目標行動。武器化即把 exploit 與 backdoor 組合成可投遞的酬載（例如惡意文件）。"},{"n":12,"c":"cti","q":"A SOC team is implementing a threat intelligence strategy to proactively defend against threats. The CISO emphasizes that collecting data is not enough; the team must allocate personnel, tools, and time to gather intelligence aligned with key concerns (fraud, phishing, nation-state threats). They must determine who will collect intelligence, which sources will be monitored, and how frequently collection occurs. What is this process called?","o":["Resources","Tasking","High-level requirements","Prioritization"],"a":1,"e":"Tasking is the CTI process step where defined intelligence requirements are translated into concrete collection assignments. It answers “who does what, using which sources, and on what schedule.” In practice, tasking allocates analysts, tools, and time to monitor selected feeds, communities, reporting channels, telemetry sources, and partner information based on the organization’s priorities. This ensures intelligence collection is deliberate and aligned with business risks rather than random or purely volume-driven. “High-level requirements” define what intelligence is needed and why; “prioritization” determines which requirements matter most; “resources” describes availability but not the act of assignment and execution. The scenario explicitly describes assigning responsibility and frequency of monitoring, which is the operationalization of intelligence requirements—tasking. From a SOC perspective, proper tasking improves intelligence relevance, reduces wasted effort, and ensures timely delivery of actionable insights that feed into detections, investigations, and strategic planning.","zq":"SOC 團隊正在建立威脅情報策略。CISO 強調光收集資料不夠，必須分配人員、工具與時間，針對重點議題（詐騙、網釣、國家級威脅）收集情資，並決定誰來收集、監控哪些來源、多久收集一次。這個過程稱為？","zo":["資源（Resources）","任務分派（Tasking）","高層需求（High-level requirements）","優先排序（Prioritization）"],"ze":"Tasking 是把情資需求轉成具體的收集任務：誰負責、用哪些來源、多久一次。高層需求定義「要什麼情資、為什麼」；優先排序決定先後；資源只描述可用量，不涉及分派與執行。"},{"n":13,"c":"hunt","q":"As a Threat Hunter at a cybersecurity company, you notice several endpoints experiencing unusual outbound traffic to an unfamiliar IP address. The traffic is encrypted and occurs in small bursts at irregular intervals. There are no known IoCs associated with the destination, and traditional security tools have not flagged it as malicious. You decide to launch a threat-hunting initiative to determine whether this is an advanced persistent threat (APT) using sophisticated techniques to evade detection. The goal is to identify potential Indicators of Attack (IoAs) and map them against known adversary behaviors. What type of threat hunting approach is best suited for this situation?","o":["Unstructured hunting","Situational or entity-driven hunting","Reactive hunting","Structured hunting"],"a":0,"e":"Unstructured hunting is best suited when you have a weak but concerning signal (like unusual encrypted bursts to an unfamiliar IP) without a clear hypothesis tied to a known technique or indicator. In this scenario, there are no known IoCs and no alert from traditional tools, so the hunt starts from an intuition-driven anomaly and develops into hypotheses through exploration: examining which hosts are involved, what processes initiate connections, whether destinations vary, whether the behavior aligns with legitimate business tooling, and whether there are associated persistence or credential access signals. This is characteristic of unstructured hunts—analyst-driven exploration based on suspicious observations. Structured hunting typically starts with a defined hypothesis or known adversary behavior mapped to a framework and uses planned queries to confirm or refute it. Situational/entity-driven hunting focuses on a specific entity (a VIP user, crown-jewel server) or a known incident context. Reactive hunting is driven by alerts or confirmed incidents. Here, the hunt is prompted by an anomaly without predefined IoCs or alerts, making unstructured hunting the most appropriate approach to uncover IoAs and then map findings to adversary behaviors.","zq":"身為威脅獵人，你發現多台端點以不規則間隔、小量爆發的方式向陌生 IP 傳送加密流量。目的地沒有已知 IoC，傳統工具也未告警。你想找出可能的攻擊指標（IoA）並對照已知攻擊者行為。最適合哪一種獵捕方式？","zo":["非結構化獵捕","情境／實體驅動獵捕","被動（反應式）獵捕","結構化獵捕"],"ze":"沒有明確假說、沒有 IoC、只有可疑異常時，由分析師從異常出發探索並逐步形成假說，就是非結構化獵捕。結構化獵捕以既定假說或 ATT&CK 技術為起點；實體驅動聚焦特定高價值對象；反應式獵捕由告警或已確認事件觸發。"},{"n":14,"c":"cti","q":"A security analyst in a multinational corporation’s Threat Intelligence team is tasked with enhancing detection of stealthy malware infections. During an investigation, the analyst observes an unusually high volume of DNS requests directed toward domains that follow patterns commonly associated with Domain Generation Algorithms (DGAs). Recognizing that these automated domain queries could indicate malware attempting to establish communication with command-and-control (C2) infrastructure, the analyst realizes existing detection may be insufficient. The security team needs to define intelligence requirements, including identifying critical data sources, refining detection criteria, and improving monitoring strategies. Which stage of the Cyber Threat Intelligence (CTI) process does this align with?","o":["Automated tool","Requirement analysis","Filtering CTI","Intelligence buy-in"],"a":1,"e":"This scenario aligns with requirement analysis because the team is defining what intelligence is needed and how it should be collected and used. The analyst has observed a problem (possible DGA-based malware activity) and recognizes gaps in current detection. The next step in a CTI lifecycle is to translate that concern into actionable intelligence requirements: which telemetry sources are necessary (DNS logs, proxy logs, endpoint telemetry, threat intel on DGA families), what questions must be answered (which hosts, what domains, what patterns, what time windows), and what success criteria look like (detection thresholds, false positive tolerance, enrichment needs). This is the “direction” phase of CTI, where priorities are set and collection needs are specified to ensure intelligence efforts align to threats that matter. “Filtering CTI” would be about reducing noise in collected intelligence or refining feeds after collection. “Intelligence buy-in” is stakeholder alignment and program support, not the analytic definition of requirements. “Automated tool” is not a CTI lifecycle stage. From a SOC perspective, requirement analysis is critical to turn observations into structured detection and hunting objectives that can be measured and improved.","zq":"情資團隊分析師發現大量 DNS 查詢指向符合 DGA（網域產生演算法）模式的網域，懷疑是惡意程式嘗試連線 C2，且現有偵測不足。團隊需要定義情資需求，包括關鍵資料來源、偵測條件與監控策略。這對應 CTI 流程的哪個階段？","zo":["自動化工具","需求分析","過濾 CTI","情資支持（Buy-in）"],"ze":"把觀察到的問題轉化為「需要哪些資料、要回答什麼問題、成功標準為何」，是 CTI 生命週期的方向／需求分析階段。過濾 CTI 屬收集後降噪；Buy-in 是取得利害關係人支持；自動化工具不是階段。"},{"n":15,"c":"hunt","q":"During routine monitoring, the SIEM detects an unusual spike in outbound data transfer from a critical database server. The typical outbound traffic for this server is around 5 MB/hour, but in the past 10 minutes, it has sent over 500 MB to an external IP address. No predefined signatures match this activity, but the SIEM raises an alert due to deviations from the server’s normal behavior profile. Which detection method is responsible for this alert?","o":["Heuristic-based detection","Signature-based detection","Rule-based detection","Anomaly-based detection"],"a":3,"e":"This alert is generated because the activity deviates significantly from the server’s established baseline, which is the hallmark of anomaly-based detection. The SIEM is not matching a known signature (so it is not signature-based), and the prompt emphasizes “deviations from normal behavior profile,” which typically means statistical profiling, baselining, or behavior analytics detecting outliers in volume, timing, destination, or frequency. While rule-based detections can also trigger on thresholds, the question explicitly frames the logic as “normal behavior profile,” which implies adaptive baselines rather than a fixed rule alone. Heuristic detection refers to generalized patterns or suspicion scoring, but here the core mechanism is abnormality versus historical norms (5 MB/hour typical vs 500 MB in 10 minutes). From a SOC triage perspective, anomaly alerts require quick validation: confirm the external destination reputation/ownership, verify whether the transfer aligns with authorized jobs, check change tickets, and correlate with authentication/process activity on the database host. Anomaly-based detection is especially valuable for data exfiltration because attackers can avoid known signatures, but they often struggle to mimic normal data movement patterns at scale.","zq":"SIEM 偵測到某關鍵資料庫伺服器外傳流量暴增：平常約 5 MB/小時，過去 10 分鐘卻送出 500 MB 到外部 IP。沒有任何特徵碼吻合，SIEM 因偏離伺服器正常行為輪廓而告警。這是哪一種偵測方法？","zo":["啟發式偵測","特徵碼偵測","規則式偵測","異常偵測"],"ze":"關鍵字是「偏離正常行為輪廓」——以歷史基準比對離群值，即異常（Anomaly-based）偵測。沒有比對特徵，故非特徵碼偵測；題目強調的是行為基準而非固定規則。"},{"n":16,"c":"cti","q":"A mid-sized financial institution’s SOC is overwhelmed by thousands of daily alerts, many based on Indicators of Compromise (IoCs) such as suspicious IPs, hashes, and domains. These alerts lack context about whether they truly pose a threat. Analysts waste time on low-priority incidents while severe threats may be missed. The team lacks tools and intelligence to correlate IoCs with real-world threats, making prioritization difficult and causing alert fatigue. Which poses the greatest challenge in this environment?","o":["Malware-centric and CTI are not equivalent","Information overload","Budget and enterprise skill","Distinguishing IoC from CTI"],"a":3,"e":"The core problem described is that the SOC is treating raw indicators (IoCs) as if they are actionable intelligence (CTI), without enough context to prioritize. IoCs are often low-context, high-volume, and time-sensitive; many are noisy, shared infrastructure, or already outdated. CTI (cyber threat intelligence) adds context—adversary, campaign, intent, targeting, confidence, and recommended actions—so analysts can decide what matters for their environment. The scenario explicitly states the alerts “lack critical context” and the team “lacks tools and intelligence to correlate IoCs with real-world threats,” which is fundamentally a failure to distinguish IoC data from intelligence. Information overload is a symptom, but the underlying challenge is that the organization is ingesting IoCs without intelligence enrichment and prioritization logic. Budget/skill can contribute, but the question asks for the greatest challenge given the described conditions. From a SOC perspective, solving this requires enrichment (TI platforms, reputation + context), correlation with internal telemetry, scoring based on relevance, and focusing on behaviors and impact rather than indicator volume alone. Therefore, distinguishing IoC from CTI is the best answer.","zq":"某中型金融機構 SOC 每天被數千則基於 IoC（可疑 IP、雜湊、網域）的告警淹沒，這些告警缺乏情境，無法判斷是否真構成威脅，導致告警疲勞。此環境最大的挑戰是什麼？","zo":["以惡意程式為中心的做法與 CTI 不等同","資訊過載","預算與企業技能","無法區分 IoC 與 CTI"],"ze":"核心問題是把原始指標（IoC）當成可行動情資（CTI）。IoC 量大、情境少、時效短；CTI 會補上攻擊者、行動、意圖、可信度與建議行動。資訊過載只是症狀，根因是分不清 IoC 與 CTI、缺少情資豐富化與優先排序。"},{"n":17,"c":"log","q":"John, SOC analyst wants to monitor the attempt of process creation activities from any of their Windows endpoints.\nWhich of following Splunk query will help him to fetch related logs associated with process creation?","o":["index=windows LogName=Security EventCode=4678 NOT (Account_Name=*$) .. .. ... ..","index=windows LogName=Security EventCode=4688 NOT (Account_Name=*$) .. .. ..","index=windows LogName=Security EventCode=3688 NOT (Account_Name=*$) .. .. ..","index=windows LogName=Security EventCode=5688 NOT (Account_Name=*$) ... ... ..."],"a":1,"e":"In Windows Security event logs, EventCode 4688 signifies a process creation event. The query index=windows LogName=Security EventCode=4688 NOT (Account_Name=*$) fetches process creation activity; the NOT (Account_Name=*$) clause excludes machine/service accounts whose names end with a dollar sign.","zq":"SOC 分析師 John 想監控所有 Windows 端點的行程建立（process creation）活動。下列哪一個 Splunk 查詢可取得相關日誌？","zo":["index=windows LogName=Security EventCode=4678 NOT (Account_Name=*$) .. .. ... ..","index=windows LogName=Security EventCode=4688 NOT (Account_Name=*$) .. .. ..","index=windows LogName=Security EventCode=3688 NOT (Account_Name=*$) .. .. ..","index=windows LogName=Security EventCode=5688 NOT (Account_Name=*$) ... ... ..."],"ze":"Windows 安全性事件 4688 = 已建立新行程（A new process has been created）。NOT (Account_Name=*$) 用來排除以 $ 結尾的電腦／服務帳號。4678、3688、5688 都不是行程建立事件。"},{"n":18,"c":"hunt","q":"You are a Threat Hunter at a law firm that suffered a data breach where confidential documents were leaked. Using the Cyber Kill Chain framework, you trace the attacker’s steps: they bypassed MFA by masquerading as a legitimate user, moved laterally, accessed sensitive records from a shared repository, and exfiltrated data over an extended period. You must identify the Cyber Kill Chain phase at which the attack was identified, to strengthen defenses and detect intrusions before exfiltration occurs. At which phase was the attack identified?","o":["Delivery","Actions on objectives","Command and control (C2)","Exploitation"],"a":1,"e":"“Actions on objectives” is the Cyber Kill Chain phase where the attacker achieves their mission goals—such as data theft, disruption, or destruction. In the scenario, the attacker accessed sensitive client records and exfiltrated them over time, which directly represents the adversary achieving the objective of obtaining confidential data. Delivery and exploitation occur earlier (initial delivery of a payload or credential capture and then exploiting access). Command and control is the stage where compromised systems communicate with attacker infrastructure to receive instructions, which may occur during lateral movement and persistence but is not the final objective. The scenario emphasizes that the breach was discovered after the attacker had already accessed the sensitive repository and exfiltrated data, meaning detection happened at or after the mission impact stage. From a SOC improvement perspective, the lesson is that detections should shift “left” in the kill chain: detect credential abuse, anomalous authentication, lateral movement, and suspicious access to file shares before exfiltration. But given where the investigation found the attacker’s success, the correct phase is actions on objectives.","zq":"某律師事務所發生機密文件外洩。你以網路殺傷鏈回溯：攻擊者偽裝合法使用者繞過 MFA、橫向移動、從共用儲存庫存取敏感紀錄並長時間外傳資料。這起攻擊是在殺傷鏈的哪個階段被發現的？","zo":["投遞","目標行動（Actions on Objectives）","命令與控制（C2）","漏洞利用"],"ze":"攻擊者已存取並外傳資料，代表已達成任務目標，屬於最後的「目標行動」階段。檢討重點是讓偵測「左移」：在憑證濫用、異常驗證、橫向移動階段就攔截。"},{"n":19,"c":"cti","q":"Which of the following threat intelligence helps cyber securityprofessionals such as security operations managers, network operations center and incident responders to understand how the adversaries are expected to perform the attack on the organization, and the technical capabilities and goals of the attackers along with the attack vectors?","o":["Analytical Threat Intelligence","Operational Threat Intelligence","Strategic Threat Intelligence","Tactical Threat Intelligence"],"a":1,"e":"Operational Threat Intelligence is focused on the specifics of imminent orongoing attacks. It provides insights into the nature of the threat, the identity of the attackers (if known), their motivation, capabilities, and objectives, as well as the tactics, techniques, and procedures (TTPs) they are likely to use. This type of intelligence is crucial for security operations managers, network operations center personnel, and incident responders because it allows them to understand and anticipate the attackers’ moves, prepare specific defenses, and respond effectively to incidents.","zq":"哪一種威脅情報能幫助 SOC 主管、NOC 與事件應變人員了解攻擊者預期如何對組織發動攻擊，以及攻擊者的技術能力、目標與攻擊向量？","zo":["分析型威脅情報","營運型（Operational）威脅情報","策略型威脅情報","戰術型威脅情報"],"ze":"營運型情報聚焦特定、即將發生或進行中的攻擊：攻擊者身分、動機、能力、目標與攻擊方式，供事件應變與 SOC 主管使用。策略型給高階決策；戰術型著重 TTP；技術型著重 IoC。"},{"n":20,"c":"log","q":"Where will you find the reputation IP database, if you want to monitor traffic from known bad IP reputation using OSSIM SIEM?","o":["/etc/ossim/reputation","/etc/ossim/siem/server/reputation/data","/etc/siem/ossim/server/reputation.data","/etc/ossim/server/reputation.data"],"a":3,"e":"In OSSIM SIEM, the reputation IP database is a crucial component for monitoring traffic from known malicious IP addresses. The correct location of this database is:\n/etc/ossim/server/reputation.data: This directory and file name specify the location where the reputation database is stored. It contains the list of known bad IP addresses that the OSSIM system uses to monitor and identify potentially harmful traffic.\nPurpose of the Reputation Database: The database is used to compare incoming traffic against the list of known bad IPs. If a match is found, OSSIM can generate alerts or take predefined actions to mitigate the threat.\nUpdating the Database: It’s important to regularly update the reputation database to ensure it includes the latest threat intelligence. This helps maintain the effectiveness of the SIEM system in identifying and responding to threats.","zq":"若要在 OSSIM SIEM 中監控來自已知惡意 IP 的流量，信譽 IP 資料庫位於何處？","zo":["/etc/ossim/reputation","/etc/ossim/siem/server/reputation/data","/etc/siem/ossim/server/reputation.data","/etc/ossim/server/reputation.data"],"ze":"OSSIM 的 IP 信譽資料庫位於 /etc/ossim/server/reputation.data，系統會拿流量比對其中的惡意 IP 並產生告警，需定期更新以維持有效性。"},{"n":21,"c":"web","q":"Which of the following tool can be used to filter web requests associated with the SQL Injection attack?","o":["Nmap","UrlScan","ZAP proxy","Hydra"],"a":1,"e":"UrlScan is a security tool that screens all incoming requests to a server and filters these requests based on rules set by the administrator. It is particularly effective against SQL Injection attacks because it can block requests that appear to be malicious, such as those containing SQL syntax or certain keywords often used in SQL Injection.\nNmap is a network scanning tool, not specifically designed for filtering web requests. ZAP Proxy is an open-source web application security scanner, which is used for finding vulnerabilities in web applications but not specifically for filtering requests. Hydra is a password cracking tool, which again, is not used for filtering web requests.","zq":"下列哪一項工具可用來過濾與 SQL 注入攻擊相關的 Web 請求？","zo":["Nmap","UrlScan","ZAP proxy","Hydra"],"ze":"UrlScan 是 IIS 的安全過濾工具，可依管理員規則攔截含 SQL 語法或特定關鍵字的請求。Nmap 是掃描工具、ZAP 是弱點掃描代理、Hydra 是密碼破解工具。"},{"n":22,"c":"web","q":"Which of the following attack can be eradicated by converting all non-alphanumeric characters to HTML character entities before displaying the user input in search engines and forums?","o":["Broken Access Control Attacks","WebServices Attacks","XSS Attacks","Session Management Attacks"],"a":2,"e":"Converting all non-alphanumeric characters to HTML character entities is a common defense against Cross-Site Scripting (XSS) attacks. Here’s how it works:\nUser Input Sanitization: When user input is received, the system converts characters like <, >, &, ', and \" into their corresponding HTML entities (e.g., &lt;, &gt;, &amp;, &apos;, and &quot;).\nPreventing Script Execution: By converting these characters, the system prevents potentially malicious scripts from being executed in the browser of anyone viewing the content.\nMaintaining Data Integrity: This process allows user-generated content to be displayed without altering the intended message while ensuring the content cannot harm other users or the system.","zq":"在搜尋引擎或論壇顯示使用者輸入前，將所有非英數字元轉為 HTML 字元實體，可根除哪一種攻擊？","zo":["存取控制失效攻擊","Web Services 攻擊","XSS 攻擊","工作階段管理攻擊"],"ze":"把 < > & ' \" 轉為 &lt; &gt; 等實體（輸出編碼），可讓瀏覽器把輸入當文字而非程式碼執行，是防禦跨站腳本（XSS）的標準做法。"},{"n":23,"c":"web","q":"An attacker, in an attempt to exploit the vulnerability in the dynamically generated welcome page, inserted code at the end of the company’s URL as follows:\nhttp://technosoft.com.com/<script>alert(\"WARNING: The application has encountered an error\");<\/script>. Identify the attack demonstrated in the above scenario.","o":["Cross-site Scripting Attack","SQL Injection Attack","Denial-of-Service Attack","Session Attack"],"a":0,"e":"The attack demonstrated in the scenario is a Cross-site Scripting (XSS) attack. This is evident from the attacker’s action of inserting a <script> tag into the URL, which is a common technique used in XSS attacks to execute malicious scripts in the context of the victim’s browser. The script in the URL is designed to display an alert box with a warning message, which is a typical behavior of XSS to show that the attacker can execute JavaScript in the user’s browser session.","zq":"攻擊者為了利用動態產生的歡迎頁弱點，在公司網址後面加入：http://technosoft.com.com/<script>alert(\"WARNING: The application has encountered an error\");<\/script>。這是哪一種攻擊？","zo":["跨站腳本（XSS）攻擊","SQL 注入攻擊","阻斷服務攻擊","工作階段攻擊"],"ze":"在 URL 中注入 <script> 標籤並讓瀏覽器執行 alert，是典型的反射型 XSS，證明網站未對輸入做淨化與編碼。"},{"n":24,"c":"siem","q":"A financial services company implements a SIEM solution to enhance cybersecurity. Despite deployment, it fails to detect known attacks or suspicious activities. Although reports are generated, the team struggles to interpret them. Investigation shows that critical logs from firewalls, IDS, and endpoint devices are not reaching the SIEM. What is the reason the SIEM is not functioning as expected?","o":["Improper configuration or design of the SIEM deployment architecture","Lack of understanding of SIEM features and capabilities","Difficulty handling the volume of collected log data","Delays in log collection and analysis due to system performance issues"],"a":0,"e":"If critical logs are not reaching the SIEM, the most direct root cause is an architectural or configuration failure in the SIEM deployment. A SIEM’s detection capability depends on ingesting the right telemetry from key control points (network, endpoint, identity, cloud). Missing firewall, IDS, and endpoint logs creates blind spots that will prevent detections from firing, even for well-known attacks, because the SIEM simply lacks the required evidence. This commonly happens due to misconfigured collectors/agents, incorrect forwarding rules, blocked network paths, wrong ports/protocols, parsing failures, certificate/auth issues, or incomplete onboarding of data sources. While lack of SIEM knowledge can affect tuning and interpretation, it does not explain missing log delivery. Volume-handling issues typically show up as ingestion throttling, dropped events, or delayed indexing after logs are onboarded—not as a complete absence of critical sources. Performance delays can degrade detection timeliness, but again the scenario states the logs are not reaching the SIEM at all. From a SOC engineering standpoint, the first troubleshooting steps are data pipeline validation (connectivity, agent health, message counts), ingestion dashboards, and source-side forwarding verification. Therefore, improper configuration or deployment architecture is the correct reason.","zq":"某金融公司部署 SIEM 後仍偵測不到已知攻擊或可疑活動，團隊也難以解讀報表。調查發現防火牆、IDS 與端點的關鍵日誌根本沒有送到 SIEM。SIEM 無法正常運作的原因是？","zo":["SIEM 部署架構設定或設計不當","不了解 SIEM 的功能","難以處理大量日誌","系統效能造成日誌收集與分析延遲"],"ze":"關鍵日誌「沒有抵達」SIEM 是資料管線問題：代理程式、轉送規則、網路路徑、埠號、剖析或憑證設定錯誤。容量或效能問題通常表現為延遲或遺漏，而非完全收不到。應先驗證收集管線。"},{"n":25,"c":"ir","q":"If the SIEM generates the following four alerts at the same time:\nI.Firewall blocking traffic fromgetting into the network alerts\nII.SQL injection attempt alerts\nIII.Data deletion attempt alerts\nIV.Brute-force attempt alerts\nWhich alert should be given least priority as per effective alert triaging?","o":["III","IV","II","I"],"a":3,"e":"In the context of alert triaging within a Security Operations Center (SOC), the priority of alerts is typically determined based on the potential impact and urgency of the threat they represent.\nFirewall blocking traffic alerts indicate that the firewall iseffectively doing its job by blocking unwanted traffic. While it’s important to review these alerts to ensure legitimate traffic isn’t being blocked, they generally represent a lower priority because the immediate threat has been mitigated by the firewall.\nSQL injection attempt alerts are of high priority because they indicate an active attempt to exploit a security vulnerability in order to manipulate or steal data.\nData deletion attempt alerts also carry high priority as they could signify an attempt to remove or corrupt critical data, which could have significant impact on the availability and integrity of data.\nBrute-force attempt alerts are important as they may indicate an ongoing attempt to gain unauthorized access to systems. However, if the attempts are being blocked, these alerts may be of a slightly lower priority compared to an active exploit attempt like SQL injection.\nGiven these considerations, the alert for the firewall blocking traffic would generally be given the least priority, as it indicates a threat that has already been contained.","zq":"若 SIEM 同時產生以下四則告警：I. 防火牆阻擋外部流量進入網路；II. SQL 注入嘗試；III. 資料刪除嘗試；IV. 暴力破解嘗試。依有效的告警分級，哪一則優先順序最低？","zo":["III","IV","II","I"],"ze":"防火牆已成功阻擋的流量代表威脅已被控制，優先度最低。SQL 注入與資料刪除屬主動破壞或竊取嘗試，優先度高；暴力破解可能導致未授權存取，也需處理。"},{"n":26,"c":"ir","q":"Which of the following is a correct flow of the stages in an incident handling and response (IH&R) process?","o":["Containment –> Incident Recording –> Incident Triage –> Preparation –> Recovery –> Eradication –> Post-Incident Activities","Preparation –> Incident Recording –> Incident Triage –> Containment –> Eradication –> Recovery –> Post-Incident Activities","Incident Triage –> Eradication –> Containment –> Incident Recording –> Preparation –> Recovery –> Post-Incident Activities","Incident Recording –> Preparation –> Containment –> Incident Triage –> Recovery –> Eradication –> Post-Incident Activities"],"a":1,"e":"The correct flow of stages in an Incident Handling and Response (IH&R) process typically follows a structured approach that begins with Preparation, which is crucial for an effective response to incidents. This is followed by Incident Recording, where details of the incident are documented. Incident Triage is the next stage, where incidents are prioritized based on their impact. Containment strategies are then employed to limit the spread of the incident. Eradication involves removing the threat from the affected systems. Recovery is the process of restoring systems to normal operation. Finally, Post-Incident Activities involve learning from the incident and improving future response efforts.","zq":"下列何者是事件處理與回應（IH&R）流程正確的階段順序？","zo":["圍堵 → 事件記錄 → 事件分級 → 準備 → 復原 → 根除 → 事後活動","準備 → 事件記錄 → 事件分級 → 圍堵 → 根除 → 復原 → 事後活動","事件分級 → 根除 → 圍堵 → 事件記錄 → 準備 → 復原 → 事後活動","事件記錄 → 準備 → 圍堵 → 事件分級 → 復原 → 根除 → 事後活動"],"ze":"EC-Council IH&R 流程：準備 → 事件記錄與指派 → 事件分級（Triage）→ 通報 → 圍堵 → 證據蒐集與鑑識 → 根除 → 復原 → 事後活動。重點記住「準備最先、圍堵→根除→復原、事後活動最後」。"},{"n":27,"c":"log","q":"Identify the event severity level in Windows logs for the events that are not necessarily significant, but may indicate a possible future problem.","o":["Failure Audit","Warning","Error","Information"],"a":1,"e":"In the context of Windows logs, the event severity level that indicates events that are not necessarily significant but may point to a possible future problem is classified as a “Warning.” This level is used to log events that are not immediately harmful, such as an impending disk space shortage or other conditions that could potentially cause problems if not addressed.","zq":"Windows 日誌中，對於「不一定重要，但可能預示未來問題」的事件，其嚴重性等級為？","zo":["稽核失敗（Failure Audit）","警告（Warning）","錯誤（Error）","資訊（Information）"],"ze":"Warning 表示目前不一定造成影響、但可能演變成問題的事件，例如磁碟空間即將不足。Error 是已發生的重大問題；Information 是正常作業成功紀錄；Failure Audit 是稽核失敗事件。"},{"n":28,"c":"cloud","q":"A Security Operations Center (SOC) analyst receives a high-priority alert indicating unusual user activity. An employee account is attempting to access company resources from a different country and outside of their normal working hours. This behavior raises concerns about potential account compromise or unauthorized access. To automate the initial response and quickly restrict access while further investigating the incident, which SOAR playbook would be relevant to adapt and implement?","o":["Alert Enrichment SOAR Playbook","Deprovisioning Users SOAR Playbook","Malware Containment SOAR Playbook","Phishing Investigations SOAR Playbook"],"a":1,"e":"When there is a strong indication of account compromise (impossible travel, unusual geography, out-of-hours access to sensitive resources), the priority is to reduce attacker dwell time by immediately restricting the account’s ability to authenticate and access data. A “Deprovisioning Users” playbook aligns best with this objective because it is focused on access removal actions such as disabling the user, revoking active sessions, resetting credentials, invalidating refresh tokens, removing risky group memberships, and blocking sign-in until verification is complete. Alert enrichment is valuable, but it does not stop the threat; it only adds context. Malware containment is oriented toward endpoint isolation and malicious file/process containment, not identity-based risk. Phishing investigations is appropriate when the primary entry vector is suspected phishing and the goal is to analyze messages, URLs, and affected recipients, but it still may not provide the immediate identity lockdown needed. In SOC operations, identity compromise often demands rapid containment through account restriction first, followed by investigation to confirm legitimacy, determine scope, and safely restore access with stronger controls such as MFA and conditional access.","zq":"SOC 分析師收到高優先告警：某員工帳號在非上班時間從其他國家存取公司資源，疑似帳號遭盜用。為了自動化初步回應、在調查期間迅速限制存取，應採用哪一種 SOAR 劇本？","zo":["告警豐富化 SOAR 劇本","使用者撤銷權限（Deprovisioning Users）SOAR 劇本","惡意程式圍堵 SOAR 劇本","網路釣魚調查 SOAR 劇本"],"ze":"身分遭盜用時首要是縮短攻擊者停留時間：停用帳號、撤銷工作階段與權杖、重設憑證、封鎖登入，這正是 Deprovisioning Users 劇本的內容。豐富化只增加情境不阻止威脅；惡意程式圍堵針對端點；網釣調查針對郵件分析。"},{"n":29,"c":"siem","q":"An organization is implementing and deploying the SIEM with following capabilities.\nWhat kind of SIEM deployment architecture the organization is planning to implement?","o":["Cloud, MSSP Managed","Self-hosted, Jointly Managed","Self-hosted, Self-Managed","Self-hosted, MSSP Managed"],"a":2,"e":"The organization performs all SIEM functions (collection, aggregation, correlation, analytics, alerting, reporting, retention, visualization) itself on its own infrastructure, which is a Self-hosted, Self-Managed SIEM deployment.","zq":"某組織正在實作並部署具備下列能力的 SIEM（原題附圖列出 SIEM 各項功能皆由組織自行負責）。組織計畫採用哪一種 SIEM 部署架構？","zo":["雲端，MSSP 管理","自建，共同管理","自建，自行管理","自建，MSSP 管理"],"ze":"原題圖示中，收集、彙整、關聯、分析、告警、報表、保存、視覺化等所有功能都由組織自己負責，因此屬於「自建、自行管理（Self-hosted, Self-Managed）」。若部分功能交由 MSSP 則為共同管理；全交給 MSSP 則為 MSSP 管理。（此 PDF 文字版未含原圖）"},{"n":30,"c":"cloud","q":"Daniel Clark is a cybersecurity specialist in the Cloud SOC for a government agency. His team needs a security solution that can enforce access policies to prevent unauthorized access to cloud-based applications, monitor and restrict data sharing within SaaS, PaaS, and IaaS environments, ensure compliance with government regulations for data security and privacy, and apply security controls to prevent sensitive data exposure in the cloud. Which Cloud SOC technology is his team using?","o":["Cloud Access Security Broker (CASB)","Cloud Security Posture Management (CSPM)","Cloud Workload Protection Platform (CWPP)","Cloud-native anomaly detection"],"a":0,"e":"A Cloud Access Security Broker (CASB) is designed to provide visibility and policy enforcement for cloud application usage, especially in SaaS, and can extend controls across cloud services by monitoring access, enforcing data protection policies, and restricting risky sharing behaviors. The scenario emphasizes enforcing access policies, controlling data sharing, preventing sensitive data exposure, and supporting compliance—\nthese are core CASB outcomes. CSPM focuses on configuration security and posture management (misconfigurations, compliance checks, policy drift) across cloud infrastructure, but it does not primarily enforce user-level access and data sharing controls inside cloud apps. CWPP protects workloads (VMs, containers, serverless) with runtime protection, vulnerability management, and threat detection at the compute layer, which is different from governing access and data sharing across SaaS/PaaS/IaaS usage. Cloud-native anomaly detection is a capability rather than the governance and policy enforcement layer described. From a SOC perspective in regulated environments, CASB helps reduce data leakage risk via controls like DLP policies, session controls, shadow IT discovery, and conditional access enforcement—matching the requirements in the question.","zq":"Daniel 是政府機關雲端 SOC 的資安專家。團隊需要一套方案：強制存取政策以防止未授權存取雲端應用、監控並限制 SaaS/PaaS/IaaS 內的資料分享、確保符合政府資料安全與隱私法規、並防止敏感資料在雲端外洩。他們使用的是哪種雲端 SOC 技術？","zo":["雲端存取安全代理（CASB）","雲端安全態勢管理（CSPM）","雲端工作負載保護平台（CWPP）","雲原生異常偵測"],"ze":"CASB 位於使用者與雲端服務之間，提供可視性、存取控制、DLP、分享限制與影子 IT 探索，正符合題意。CSPM 著重設定錯誤與合規檢查；CWPP 保護 VM／容器等工作負載；異常偵測只是一種能力。"},{"n":31,"c":"web","q":"Identify the attack when an attacker by several trial and error can read the contents of a password file present in the restricted etc folder just by manipulating the URL in the browser as shown:\nhttp://www.terabytes.com/process.php./../../../../etc/passwd","o":["Directory Traversal Attack","SQL Injection Attack","Denial-of-Service Attack","Form Tampering Attack"],"a":0,"e":"Theattack described is a Directory Traversal Attack. This type of attack occurs when an attacker exploits vulnerabilities in a web application (or a web server’s software) to gain unauthorized access to files and directories that are stored outside of the web root folder. By manipulating variables that reference files with ..\n/ sequences (also known as dot-dot-slash), the attacker can move up the directory hierarchy and access files or directories that should be restricted. This can lead to information disclosure, such as reading sensitive files like /etc/passwd, which contains user password details in Unix-based systems.\nIn the given URL http://www.terabytes.com/process.php./../../../../etc/passwd, the attacker uses the ../ pattern to navigate up from the current directory where process.php resides, aiming to reach the root directory and then descend into the /etc/ directory to access the passwd file. This is a classic example of a Directory Traversal Attack.","zq":"攻擊者經過多次嘗試，只透過在瀏覽器修改 URL 就讀到受限 /etc 目錄中的密碼檔：http://www.terabytes.com/process.php./../../../../etc/passwd。這是哪一種攻擊？","zo":["目錄穿越攻擊","SQL 注入攻擊","阻斷服務攻擊","表單竄改攻擊"],"ze":"使用 ../（dot-dot-slash）往上層目錄移動，存取 Web 根目錄以外的檔案（如 /etc/passwd），就是目錄穿越（Directory/Path Traversal）。"},{"n":32,"c":"ir","q":"Emmanuel is working as a SOC analyst in a company named Tobey Tech. The manager of Tobey Tech recently recruited an Incident Response Team (IRT) for his company. In the process of collaboration with the IRT, Emmanueljust escalated an incident to the IRT.\nWhat is the first step that the IRT will do to the incident escalated by Emmanuel?","o":["Incident Analysis and Validation","Incident Recording","Incident Classification","Incident Prioritization"],"a":0,"e":"When an incident is escalated to the Incident Response Team (IRT), the first step they undertake is Incident Analysis and Validation. This step is crucial to ensure that the incident is genuine and to understand its nature and scope. The IRT will analyze the information provided by the SOC analyst, validate the incident against known patterns or indicators of compromise, and gather additional information if necessary. This initial analysis helps in determining the severity of the incident and guides the subsequent steps in the incident response process.","zq":"Emmanuel 是 Tobey Tech 的 SOC 分析師，公司剛成立事件應變團隊（IRT）。Emmanuel 將一起事件升級給 IRT。IRT 對這起事件做的第一步是什麼？","zo":["事件分析與驗證","事件記錄","事件分類","事件優先排序"],"ze":"IRT 接手後第一件事是分析並驗證事件是否屬實、了解性質與範圍，之後才進行分類與排序。"},{"n":33,"c":"log","q":"Chloe, a SOC analyst with Jake Tech, is checking Linux systems logs. She is investigating files at /var/log/ wtmp.\nWhat Chloe is looking at?","o":["Error log","System boot log","General message and system-related stuff","Login records"],"a":3,"e":"The /var/log/wtmp file in Linux systems is used to record all logins and logouts. The wtmp file is a binary file that can be read with tools like last, which can display the login history of all users or a specific user, as well as the times of system reboots and shutdowns. SOC analysts, like Chloe, would inspect this file to track user activities and investigate potential unauthorized access or other security incidents.","zq":"Jake Tech 的 SOC 分析師 Chloe 正在檢查 Linux 系統日誌，調查 /var/log/wtmp 檔案。她看的是什麼？","zo":["錯誤日誌","系統開機日誌","一般訊息與系統相關資訊","登入紀錄"],"ze":"/var/log/wtmp 是二進位檔，記錄所有登入、登出、重新開機紀錄，可用 last 指令讀取。對照：/var/log/btmp 記錄失敗登入、/var/log/messages 為一般系統訊息、/var/log/boot.log 為開機日誌。"},{"n":34,"c":"web","q":"Which of the following attack can be eradicated by using a safe API to avoid the use of the interpreter entirely?","o":["CommandInjection Attacks","SQL Injection Attacks","File Injection Attacks","LDAP Injection Attacks"],"a":0,"e":"Command Injection Attacks involve the insertion of malicious code into a vulnerable application, which then executes unwanted system commands onthe server. The fundamental cause of this vulnerability is the application's use of input data in constructing system commands without proper validation or encoding. Utilizing a safe API that avoids the use of the interpreter entirely can effectively mitigate this risk by ensuring that commands are executed in a controlled manner, without directly passing user input to the system shell. Safe APIs typically provide predefined functions and methods that perform the required tasks in a secure way, eliminatingthe need to construct command strings from user inputs, thus protecting against Command Injection Attacks. This approach contrasts with mitigations for other types of injection attacks, like SQL, File, or LDAP injections, which often involve proper input validation, parameterized queries, or specific encoding techniques.","zq":"使用安全 API、完全避免使用直譯器（interpreter），可以根除哪一種攻擊？","zo":["命令注入攻擊","SQL 注入攻擊","檔案注入攻擊","LDAP 注入攻擊"],"ze":"命令注入源自程式把使用者輸入拼接成系統指令交給 shell 執行。改用安全 API（不經 shell 直譯器）即可從根本消除。SQL 注入主要靠參數化查詢；LDAP 注入靠輸入驗證與跳脫。"},{"n":35,"c":"cti","q":"Shawn is a security manager working at Lee Inc Solution. His organization wants to develop threat intelligent strategy plan. As a part of threat intelligent strategy plan, he suggested various components, such as threat intelligence requirement analysis, intelligence and collection planning, asset identification, threat reports, and intelligence buy-in.\nWhich one of the following components he should include in the above threat intelligent strategy plan to make it effective?","o":["Threat pivoting","Threat trending","Threat buy-in","Threat boosting"],"a":1,"e":"In the context of a threat intelligence strategy plan, ‘threat trending’ is a critical component that should be included to make the plan effective. Threat trending involves analyzing data over time to identify patterns and trends in cyber threats. This allows an organization to anticipate potential future attacks and prepare accordingly. It is an essential part of a proactive threat intelligence program, enabling the organization to stay ahead of threats rather than just reacting to them.\nThe other options, while they may be relevant in certain contexts, are not as central to the development of a threat intelligence strategy plan as ‘threat trending’ is. ‘Threat pivoting’ refers to the process of using one piece of data to uncover more data (e.g., using an IP address to find related domains). ‘Threat buy-in’ is not a standard term in threat intelligence, but it could refer to gaining organizational support for threat intelligence efforts. ‘Threat boosting’ is not a recognized term in the field of cybersecurity.","zq":"Shawn 是 Lee Inc Solution 的資安經理，正在制定威脅情報策略計畫，已納入情資需求分析、情資收集規劃、資產識別、威脅報告、情資支持（buy-in）等元素。還應納入哪一項才能讓計畫有效？","zo":["威脅樞紐分析（Threat pivoting）","威脅趨勢分析（Threat trending）","威脅支持（Threat buy-in）","威脅強化（Threat boosting）"],"ze":"EC-Council 威脅情報策略元素包括：需求分析、收集規劃、資產識別、威脅報告、威脅趨勢、情資支持等。威脅趨勢分析透過長期資料找出攻擊模式，使組織能預判未來威脅。"},{"n":36,"c":"log","q":"Which of the following Windows event is logged every time when a user tries to access the \"Registry\" key?","o":["4656","4663","4660","4657"],"a":3,"e":"The Windows event that is logged when a user tries to access a “Registry” key is identified by the event ID 4657. This event ID corresponds to the modification of a registry value. Here’s how the process is tracked and logged:\nDetection: The system monitors access to registry keys and values.\nLogging: If a user accesses a registry key, and the key’s audit policy is set to log such events, the event is logged.\nEvent ID 4657: This specific event ID is used to denote that a registry value wasmodified, which includes creation, modification, and deletion of registry values.\nAudit Policy: For the event to be logged, “Set Value” auditing must be enabled in the registry key’s System Access Control List (SACL).","zq":"每次使用者嘗試存取「登錄檔（Registry）」機碼時，會記錄哪一個 Windows 事件？","zo":["4656","4663","4660","4657"],"ze":"題庫答案為 4657（登錄值已被修改），需在機碼 SACL 啟用「設定值」稽核。補充：4656 是要求物件控制代碼、4663 是嘗試存取物件、4660 是物件已刪除。"},{"n":37,"c":"log","q":"What does HTTPS Status code 403 represents?","o":["Unauthorized Error","Not Found Error","Internal Server Error","Forbidden Error"],"a":3,"e":"The HTTPS status code 403 represents a Forbidden Error. This error occurs when the server understands the request but refuses to authorize it. Unlike the Unauthorized Error (401), which suggests that the request might be authorized if the client re-authenticates, the Forbidden Error indicates that re-authenticating will make no difference and access is denied regardless of authentication status.\nThe Forbidden Error is tied to the application logic, such as insufficient rights to a resource or the server being programmed to deny access to a particular resource to the client. It is not related to the client’s credentials but rather to the permissions set by the server for the requested resource.","zq":"HTTP 狀態碼 403 代表什麼？","zo":["未授權錯誤","找不到錯誤","內部伺服器錯誤","禁止存取（Forbidden）錯誤"],"ze":"403 Forbidden：伺服器理解請求但拒絕授權，重新驗證也無效。401 Unauthorized 則表示需要（重新）驗證；404 找不到；500 伺服器內部錯誤。"},{"n":38,"c":"ir","q":"Jennifer, a SOC analyst, initiates an investigation after receiving an alert about potential unauthorized activity on Marcus's workstation. She starts by retrieving EDR logs from the endpoint, analyzing network traffic patterns in the Security Information and Event Management (SIEM) system, and inspecting email gateway logs for signs of malicious attachments. Her objective is to determine whether this alert represents a legitimate security incident. In which phase of the Incident Response process is Jennifer currently operating?","o":["Incident Triage","Evidence Gathering and Forensic Analysis","Notification","Incident Recording and Assignment"],"a":0,"e":"Jennifer is in the Incident Triage phase because she is validating whether the alert is a true incident and quickly assessing scope,
